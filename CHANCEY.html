<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chancey // Ops · Week 9 · C&C Health OS</title>
<style>
:root{
  --bg:#101413; --panel:#181E1C; --panel2:#121816; --ink:#E9EDE8; --dim:#8C968E;
  --acc:#C9A227; --acc2:#9DB07A; --good:#6FBF73; --warn:#E2B93B; --bad:#D96A5F; --line:#26302B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:16px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 120px}
.hdr{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 2px}
.brand{font-family:'Avenir Next Condensed','Arial Narrow','HelveticaNeue-CondensedBold',sans-serif;
  font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:26px;color:var(--ink)}
.brand b{color:var(--acc)}
.sys{font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:var(--dim);
  font-size:13px;font-weight:600;background:var(--panel)}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:6px}
.mission{border-left:3px solid var(--acc)}
.mission .p{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:20px;line-height:1.25;margin:2px 0 8px;text-transform:uppercase;letter-spacing:.02em}
.mission .r{font-size:13px;color:var(--dim);line-height:1.45}
.mission .m{font-size:14px;color:var(--acc2);font-style:italic;margin-top:9px;line-height:1.4}
.stitle{display:flex;justify-content:space-between;align-items:center;margin:18px 0 4px}
.stitle h2{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-size:19px;margin:0;
  text-transform:uppercase;letter-spacing:.05em}
.tag{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.exc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exname{font-weight:700;font-size:16.5px;line-height:1.25}
.sub{color:var(--warn);font-size:12.5px;font-weight:600}
.target{font-size:13px;color:var(--acc);font-weight:600;margin-top:3px}
.last{font-size:12px;color:var(--dim);margin-top:3px}
.cue{font-size:12.5px;color:var(--dim);margin-top:6px;padding:7px 9px;background:var(--panel2);
  border-radius:8px;line-height:1.4}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 74px 44px;gap:7px;align-items:center;margin-top:8px}
.setrow .n{color:var(--dim);font-size:12px;text-align:center}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
  padding:10px 8px;font-size:16px;width:100%}
textarea{min-height:44px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.ck{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);
  font-size:18px;font-weight:700}
.ck.done{background:var(--good);border-color:var(--good);color:#10130f}
.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;
  padding:9px 12px;font-size:13px;font-weight:600}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn.ghost{color:var(--dim)}
.gl{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--good);font-weight:700}
.tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tg{flex:1 1 28%;text-align:center;padding:9px 4px;border-radius:9px;border:1px solid var(--line);
  color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.03em}
.tg.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.tg.on.sore{background:#3d3a22;color:var(--warn);border-color:var(--warn)}
.tg.on.hurt{background:#41291f;color:#E59866;border-color:#E59866}
.tg.on.pain{background:#3f2320;color:var(--bad);border-color:var(--bad)}
.mfig{margin-top:9px;background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.mfig .act{font-size:12.5px;color:var(--acc2);margin-top:6px;line-height:1.4;text-align:left}
.mreg{fill:#2a3230;stroke:none}
.mreg.hot{fill:var(--acc)}
.mbody{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.55}
.subs{margin-top:9px;background:var(--panel2);border-radius:10px;padding:10px}
.subs .so{padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px}
.subs .so:last-child{border-bottom:none}
.rd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 2px}
.rb{padding:10px 0;text-align:center;border:1px solid var(--line);border-radius:9px;color:var(--dim);
  font-weight:700;background:var(--panel2)}
.rb.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.lbl{font-size:12px;color:var(--dim);margin-top:10px;letter-spacing:.06em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.banner{background:#3a2f1d;border:1px solid var(--warn);color:var(--warn);border-radius:12px;
  padding:11px;font-size:13px;line-height:1.4;margin:10px 0}
.adjust{background:var(--panel2);border-left:3px solid var(--warn);border-radius:10px;padding:11px;
  font-size:13px;color:var(--ink);margin:10px 0;line-height:1.45}
#timer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--acc);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;z-index:50}
#timer .tin{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
#tclock{font-family:'Avenir Next Condensed','Arial Narrow',monospace;font-size:30px;font-weight:800;color:var(--acc)}
#tbarw{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
#tbar{height:100%;background:var(--acc);width:100%}
#tlab{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.foot{margin-top:22px;text-align:center;color:var(--dim);font-size:11.5px;letter-spacing:.06em}
details summary{cursor:pointer;color:var(--acc);font-size:13px;font-weight:600;letter-spacing:.04em}
details .card{margin-top:8px}
.small{font-size:12.5px;color:var(--dim);line-height:1.45}
h3.sect{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;text-transform:uppercase;
  letter-spacing:.08em;font-size:15px;margin:16px 0 4px;color:var(--acc2)}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:9px 0}
.wk.today{border-color:var(--acc)}
.wkh{display:flex;justify-content:space-between;align-items:baseline}
.wkd{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:17px;
  text-transform:uppercase;letter-spacing:.06em}
.wk.today .wkd{color:var(--acc)}
.wkdate{font-size:12px;color:var(--dim)}
.wks{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px}
.wks .t{color:var(--ink)}
.wks .sub2{color:var(--dim);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.wks .st{font-weight:700;font-size:12.5px;color:var(--dim)}
.wks .st.done{color:var(--good)}
.wks .st.part{color:var(--warn)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--dim);vertical-align:1px}
.dot.Strength{background:var(--acc)} .dot.Mobility{background:var(--acc2)}
.dot.Walk{background:#7FB2C9} .dot.Zone2{background:#7FB2C9}
.prog{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--good)}
.home{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:10px;
  padding:8px 12px;font-size:13px;font-weight:700}
.done-big{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;border:1px solid var(--acc);background:transparent;color:var(--acc)}
.done-big.on{background:var(--good);border-color:var(--good);color:#10130f}
.frow{display:grid;grid-template-columns:1fr 44px 44px;gap:7px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.frow .ft{font-size:14.5px;font-weight:700;line-height:1.3}
.frow .fw{font-size:12px;color:var(--acc);font-weight:600;margin-left:3px;white-space:nowrap}
.frow .fs{font-size:12.5px;color:var(--dim);line-height:1.4;margin-top:2px}
.frow .fs.tg2{color:var(--acc2);font-weight:600}
.ck.miss{background:var(--bad);border-color:var(--bad);color:#10130f}
</style>
</head>

<script>
const CFG = {"name":"Chancey","brand":"CHANCEY <b>// OPS</b>","tag":"Semper Fi","key":"cchos_chancey_v1","whoop":false,"motiv":["Discipline got you here. Data keeps you here.","Slow is smooth, smooth is fast — that includes the rest between sets.","You're not chasing 22-year-old you. You're outlasting him.","The mission is 30 more good years. Today is one rep of it.","Block 2, week 1 of 6. New numbers, same rules.","Fuel is part of the set now. Log every feeding — the missed ones too.","495, 205, 100 on the row. All earned in Block 1. Go collect.","First week back. Set 1 tells the truth — listen to it.","The left arm sets the pace. The right arm follows.","Rest the full clock. That's the set. 60 means 60, too.","The tweak is data. Log it, adjust it, keep moving.","Thighs up an inch, waist down an inch. The tape already voted.","Six weeks to Nov 20. Then the week off is the deload.","Elbows in. Narrow grip. The left arm gets a lane, not a pass."],"sessions":[{"id":"mob1","date":"2026-10-12","title":"Mobility — 10 min","time":"Morning","kind":"act","badge":"Mobility","why":"The same ten minutes that kept the back quiet through Block 1. The first heavy press in two weeks is this afternoon","research":"Range of motion answers to total minutes per week and to how many days you stretch — at least 5 minutes a week per area, 5 days a week — more than to how long any one session runs (Thomas 2018). So if the rest week's morning stretches became a habit, keep them: the two carded days here plus a few loose minutes on the others is the better dose.","desc":"5 min easy bike if there's no mat. Then: cat-cow ×10, bird-dog ×8/side, half-kneeling hip-flexor stretch 45s/side RIGHT first, deep squat hold 30s (heels down, hold a post), band external rotation ×20/side LEFT first — slow, elbow pinned to the ribs. Note what catches.","distLabel":"—"},{"id":"push1","date":"2026-10-12","title":"Push — Block 2 · Wk 1","time":"Afternoon","kind":"lift","badge":"Strength","why":"Block 2 opens. 205 on the Matrix, 25s on the raise, 80 on the pushdown, 20 on the cable — every one of those was earned on 9/21 and 9/24. Today you collect","research":"BLOCK 2, WEEK 1 OF 6. Six training weeks, Oct 12 – Nov 20. The Thanksgiving week off does the job of the deload, and Block 3 opens Nov 30. FIRST WEEK BACK: you've had a half-volume week and then a full week off. Two studies on exactly that: trained men who stopped lifting for two weeks kept their lean mass and their strength (Hwang 2017), and a full week off in the middle of a nine-week program cost no muscle (Coleman 2024). Coleman's week-off group did gain a little less lower-body strength, so a new number can feel heavier today than the math says. That's what the fallback is for — set 1 at 1 RIR or less = the old number for the rest of the sets, logged. That's calibration, not a miss. CORRECTION TO THE DELOAD CARDS: they credited Coleman 2024 with the cut-the-sets, keep-the-load design. That trial tested a full week off. The design you ran comes from the coaches' consensus (Bell 2023: drop the volume, load can stay, stop further from failure). Same week, right source. GREEN LIGHTS: cleared for the new block — Block 1's are archived, not lost. A green from here on means earned at a Block 2 number. THE MAP, BOTH SIDES NOW: on 9/28 you tried one normal-width rep on the DB press — 'I thought both shoulders were gonna fall off. Fast pain in the shoulder bicep area. Shifted right back to narrow and it was fine.' That's the map confirmed on the right as well as the left. Every press this week stays inside it: narrow, elbows in, no stretch at the bottom. One more piece of information, yours to use or not: a fast, sharp pain that a single position switches on and off is the kind of thing a clinician can usually put a name to in a short exam, and a name would let me program around it instead of guessing. FUEL STARTS TODAY: the Fuel card under the check-in is the schedule; MacroFactor is the log. CHEST PRESS: 205 Matrix (you did 205×10 @2 on 9/21) or 185 Life Fitness. Log the machine. PEC DECK and FRONT RAISE hold their weight and climb in reps — the next plate on both is too big a step to take in one go.","warmup":"5 min: band pull-aparts ×15, band external rotation ×20/side LEFT first (elbow pinned), arm circles, pec deck 40×15 easy. Chest press ramp 100×10, 145×6, 175×3 — 60s between.","ex":[{"name":"Machine Chest Press (Matrix converging or Life Fitness)","sets":4,"reps":"8-10","load":"205 Matrix · 185 LF","last":"Matrix 205×10 @2 (9/21) · LF 175×10 @5/4 (9/28) — 'Felt good at 175.'","rest":150,"cue":"205 on the Matrix, 185 on the LF. 4×8–10 @2, narrow handles, elbows at 45°. Set 1 at 1 RIR or less = 190 (175 LF) for the rest. 4×10 @2 opens the next plate. Log which machine.","subs":["Hammer Strength Chest Press","Pec Deck","DB Floor Press (neutral grip)"]},{"name":"Neutral-Grip DB Press — elbows IN, short range — pain-gated","sets":3,"reps":"10-12","load":"65","last":"65×10 @4/4 (9/28) — one normal-width rep: 'both shoulders were gonna fall off'; narrow 'was fine'","rest":120,"cue":"65, three sets, narrow only — you tested normal width on 9/28 and got the answer. Palms facing, elbows to the ribs, stop 2–3\" above the chest. 3×12 @2 opens 70. Any ache = log the set count and finish on the pec deck.","subs":["Pec Deck (pads short)","Hammer Strength Chest Press (narrow)","Skip"]},{"name":"Pec Deck (pads set SHORT)","sets":3,"reps":"12-15","load":"85","last":"85×12 @2/2/3 (9/21)","rest":60,"cue":"85 holds. Add reps first: 3×15 @2, then the next plate. Pads forward — arms never open past the shoulders.","subs":["DB Fly (light, elbows bent)","Cable Crossover (hip → mid, short range)"]},{"name":"DB Lateral Raise — both arms — SUPERSET with #5","sets":3,"reps":"12","load":"25","last":"22.5×15 @4/2/0 (9/21) · 22.5×15 @4/3/2 (9/24) — 25 opened","rest":60,"cue":"25s. 12 clean, straight into the front raise. Round 3 short of 10 = 22.5 for that round, log it.","subs":["Cable Lateral Raise","Machine Lateral Raise"]},{"name":"Cable Front Raise (to eye level) — SUPERSET with #4","sets":3,"reps":"12-15","load":"10","last":"10×12 @2/2/1 (9/21)","rest":60,"cue":"10 holds — 15 is a 50% jump. 3×15 @2 opens it. The 60 is after this one. Left arm sets the height.","subs":["Plate Front Raise","DB Front Raise"]},{"name":"Triceps Pushdown (bar)","sets":3,"reps":"10-12","load":"80","last":"72.5×12 @6+/6+/4 (9/21) · 80×12 @3/2 (9/24)","rest":60,"cue":"80, elbows pinned. 3×12 @2 opens the next plate.","subs":["Rope Pushdown","OH Cable Ext","Bench Dips"]},{"name":"One-Arm OH Cable Ext — LEFT FIRST","sets":3,"reps":"10-12","load":"20","last":"20×10 @2 (9/21) · 20×15 @1 (9/24)","rest":60,"cue":"20 is the number. Left first, left sets the count. 3×12 @2 opens 25.","subs":["DB OH Ext (single, light)","Rope OH Ext"]},{"name":"Hanging Knee Raise — lower half — back-gated","sets":3,"reps":"15-20","load":"BW","last":"20/13/25 @1/1/0 (9/21) — grip and abs finishing together","rest":60,"cue":"Sets 1–2 with the 3s lowering, set 3 normal tempo. Stop when the grip goes and log the count. The grip gets its own card on Friday.","subs":["Dead Bug ×10/side","Reverse Crunch on bench","Captain's Chair Raise"]}]},{"id":"pull1","date":"2026-10-13","title":"Pull — Block 2 · Wk 1","time":"Afternoon","kind":"lift","badge":"Strength","why":"ISO row goes to 100, the high pull goes to 55. Pulldown and cable row hold their numbers and chase the reps they were short on 9/22","research":"BLOCK 2, WEEK 1 OF 6. Fallback rule on every jump: set 1 at 1 RIR or less = the old number for the rest of the sets, logged. PULLDOWN: 225 plate-loaded or 160 on the cable — both hold. The plate-loaded gate is still 4×12 @2, but the step after it is 245 (a 10 a side), not 275. A 9% jump keeps you in the rep range; a 22% jump doesn't. CABLE ROW: 155 went @1/1/1/0 on 9/22. It holds until the first three sets are @2. ISO ROW: 100 — the gate was 90×12 @3 across and you met it. FACE PULL: your verdict stands, it's the main card. EZ CURL: 80. The rule from 9/22 was 80 if the left elbow stayed quiet through the deload, and your 9/29 note was 'No pain anywhere today.' The fallback is 70×12. STANDING CURL: 30, strict — your own 9/29 verdict: 'they were strict and felt great.' 35 went to zero in the tank on both sets on 9/22; 30 done right is the better set. CURL VOLUME, as information, not an instruction: Tuesday plus Thursday is 19 direct curl sets a week, on top of 14 sets of rows and pulldowns that also load the biceps. The dose-response data (Pelland 2024) says more sets keep adding growth, with each added set adding less. So if the elbow or the tendon at the shoulder speaks up, the standing curl at the end of this session is the cheapest thing on the week to drop. HIGH PULL: 55 — a 45 plate and a 10 held together, or one 55 dumbbell in both hands.","warmup":"Band rows ×20, band external rotation ×20/side LEFT first (elbow pinned), dead hang 20s, pulldown ramp 135×10, 185×6 (or cable 100×10, 130×6) — 60s between.","ex":[{"name":"Lat Pulldown (LF plate-loaded 225 · or LF cable 160)","sets":4,"reps":"10-12","load":"225 · or 160 cable","last":"Plate 225×12/12/10/9 @2/1/2/2 (9/15) · 225×10 @4/4 (9/29) · cable 160×10 @2/1/1/0 (9/22)","rest":150,"cue":"Plate-loaded if it's free: 225, 3s return, 4×12 @2 opens 245. Cable: 160, 4×10 with the first three @2 opens 170. Full 150 before set 4. Log which.","subs":["Cable-stack Lat Pulldown","Assisted Pull-up","Machine Pullover"]},{"name":"Seated Cable Row (Life Fitness low row, 2s return)","sets":4,"reps":"10","load":"155","last":"155×10 @1/1/1, 8 @0 (9/22) · 155×9/8 @4 (9/29)","rest":120,"cue":"155 holds. 2s return. First three sets @2 opens 165. Cable row taken: LF ISO at 130.","subs":["Chest-Supported Row Machine","ISO-Lateral Low Row","Single-Arm Cable Row"]},{"name":"Single-Arm Row — LEFT FIRST (Life Fitness ISO)","sets":3,"reps":"10-12","load":"100","last":"90×12 @3/3/3 (9/22) — gate met","rest":90,"cue":"100, 3s return, left first and left sets the reps. Left under 10 on set 1 = 90 for the rest.","subs":["Single-Arm DB Row (bench)","One-arm Cable Row"]},{"name":"Face Pull (staggered stance)","sets":3,"reps":"15","load":"25","last":"25×15/13/15 @2/3/3 (9/24) — 'liked this much better'","rest":60,"cue":"25, slight squat, pull to the face, 1s at the back. Set 3 at 30 if set 2 is @3. Matrix diverging row is the sub if the cable's taken.","subs":["Rear Delt — Matrix diverging, face-pull grip","Rear-Delt Fly (machine)","Reverse Pec Deck"]},{"name":"Straight-Arm Cable Pulldown","sets":3,"reps":"12","load":"50 (or 52.5)","last":"50×12 @4/2/? (9/22) · 52.5×12 @2/2/0 (9/15)","rest":60,"cue":"50 or 52.5, depending on the stack. Full 60 before set 3. 3×12 @2 opens 57.5.","subs":["Cable Pullover","DB Pullover"]},{"name":"EZ-Bar Curl","sets":3,"reps":"8-10","load":"80","last":"70×10 @4/4 (9/29) — 'No pain anywhere today.'","rest":90,"cue":"80 — the elbow earned it. 8–10 @2. Left elbow speaks on set 1 = 70×12 for the rest, and log it. Bars go in 10s.","subs":["Low-pulley EZ Curl","DB Curl"]},{"name":"Cross-Body Hammer Curl — LEFT FIRST","sets":3,"reps":"8","load":"45","last":"45×8 @1/1/0 (9/22) — 'RIR is always the left'","rest":90,"cue":"45 holds. Full 90. All three @2 opens 50.","subs":["Rope Cable Hammer","Straight Hammer Curl"]},{"name":"Standing DB Curl — alternating, LEFT starts","sets":2,"reps":"10-12","load":"30","last":"30×8 @4 (9/29) — 'strict and felt great!' · 35×10 @0, 35×8 @0 (9/22)","rest":60,"cue":"30, strict, the way you ran it on 9/29. Left sets the count, right matches and stops. Both sets of 12 @2 opens 35. First card to drop if the elbow talks.","subs":["Cable Curl","Skip"]},{"name":"Plate High Pull — hands to chin, elbows high","sets":3,"reps":"15","load":"55","last":"45×20 @4/4/2 (9/22)","rest":90,"cue":"55: a 45 and a 10 held together, or one 55 DB in both hands. Elbows above the hands at the top, 1s. Awkward to hold = 45×25 and log it. Left shoulder pinch = stop at the sternum.","subs":["DB High Pull","Cable Upright Row (wide)"]},{"name":"Hanging Knee Raise — upper half","sets":3,"reps":"12-15","load":"BW","last":"15/15/9 @2/0/0 with 2s hold (9/22)","rest":60,"cue":"The 2s hold is the exercise. 3×12 with it, then build to 15. Full 60.","subs":["Captain's Chair Raise","Reverse Crunch on bench","Dead Bug ×10/side"]}]},{"id":"z2a","date":"2026-10-13","title":"Zone 2 — 20 min · optional","time":"After the lift","kind":"act","badge":"Zone2","opt":true,"why":"Cardio and flexibility are the two gaps on your profile. One beach walk a week holds the line; it doesn't move it","research":"Easy cardio in the same session doesn't take from muscle or max strength: a 43-study meta-analysis found no interference with either (Schumann 2022). The one cost it found was in explosive power, which isn't what this block trains. After the lift, never before it. This card is optional — it doesn't count against the week if you skip it.","desc":"Bike, incline walk or elliptical, straight after the last set. Easy enough for full sentences the whole way. 20 minutes. Log the minutes and the distance. Day ran long = skip it.","distLabel":"Distance (mi)"},{"id":"mob2","date":"2026-10-14","title":"Mobility — 15 min","time":"Morning","kind":"act","badge":"Mobility","why":"Leg day. You named the leg-press limiter yourself: flexibility, not weight. 495 goes on this afternoon, and the depth comes from here","research":"The deep squat hold, the adductor rock-backs and the 90/90 are the leg-press depth work. Slow. Note what catches — at 495 the rule is the depth you own with the tailbone down, and no more.","desc":"Easy bike 5 min if no mat. Then: 90/90 hip switches ×5/side, half-kneeling hip-flexor stretch 45s/side RIGHT first, adductor rock-backs ×10 (hold the last one 20s), deep squat hold 2×30s (heels down, hold a post), dead bug ×8/side, band external rotation ×15/side LEFT first.","distLabel":"—"},{"id":"legs1","date":"2026-10-14","title":"Legs — Block 2 · Wk 1","time":"Afternoon","kind":"lift","badge":"Strength","why":"495. You cleared the gate on 9/23 with 455×10 @4 across — two more in the tank than it asked for on every set. Everything else on this day takes its step too","research":"BLOCK 2, WEEK 1 OF 6. Fallback rule on every jump: set 1 at 1 RIR or less = the old number for the rest of the sets, logged. LEG PRESS: 495 is a 9% jump after a light week and a week off, so the target is 4×8, not 4×10, and rest goes to 3 minutes. Tailbone rule unchanged. DEPTH: your note stands — 'the range is not a weight issue, it's a flexibility issue.' At 495, take the depth you own with the tailbone down. ADDUCTOR: 55 holds; width 7 is the progression. SPLIT SQUAT: 40 — it was @6+ at 35. LEG CURL: 80. LEG EXTENSION: 100. CALF: 65 on the Matrix cable, 55 on the plate-loaded — two machines, two numbers, log which. THE TAPE: both thighs are up 1.00\" since August at the same 6\" mark, and the waist is down 1.00\". This is the day that did it.","warmup":"5 min bike, bodyweight squat ×15, 90/90 ×5/side, hip-flexor stretch 30s RIGHT first. Leg press ramp 135×12, 225×8, 315×5, 405×3, 455×1 — 60s between.","ex":[{"name":"Leg Press (Life Fitness linear — feet HIGH)","sets":4,"reps":"8","load":"495","last":"455×10 @4/4/4/4 (9/23) — gate cleared, 'legs are strong when I focus'","rest":180,"cue":"495. 4×8 @2, tailbone on the pad, brace before every unrack. Set 1 at 1 RIR or less = 455 for the rest. 4×10 @2 is the next gate.","subs":["Hack Squat","Belt Squat","Goblet Squat"]},{"name":"Seated Adductor Machine (2s hold)","sets":3,"reps":"15","load":"55","last":"55×15 @3/4/? (9/23)","rest":90,"cue":"55, width 7, 2s at the squeeze. Width 7 changes the feel in the right groin = back to 6, log it.","subs":["Copenhagen Plank (knee)","Side-lying Adductor Raise","Cossack Squat (BW)"]},{"name":"Bulgarian Split Squat — LEFT LEG FIRST — right-hip-gated","sets":3,"reps":"10","load":"40","last":"35×10 @6+/6+/4 (9/23)","rest":150,"cue":"40, same short stance, DB in the opposite hand, left first.","subs":["DB Reverse Lunge — LEFT first","Step-up (LEFT first)","Leg Press single-leg"]},{"name":"Seated Leg Curl (2s hold)","sets":3,"reps":"8-10","load":"80","last":"75×10 @3/2/1 (9/23) — 3×10 hit","rest":90,"cue":"80 with the hold. Set 3 can drop to 75 if set 2 is @1. 3×10 opens 85.","subs":["Lying Leg Curl","Nordic Negatives","Cable Pull-through"]},{"name":"Leg Extension","sets":3,"reps":"12","load":"100","last":"90×12 @5/6+/3 (9/23) — 'easy'","rest":90,"cue":"100, 1s squeeze at the top. 3×12 @2 opens 110.","subs":["Sissy Squat (BW)","Single-leg Extension"]},{"name":"Seated Calf Raise (Matrix free-motion or plate-loaded, 3s bottom hold)","sets":3,"reps":"12","load":"65 Matrix · 55 plate","last":"Matrix 55×12 @6+/5/3 (9/23) — cable machine","rest":60,"cue":"65 on the Matrix, 55 on the plate-loaded, 3s at the bottom. Log the machine.","subs":["Standing Calf Raise","Leg-press Calf Press","Single-leg BW on step (3s down)"]},{"name":"Hanging Knee Raise — lower half — back-gated","sets":3,"reps":"15-20","load":"BW","last":"20/20/3 @2/1/0 (9/23) — 'grip was done'","rest":60,"cue":"Knees to 90, 3s down. Third day on the bar this week, with Friday's hang still to come — grip gone = take the dead bug and save it.","subs":["Dead Bug — 3s reach","Reverse Crunch on bench","Hanging Knee Raise (full) — back-gated"]}]},{"id":"arms1","date":"2026-10-15","title":"Arms + Shoulders — Block 2 · Wk 1","time":"Afternoon","kind":"lift","badge":"Strength","why":"Thursday, the order you run it in. Shoulder press goes to 40, reverse curl to 50, pushdown 80, seated extension 130, halo 35 — all earned on 9/24","research":"BLOCK 2, WEEK 1 OF 6. Fallback rule on every jump: set 1 at 1 RIR or less = the old number for the rest of the sets, logged. SHOULDER PRESS: 40, with the rotation, tight to the body. Your 10/1 note said it exactly: 'No pain. But that's bcs it was tight to body.' Tight is the condition, not the weight — if 40 pulls the elbows out, 35 is the number. PREACHER: 55 if it's free; strict standing DB curl at 50 if it's taken again. Your 9/24 question on heavy-and-loose vs lighter-and-strict has the same answer in Block 2: taken close to failure, a wide range of loads builds the same muscle (Schoenfeld 2017), so the strict rep wins — it's the one that loads the biceps and spares the elbow. INCLINE CURL 30 and HAMMER 45 both hold; neither was @2 across. HALO: 35 plate. No tweak reported since Week 4, so that question is closed unless it comes back. THE TAPE: flexed arms are +1.00\" left and +0.50\" right since August.","warmup":"Band pull-aparts ×15, band external rotation ×20/side LEFT first (elbow pinned), light curls ×15, light pushdowns ×15, 20×10 then 30×5 DB press easy — how does the left feel going up?","ex":[{"name":"DB Lateral Raise — both arms","sets":3,"reps":"12","load":"25","last":"22.5×15 @4/3/2 (9/24) — set 3 @2, 25 opened","rest":60,"cue":"25s, three sets of 12. Monday tells you how today goes: short on round 3 Monday = 22.5 for set 3 here.","subs":["Cable Lateral Raise","Machine Lateral Raise"]},{"name":"Face Pull (staggered stance)","sets":3,"reps":"15","load":"25–30","last":"25×15/13/15 @2/3/3 (9/24) — 'liked this much better'","rest":60,"cue":"25 for set 1; 30 for sets 2–3 if it's @3. 1s at the back.","subs":["Rear Delt — Matrix diverging, face-pull grip","Rear-Delt Fly (machine)","Reverse Pec Deck"]},{"name":"Seated DB Shoulder Press — palms in, rotate out — YOUR CALL","sets":3,"reps":"8-10","load":"40/db","last":"35×10 @4/6+/5 (9/24) · 35×10 @4/4 (10/1) — 'No pain. But that's bcs it was tight to body'","rest":120,"cue":"40s, same rotation, tight to the body the whole way. Left sets the depth. Can't keep it tight at 40, or any pinch = 35, log it.","subs":["Landmine Press (light)","Machine Shoulder Press (light)","Skip"]},{"name":"Preacher Curl (machine)","sets":3,"reps":"10-12","load":"55","last":"55×10 @5/3/2 (9/17) · standing DB 50×10 @3/2 (9/24) · 40×8/7 @4 (10/1)","rest":90,"cue":"55, 3s down, full stretch. 3×12 @3 opens 60. Taken again: strict standing DB curl, 45×8–10, 3s down.","subs":["Standing DB Curl — strict, 3s down — 45","EZ-Bar Curl","Cable Curl"]},{"name":"Incline DB Curl — alternating, 3s down","sets":3,"reps":"8-10","load":"30","last":"30×10 @1/1, 30×8 @0 (9/24) — 'very honest 3s up and down'","rest":90,"cue":"30 holds, with the same honest 3s. Three sets of 10 @2 opens 35.","subs":["Bayesian Cable Curl","Preacher Curl"]},{"name":"Hammer Curl — straight — LEFT FIRST","sets":3,"reps":"8","load":"45","last":"45×8 @2/2/0 (9/24)","rest":90,"cue":"45 holds, left first, left sets the count. All three @2 opens 50.","subs":["Rope Cable Hammer","Cross-Body Hammer"]},{"name":"Reverse-Grip EZ Curl — forearms","sets":2,"reps":"12-15","load":"50","last":"40×15 @6+ (9/24, 10/1) — 'Too easy'","rest":60,"cue":"50, wrists straight. Bars go in 10s — no 50 free: 40×20 with 3s down.","subs":["DB Wrist Curl + Extension ×15 each","Plate Pinch Hold 30s","Cable Reverse Curl"]},{"name":"Triceps Pushdown — bar or rope (1s bottom hold)","sets":3,"reps":"12","load":"80","last":"Bar 72.5×12 @6+, 80×12 @3/2 (9/24)","rest":60,"cue":"80, bar or rope, 1s at the bottom. 3×12 @2 opens the next plate.","subs":["Single-arm Pushdown","OH Cable Ext"]},{"name":"Seated Triceps Extension (Hammer Strength cable)","sets":3,"reps":"10-12","load":"130","last":"120×12 @4/3, 130×12 @2 (9/24)","rest":60,"cue":"130 for all three. Elbow complaint here = log it.","subs":["One-Arm OH Cable Ext — LEFT FIRST","Bench Dip — pain-gated","Rope OH Ext"]},{"name":"One-Arm OH Cable Ext — LEFT FIRST","sets":2,"reps":"10-12","load":"20","last":"15×15 @4, 20×15 @1 (9/24)","rest":60,"cue":"20, left first.","subs":["DB OH Ext (single, light)","Rope OH Ext"]},{"name":"Plate Halo — 'Around the World'","sets":2,"reps":"12","load":"35 plate","last":"25×15 @6+ (9/24) — 'too easy, lungs got a workout'","rest":90,"cue":"35 plate, two sets. Any tweak = log exactly where.","subs":["DB Front Raise","Skip"]}]},{"id":"z2b","date":"2026-10-15","title":"Zone 2 — 20 min · optional","time":"After the lift","kind":"act","badge":"Zone2","opt":true,"why":"Second optional 20. Day after legs, so easy spinning does double duty as recovery","research":"Easy cardio in the same session doesn't take from muscle or max strength: a 43-study meta-analysis found no interference with either (Schumann 2022). The one cost it found was in explosive power, which isn't what this block trains. After the lift, never before it. This card is optional — it doesn't count against the week if you skip it.","desc":"Bike, incline walk or elliptical, straight after the last set. Easy enough for full sentences the whole way. 20 minutes. Log the minutes and the distance. Day ran long = skip it.","distLabel":"Distance (mi)"},{"id":"post1","date":"2026-10-16","title":"Posterior + Back — Block 2 · Wk 1","time":"Afternoon","kind":"lift","badge":"Strength","why":"Your two requests from 10/2 are both on this card: the RDL is on the Olympic bar, and the plank logs seconds for front, left and right","research":"BLOCK 2, WEEK 1 OF 6. THE RDL IS ON THE OLYMPIC BAR. You asked on 10/2: 'DB is awkward. Unless you know why otherwise.' There's no reason otherwise — the dumbbells were only there while the hinge was gated. The bar is the better tool: it stays against the thighs and it loads in small steps. Bar plus a 25 a side is 95, one step up from the two 35s that went ×10 @4 — 'That was nice.' Two sets, stop with 3–4 in the tank. 95 @4 or better with a quiet back = 115 next week. THE ORDER is exactly the one you ran in the deload, because you said why it worked: 'I like the break w the back between hypers and this.' Pull-through, back extension, row, then the bar. Your back-extension note that day — 'nowhere as much as previous weeks. No pain just really engaged.' — is the pull-through going first and doing its job. PLANK IN SECONDS — your 10/2 request, 'so we can see where stability is bad and good': one card, six rows — front, left, right, twice through. Type the seconds you held. Left and right get their own numbers for a reason: McGill's torso-endurance testing treats a side-to-side gap of more than 5% as the thing to watch, and 'one round' can't show it. Targets are 60 front and 30 a side — your own 9/25 note, 'need to go to 1 min front at least.' GRIP: the dead hang has its own timed card. Your August baseline was 53 seconds fresh; this one comes after carries, the bar and rows, so expect less. Whatever you hold today is the number to beat next Friday. CARRIES 70. MATRIX ROW 100 — 'start at 100 next time.' SHRUG 65.","warmup":"Cat-cow ×10, bird-dog ×8/side, hinge drill with a dowel ×10 — hips back, dowel touching head, upper back, tailbone. No mat: bike 5 min, then the dowel drill standing.","ex":[{"name":"Suitcase Carry — LEFT HAND FIRST","sets":3,"reps":"40 yd/side","load":"70","last":"60 × 3×40 yd (9/25) — '15 more yards of grip on the third' · 50 × 2 (10/2)","rest":90,"cue":"70. Tall, no lean, other arm quiet, left first. Low back working is the point; low back pinching is not — log which.","subs":["Farmer Carry (both hands)","Rack Carry"]},{"name":"Cable Pull-Through","sets":3,"reps":"12","load":"35","last":"30×12 @6+/6+ (9/25) · 30×12 @4/4 (10/2) — 'Feels good. Nice form today.'","rest":90,"cue":"35 for set 1; next plate up for sets 2–3 if it's @4 or better. Hips back, let the cable set the hinge. This goes first on purpose — it's why the back extension felt better on 10/2.","subs":["Kettlebell/DB Swing (light)","Hip Thrust (BW)"]},{"name":"45° Back Extension (BW)","sets":3,"reps":"12","load":"BW","last":"BW×12 ×3 (9/25) · BW×10 @4/4 (10/2) — 'nowhere as much as previous weeks. No pain just really engaged.'","rest":90,"cue":"Glutes squeeze at the top, spine long. 3×12, and log the RIR. Set 3 stops at 10 if it's headed to 0.","subs":["Bird-dog ×10/side","Glute Bridge ×15","Cable Pull-through"]},{"name":"Chest-Supported Row — Matrix diverging, ROW grip","sets":3,"reps":"10-12","load":"100","last":"80×12 @3/4, 100×12 @2 (9/25) — 'start at 100 next time'","rest":120,"cue":"100 from set 1, 2s return, chest on the pad. 3×12 @2 opens 110. Taken = LF ISO at 130.","subs":["ISO-Lateral Low Row","Seated Cable Row","Machine Pullover"]},{"name":"Barbell RDL — Olympic bar","sets":2,"reps":"8-10","load":"95 (bar + 25s)","last":"DB RDL 35×10 @4 (10/2) — 'That was nice… Let's do the Olympic bar next time. DB is awkward.'","rest":120,"cue":"Bar plus a 25 a side. Empty bar ×8 first. Hips back, bar on the thighs the whole way down, stop at mid-shin, 2s down. Stop with 3–4 in the tank. Back speaks up = done for today, log where.","subs":["DB RDL — 35s","Trap-bar DL (light)","Skip"]},{"name":"DB Shrug (1s hold)","sets":2,"reps":"15","load":"65","last":"60×15 @4/2 (9/25)","rest":60,"cue":"65, 1s at the top, two sets.","subs":["Trap-bar Shrug","Cable Shrug"]},{"name":"Dead Hang — for time","sets":2,"reps":"30+ sec","load":"BW","unit":"sec","secs":[30],"last":"53s fresh (August baseline) — first time after a full session","rest":90,"cue":"The grip card. Full hang, shoulders packed, let go 3–5s before the hands open. Type the seconds. Two hangs, full 90 between.","subs":["Farmer Hold — 70s, for time","Plate Pinch Hold — for time, each hand"]},{"name":"Plank Finisher — front / left / right","sets":6,"reps":"60 / 30 / 30 sec","load":"BW","unit":"sec","rows":["Front","Left","Right"],"secs":[60,30,30],"restEvery":3,"target":"2 rounds · 60s front · 30s left · 30s right","last":"3 rounds of 30/20/20 (9/25) — 'need to go to 1 min front at least'","rest":45,"cue":"Seconds, not rounds. Front, left, right back to back, then the 45 — the timer starts after the right side. Held short = type the real number. ＋Set adds rows for a third round.","subs":["Dead Bug ×10/side","Bird-dog ×10/side"]}]},{"id":"z2","date":"2026-10-17","title":"Zone 2 — Beach","time":"Saturday morning","kind":"act","badge":"Zone2","why":"Saturday, no lift in front of it. Week 1 of Block 2 closes when this is logged","research":"The target most guidelines use is 150 minutes of moderate work a week (WHO 2020). This walk is 30–40 of them. Tuesday's and Thursday's optional 20s are the rest of the way toward it.","desc":"30–40 min easy beach walk. Full sentences the whole way. Log distance and minutes here. Then export the week and send it to Claude with the MacroFactor Quick Export. Sunday is rest.","distLabel":"Distance (mi)"}],"restDate":"2026-10-18","tags":[{"l":"STRONG"},{"l":"SMOOTH"},{"l":"DIALED"},{"l":"GAS IN TANK"},{"l":"FIRED UP"},{"l":"TWEAK","cls":"hurt"}],"deload":false,"block":2,"weekLabel":"Week 9 · Oct 12 – 17 · Block 2 · Wk 1 of 6","fuel":{"on":true,"phase":"Fuel · Lean gain · Block 2","targets":{"lift":{"k":3100,"p":200,"c":370,"f":90},"rest":{"k":2900,"p":200,"c":320,"f":90}},"fiber":"35–45","creatine":5,"lift":[{"id":"brk","l":"Breakfast","when":"5:30 AM","t":"Protein 35 g · carbs 60 g","cue":"3 eggs + ½ cup egg whites, oatmeal, a banana. The first of five 35 g protein feedings."},{"id":"sh1","l":"Shake","when":"8:15 AM","t":"Protein 25 g · carbs 30 g","cue":"One scoop of whey and a piece of fruit."},{"id":"snk","l":"Snack — food, not a shake","when":"10:00 AM","t":"Carbs 35 g · fiber","cue":"Fruit and a handful of nuts, or a granola bar. Protein is already covered at 8:15 and 12:00 — this slot carries carbs and fiber. No food possible between classes: swap it with the 8:15."},{"id":"lun","l":"Lunch","when":"12:00 PM","t":"Protein 35 g · carbs 70 g","cue":"6 oz chicken, turkey or lean beef, 1½ cups rice or a large potato, vegetables."},{"id":"pre","l":"Pre-lift","when":"2:45 PM","t":"Carbs 40 g","cue":"Fast carbs: a banana and two rice cakes, or half a bagel with jam. Your first set lands around 3:25. This is the feeding the 5:00 drop has been asking for."},{"id":"post","l":"Post-lift","when":"within 45 min of the last set","t":"Protein 35 g · carbs 60 g","cue":"Your logs put the last set near 4:30 — 5:15 on pull day — so this is 4:30–5:15, not 4:00. A shake plus oats and fruit, or a turkey sandwich and fruit. Not a sugar-only shake: slower carbs here are the fix for the drop."},{"id":"brg","l":"Bridge snack — only if the drop shows","when":"~5:00 PM","t":"Carbs 20 g","opt":true,"cue":"Fruit or yogurt. Tap ✓ only on days you needed it. Whether the drop still happens is the data."},{"id":"din","l":"Dinner","when":"6:30 PM","t":"Protein 35 g · carbs 60 g","cue":"6–8 oz meat or chicken, a starch, vegetables, some fat. Restaurant nights: a protein entrée, one starch, a vegetable — log the closest match in MacroFactor."},{"id":"bed","l":"Pre-sleep","when":"9:30 PM","t":"Protein 35 g · carbs 10 g","cue":"Slow protein: a casein shake, or 1½ cups cottage cheese or Greek yogurt."}],"rest":[{"id":"brk","l":"Breakfast","when":"on waking","t":"Protein 35 g · carbs 70 g","cue":"Same breakfast as a school day, with an extra piece of fruit or toast."},{"id":"sh1","l":"Shake","when":"mid-morning","t":"Protein 25 g · carbs 30 g","cue":"One scoop of whey and a piece of fruit. Saturday: after the beach walk."},{"id":"lun","l":"Lunch","when":"midday","t":"Protein 35 g · carbs 80 g","cue":"6 oz chicken, turkey or lean beef, rice or potato, vegetables."},{"id":"aft","l":"Afternoon","when":"3–4 PM","t":"Protein 35 g · carbs 50 g","cue":"Greek yogurt with fruit and granola, or a shake and a sandwich half. This one is the weekend's usual miss."},{"id":"din","l":"Dinner","when":"6:30 PM","t":"Protein 35 g · carbs 80 g","cue":"6–8 oz meat or chicken, a starch, vegetables, some fat. Restaurant: protein entrée, one starch, a vegetable — log the closest match."},{"id":"bed","l":"Pre-sleep","when":"9:30 PM","t":"Protein 35 g · carbs 10 g","cue":"Slow protein: a casein shake, or 1½ cups cottage cheese or Greek yogurt."}],"rules":["Every bite goes in MacroFactor — off-plan and restaurant meals included.","Morning weight in MacroFactor every day: after the bathroom, before food.","On this card: ✓ when you eat a feeding, ✕ when you miss one. A missed meal is data. We have to know.","Tape guardrail: waist at the navel was 36.0\" on Oct 4. Nov 1 tape at 36.5\" or under = keep going. Over = back to maintenance."],"why":"The goal you set: bigger and stronger all around, body fat held where it is, scale allowed to rise with muscle. The research is consistent on how to do that. In trained lifters, a 15% surplus added fat faster than a 5% surplus without clearly adding more muscle (Helms 2023), so the surplus here is small: about 200 kcal over estimated maintenance on lift days, maintenance on rest days. The target is a quarter to half a pound a week on the MacroFactor trend — the conservative end of the off-season guidance for experienced lifters (Iraki 2019). Protein is 200 g, which is 2.2 g per kg, the top of the range shown to help (Morton 2018; Iraki 2019). At 51 the dose per sitting matters: older muscle needs about 0.4 g per kg in one meal to respond fully, about 35 g for you (Moore 2015). So protein arrives as five 35 g feedings and one 25 g shake, not nine small ones. Carbs are 4 g per kg and sit around the lift. Fat is 1 g per kg. Maintenance (about 2,900) is an estimate from your size and schedule; MacroFactor measures the real number from your logged food and morning weight in two to four weeks, and these targets move to match. 200 g of protein assumes healthy kidneys — if a doctor has told you otherwise, say so and I'll re-cut it."}};

S.r = S.r||{}; S.x = S.x||{}; S.act = S.act||{}; S.gl = S.gl||{}; S.added = S.added||{}; S.f = S.f||{};
if(CFG.block && S.glBlock !== CFG.block){ // new block: archive the old green lights, start clean
  if(Object.keys(S.gl).length){ S.glOld = S.glOld||{}; S.glOld['b'+(S.glBlock||CFG.block-1)] = S.gl; }
  S.gl = {}; S.glBlock = CFG.block; save();
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayName(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}); }
function mday(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'}); }
function doy(){ const d=new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0))/864e5); }
function minRep(r){ const m = String(r).match(/\d+/); return m?parseInt(m[0]):1; }

const DATES = [...new Set(CFG.sessions.map(s=>s.date).concat(CFG.fuel && CFG.fuel.on && CFG.restDate ? [CFG.restDate] : []))].sort();
let CUR = DATES.includes(todayISO()) ? todayISO() : DATES[0];
let VIEW = 'week';

/* ---------- session status ---------- */
function sesStatus(s){
  const k = s.date + '|' + s.id;
  if(s.kind !== 'lift'){
    const a = S.act[k];
    return (a && a.done) ? {txt:'✓ done', cls:'done'} : {txt:s.opt?'optional':'—', cls:''};
  }
  const x = S.x[k]; if(!x) return {txt:'—', cls:''};
  const total = s.ex.length;
  let n = 0;
  s.ex.forEach((e,i)=>{ const st=x[i]; if(st && st.sets && st.sets.some(t=>t&&t.t)) n++; });
  if(n===0) return {txt:'—', cls:''};
  return n>=total ? {txt:'✓ done', cls:'done'} : {txt:n+'/'+total+' lifts', cls:'part'};
}

/* ---------- render ---------- */
function render(){ VIEW==='week' ? renderWeek() : renderDay(); }
function goWeek(){ VIEW='week'; render(); window.scrollTo(0,0); }
function setDay(d){ CUR = d; VIEW='day'; render(); window.scrollTo(0,0); }

function renderWeek(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><div class="sys">C&amp;C Health OS</div></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari.</div>`;
  const req = CFG.sessions.filter(s=>!s.opt);
  const all = req.length;
  const done = req.filter(s=>sesStatus(s).cls==='done').length;
  const bonus = CFG.sessions.filter(s=>s.opt && sesStatus(s).cls==='done').length;
  h += `<div class="card"><div class="eyebrow">${esc(CFG.weekLabel)}</div>
    <div style="font-size:14px">${done} of ${all} sessions complete${bonus?' · +'+bonus+' optional':''}</div>
    <div class="prog"><i style="width:${all?Math.round(done/all*100):0}%"></i></div>${fuelWeekLine()}</div>`;
  DATES.forEach(d=>{
    const today = d===todayISO();
    const ss = CFG.sessions.filter(s=>s.date===d);
    if(!ss.length) return;
    h += `<div class="wk ${today?'today':''}" onclick="setDay('${d}')">
      <div class="wkh"><div class="wkd">${dayName(d)}${today?' · today':''}</div><div class="wkdate">${mday(d)}</div></div>`;
    ss.forEach(s=>{
      const st = sesStatus(s);
      h += `<div class="wks"><div><span class="dot ${(s.badge||'').replace(' ','')}"></span><span class="t">${esc(s.title)}</span>
        <div class="sub2" style="margin-left:15px">${esc(s.time||'')}</div></div>
        <div class="st ${st.cls}">${st.txt}</div></div>`;
    });
    h += `</div>`;
  });
  h += `<div class="wk ${fuelOn()&&CFG.restDate===todayISO()?'today':''}" onclick="${fuelOn()&&CFG.restDate?`setDay('${CFG.restDate}')`:'void(0)'}"><div class="wkh"><div class="wkd" style="color:var(--dim)">Sun · rest</div><div class="wkdate">${mday(CFG.restDate||DATES[DATES.length-1])}</div></div>
    <div class="wks"><div><span class="dot"></span><span class="t" style="color:var(--dim)">${fuelOn()?'Full rest — fuel card and check-in · reset today':'Full rest — export Saturday, reset today'}</span></div></div></div>`;
  h += `<div class="card"><div class="eyebrow">Week close-out</div>
    <div class="small" style="margin-bottom:9px"><b>The ritual:</b> Saturday → Export week, paste to Claude${fuelOn()?', and attach the MacroFactor Quick Export':''}. Sunday → Reset. Monday's files arrive reprogrammed.</div>
    <div class="row"><button class="btn acc" onclick="exportData()">Export week &amp; copy</button>
    <button class="btn" onclick="shareData()">Share…</button>
    <button class="btn ghost" onclick="resetWeek()">Reset week</button></div></div>`;
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

function renderDay(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><button class="home" onclick="goWeek()">‹ Week</button></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari. It works offline and remembers everything.</div>`;
  h += `<div class="chips">` + DATES.map(d=>
    `<button class="chip ${d===CUR?'on':''}" onclick="setDay('${d}')">${dayName(d)} ${mday(d)}</button>`).join('') + `</div>`;
  h += readinessCard();
  h += fuelCard();
  h += lowBanner();
  const todays = CFG.sessions.filter(s=>s.date===CUR);
  todays.forEach(s=>{ h += missionCard(s); h += (s.kind==='lift') ? liftCard(s) : actCard(s); });
  if(!todays.length) h += `<div class="card small">Rest day. Check-in and fuel only. Export was Saturday; reset today.</div>`;
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

/* ---------- exercise state ---------- */
function xkey(sid){ return CUR + '|' + sid; }
function exState(sid, i){
  const k = xkey(sid); S.x[k] = S.x[k]||{};
  S.x[k][i] = S.x[k][i]||{sets:[],c:'',tags:[],sub:''};

/* ---------- readiness ---------- */
function rget(){ S.r[CUR] = S.r[CUR]||{}; return S.r[CUR]; }
function rset(f,v){ rget()[f]=v; save(); render(); }
function rateRow(f,label){
  const v = rget()[f];
  return `<div class="lbl">${label}</div><div class="rd">` +
    [1,2,3,4,5].map(n=>`<button class="rb ${v===n?'on':''}" onclick="rset('${f}',${n})">${n}</button>`).join('') + `</div>`;
}
function readinessCard(){
  const r = rget();
  let inner = rateRow('e','Energy') + rateRow('so','Soreness (5 = very sore)') + rateRow('sl','Sleep quality') + rateRow('m','Mood');
  inner += `<div class="grid2" style="margin-top:10px">
    <div><div class="lbl">Bodyweight (lbs)</div><input inputmode="decimal" value="${esc(r.bw||'')}" onchange="rset('bw',this.value)"></div>
    <div><div class="lbl">Sleep (hrs)</div><input inputmode="decimal" value="${esc(r.slh||'')}" onchange="rset('slh',this.value)"></div></div>`;

    inner += `<h3 class="sect">Whoop</h3><div class="grid2">

      <div><div class="lbl">HRV (ms)</div><input inputmode="numeric" value="${esc(r.hrv||'')}" onchange="rset('hrv',this.value)"></div>
      <div><div class="lbl">Resting HR</div><input inputmode="numeric" value="${esc(r.rhr||'')}" onchange="rset('rhr',this.value)"></div>

function lowBanner(){
  const r = rget();
  const vals = ['e','sl','m'].map(f=>r[f]).filter(Boolean);
  const avg = vals.length===3 ? (vals.reduce((a,b)=>a+b,0) + (r.so?(6-r.so):0)) / (r.so?4:3) : null;
  const whoopLow = CFG.whoop && r.rec && Number(r.rec) < 34;
  if((avg!==null && avg <= 2.5) || whoopLow){
    return `<div class="adjust"><b>Readiness is low today.</b> Option, not an order: keep planned loads, drop the last set of each exercise, and bank recovery. Research: acute readiness-based volume cuts protect long-term progress (autoregulation, Helms 2018). Your call — you set the limits.</div>`;
  }
  return '';
}

/* ---------- fuel: the schedule and the misses (food log + weight live in MacroFactor) ---------- */
function fuelOn(){ return !!(CFG.fuel && CFG.fuel.on); }
function dayType(d){ return CFG.sessions.some(s=>s.date===d && s.kind==='lift') ? 'lift' : 'rest'; }
function fget(d){ S.f[d] = S.f[d]||{}; S.f[d].s = S.f[d].s||{}; return S.f[d]; }
function fmark(id,v){ const f=fget(CUR); if(f.s[id] && f.s[id].v===v) delete f.s[id]; else f.s[id]={v:v,t:Date.now()}; save(); render(); }
function fcre(){ const f=fget(CUR); f.cr = f.cr?0:1; save(); render(); }
function fnote(v){ fget(CUR).n = v; save(); }
function fuelStats(d){
  const slots = CFG.fuel[dayType(d)]||[], f = S.f[d]||{}, m = f.s||{};
  const core = slots.filter(x=>!x.opt);
  return { n:core.length, ate:core.filter(x=>m[x.id]&&m[x.id].v===1).length,
    miss:core.filter(x=>m[x.id]&&m[x.id].v===-1), opt:slots.filter(x=>x.opt&&m[x.id]&&m[x.id].v===1),
    cr:!!f.cr, note:f.n||'', marks:slots.filter(x=>m[x.id]&&m[x.id].v===1).map(x=>({id:x.id,t:m[x.id].t})) };
}
function fuelWeekLine(){
  if(!fuelOn()) return '';
  let a=0,n=0,mi=0;
  DATES.filter(d=>d<=todayISO()).forEach(d=>{ const st=fuelStats(d); a+=st.ate; n+=st.n; mi+=st.miss.length; });
  return `<div class="small" style="margin-top:9px">Fuel: ${a} of ${n} feedings eaten${mi?' · '+mi+' missed':''}${n-a-mi>0?' · '+(n-a-mi)+' not marked':''}</div>`;
}
function fuelCard(){
  if(!fuelOn()) return '';
  const F = CFG.fuel, ty = dayType(CUR), T = F.targets[ty], slots = F[ty]||[], f = fget(CUR), st = fuelStats(CUR);
  let rows = '';
  slots.forEach(x=>{ const v = f.s[x.id] ? f.s[x.id].v : 0;
    rows += `<div class="frow"><div><div class="ft">${esc(x.l)} <span class="fw">${esc(x.when)}</span></div>
      <div class="fs tg2">${esc(x.t)}</div><div class="fs">${esc(x.cue)}</div></div>
      <button class="ck ${v===1?'done':''}" onclick="fmark('${x.id}',1)">✓</button>
      <button class="ck ${v===-1?'miss':''}" onclick="fmark('${x.id}',-1)">✕</button></div>`; });
  const left = st.n - st.ate - st.miss.length;
  return `<details ${left>0?'open':''}><summary>Fuel · ${ty==='lift'?'lift day':'rest day'} · ${st.ate}/${st.n} eaten${st.miss.length?' · '+st.miss.length+' missed':''}${left>0||st.miss.length?'':' ✓'}</summary>
    <div class="card"><div class="eyebrow">${esc(F.phase)}</div>
    <div class="target">${T.k.toLocaleString('en-US')} kcal · protein ${T.p} g · carbs ${T.c} g · fat ${T.f} g · fiber ${esc(F.fiber)} g</div>
    <div class="small" style="margin:6px 0 4px">Food and morning weight go in MacroFactor. On this card: ✓ ate it, ✕ missed it.</div>
    ${rows}
    <div class="frow"><div><div class="ft">Creatine ${F.creatine} g</div><div class="fs">Any time of day, every day.</div></div>
      <button class="ck ${f.cr?'done':''}" onclick="fcre()">✓</button><div></div></div>
    <div class="lbl">Fuel note — restaurant, off-plan, how 5:00 felt</div>
    <textarea onchange="fnote(this.value)">${esc(f.n||'')}</textarea>
    <details style="margin-top:10px"><summary>Why these numbers</summary>
      <div class="small" style="margin-top:8px">${esc(F.why)}</div>
      ${(F.rules||[]).map(r=>`<div class="small" style="margin-top:6px">• ${esc(r)}</div>`).join('')}</details>
    </div></details>`;
}

/* ---------- lift sessions ---------- */
function allEx(s){
  const extra = (S.added[xkey(s.id)]||[]).map(n=>({name:n, sets:3, reps:'8-12', load:'—', rest:90, subs:[], added:true}));
  return s.ex.concat(extra);
}
function liftCard(s){
  let h = '';
  if(s.warmup) h += `<details><summary>Warm-up ramp (2 min — do it)</summary><div class="card small">${esc(s.warmup)}</div></details>`;
  allEx(s).forEach((ex,i)=>{ h += exCard(s,ex,i); });
  h += `<div class="row"><button class="btn" onclick="addEx('${s.id}')">＋ Add exercise</button></div>`;
  h += `<div class="card"><div class="lbl">Session note — how did it go?</div>
    <textarea onchange="snote('${s.id}',this.value)">${esc((S.x[xkey(s.id)]||{}).note||'')}</textarea></div>`;
  return h;
}
function snote(sid,v){ const k=xkey(sid); S.x[k]=S.x[k]||{}; S.x[k].note=v; save(); }

function exCard(s,ex,i){
  const st = exState(s.id,i);
  const planned = ex.sets;
  const sec = ex.unit==='sec';
  const nsets = Math.max(planned, st.sets.length + (st.sets.length>=planned?1:0));
  let rows = '';
  for(let si=0; si<nsets; si++){
    const set = st.sets[si]||{};
    const lab = ex.rows ? ex.rows[si % ex.rows.length] : '';
    rows += `<div class="setrow"><div class="n">${lab?esc(lab.charAt(0)):si+1}</div>
      <input placeholder="${ex.load==='BW'?'BW':'lbs'}" inputmode="decimal" id="w_${s.id}_${i}_${si}" value="${esc(set.w||'')}" onchange="setField('${s.id}',${i},${si},'w',this.value)">
      <input placeholder="${sec?(lab?esc(lab):'sec'):'reps'}" inputmode="numeric" id="r_${s.id}_${i}_${si}" value="${esc(set.r||'')}" onchange="setField('${s.id}',${i},${si},'r',this.value)">
      <select id="rir_${s.id}_${i}_${si}" onchange="setField('${s.id}',${i},${si},'rir',this.value)">
        <option value="">RIR</option>${[0,1,2,3,4,5].map(n=>`<option ${set.rir===String(n)||set.rir===n?'selected':''}>${n}</option>`).join('')}
        <option ${set.rir==='6+'?'selected':''}>6+</option></select>
      <button class="ck ${set.t?'done':''}" onclick="ckSet('${s.id}',${i},${si},${ex.rest||90})">✓</button></div>`;
  }
  const glOn = !ex.nogl && S.gl[ex.name];
  const subsOpen = st.showSubs;
  return `<div class="exc">
    <div class="exhead"><div>
      <div class="exname">${esc(ex.name)}${st.sub?` <span class="sub">→ ${esc(st.sub)}</span>`:''}${ex.added?' <span class="sub">(added)</span>':''}</div>
      <div class="target">${ex.target?esc(ex.target):ex.sets+'×'+esc(ex.reps)+' @ '+esc(ex.load)} · rest ${fmtRest(ex.rest||90)}</div>
      ${ex.last?`<div class="last">Last: ${esc(ex.last)}</div>`:''}
    </div></div>
    ${ex.cue?`<div class="cue">Coach: ${esc(ex.cue)}</div>`:''}
    ${rows}
    ${glOn?`<div class="gl">🟢 Green light — ${sec?'add time next week':'add load or a rep next time'}</div>`:''}
    <div class="tags">
      ${CFG.tags.map(t=>`<button class="tg ${t.cls||''} ${(st.tags||[]).includes(t.l)?'on':''}" onclick="tagEx('${s.id}',${i},'${t.l}')">${t.l}</button>`).join('')}
    </div>
    <div class="row">
      ${ex.subs&&ex.subs.length?`<button class="btn" onclick="toggleSubs('${s.id}',${i})">${st.sub?'Change / undo swap':'Machine taken?'}</button>`:''}
      ${ex.mus?`<button class="btn" onclick="toggleMus('${s.id}',${i})">💪 The muscle</button>`:''}
      <button class="btn ghost" onclick="addSetNow('${s.id}',${i})">＋ Set</button>
    </div>
    ${st.showMus&&ex.mus?musFig(ex):''}
    ${subsOpen?`<div class="subs"><div class="lbl" style="margin-top:0">Same muscle, do instead:</div>
      ${st.sub?`<div class="so" style="color:var(--good)" onclick="useSub('${s.id}',${i},'')">↩ Back to original: ${esc(ex.name)}</div>`:''}
      ${ex.subs.map(o=>`<div class="so" onclick="useSub('${s.id}',${i},'${esc(o).replace(/'/g,"\\'")}')">→ ${esc(o)}</div>`).join('')}</div>`:''}
    <div class="lbl">Comment</div>
    <textarea onchange="cmt('${s.id}',${i},this.value)">${esc(st.c||'')}</textarea>
  </div>`;
}
function fmtRest(s){ return s>=120 ? (s/60)+' min' : s+'s'; }
function setField(sid,i,si,f,v){ const st=exState(sid,i); st.sets[si]=st.sets[si]||{}; st.sets[si][f]=v; save(); }
function ckSet(sid,i,si,rest){
  const st = exState(sid,i);
  const w = $('w_'+sid+'_'+i+'_'+si).value, r = $('r_'+sid+'_'+i+'_'+si).value, rir = $('rir_'+sid+'_'+i+'_'+si).value;
  const cur = st.sets[si]||{};
  if(cur.t){ // second tap = un-check, keep the numbers
    st.sets[si] = {w, r, rir}; save(); render(); stopTimer(); return;
  }
  const now = Date.now();
  const prev = st.sets[si-1];
  st.sets[si] = {w, r, rir, t: now, rest: prev&&prev.t ? Math.round((now-prev.t)/1000) : null};
  greenCheck(sid,i); save(); render();
  const pl = ((CFG.sessions.find(x=>x.id===sid)||{}).ex||[])[i];
  if(pl && pl.restEvery && (si+1) % pl.restEvery !== 0){ stopTimer(); return; }
  startTimer(rest, si+2, !pl || si+1 >= pl.sets, pl && pl.rows ? pl.rows[(si+1) % pl.rows.length] : '');
}
function greenCheck(sid,i){
  if(CFG.deload) return;
  const s = CFG.sessions.find(x=>x.id===sid); if(!s||!s.ex[i]) return;
  const ex = s.ex[i]; const st = exState(sid,i);
  if(ex.nogl) return;
  if(ex.unit==='sec'){
    const first = st.sets.slice(0, ex.sets);
    if(first.length >= ex.sets && first.every((x,k)=>x && x.t && Number(x.r) >= (ex.secs ? ex.secs[k % ex.secs.length] : minRep(ex.reps)))) S.gl[ex.name] = 1;
    return;
  }
  const doneSets = st.sets.filter(x=>x&&x.t);
  if(doneSets.length >= ex.sets && doneSets.slice(0,ex.sets).every(x=>Number(x.r)>=minRep(ex.reps) && (x.rir==='6+'||Number(x.rir)>=2))){
    S.gl[ex.name] = 1;
  }
}
function tagEx(sid,i,t){ const st=exState(sid,i); st.tags=st.tags||[];
  const ix=st.tags.indexOf(t); if(ix>=0) st.tags.splice(ix,1); else st.tags.push(t); save(); render(); }
function toggleMus(sid,i){ const st=exState(sid,i); st.showMus=!st.showMus; save(); render(); }

}
function musFig(ex){
  function fig(side,label){
    const regs = MREG[side];
    let shapes='';
    Object.keys(regs).forEach(k=>{
      const hot = ex.mus.includes(k);
      shapes += '<g class="mreg'+(hot?' hot':'')+'">'+regs[k]+'</g>';
    });
    return '<svg width="104" height="200" viewBox="0 0 102 192">'+shapes+bodyOutline()+
      '<text x="51" y="190" text-anchor="middle" fill="var(--dim)" font-size="9" letter-spacing="2">'+label+'</text></svg>';
  }
  const needF = ex.mus.some(k=>MREG.front[k]), needB = ex.mus.some(k=>MREG.back[k]);
  return '<div class="mfig">'+(needF?fig('front','FRONT'):'')+(needB?fig('back','BACK'):'')+
    (ex.act?'<div class="act">✋ '+esc(ex.act)+'</div>':'')+'</div>';
}
function cmt(sid,i,v){ exState(sid,i).c = v; save(); }
function toggleSubs(sid,i){ const st=exState(sid,i); st.showSubs=!st.showSubs; save(); render(); }
function useSub(sid,i,name){ const st=exState(sid,i); st.sub=name; st.showSubs=false; save(); render(); }
function addSetNow(sid,i){ const st=exState(sid,i); st.sets.push({}); save(); render(); }
function addEx(sid){
  const n = prompt('Exercise name:'); if(!n) return;
  const k = xkey(sid); S.added[k] = S.added[k]||[]; S.added[k].push(n); save(); render();
}

/* ---------- activity sessions (yoga / walks / zone 2) ---------- */
function aget(sid){ const k=xkey(sid); S.act[k]=S.act[k]||{}; return S.act[k]; }
function aset(sid,f,v){ aget(sid)[f]=v; save(); if(f==='done'||f==='feel') render(); }
function actCard(s){
  const a = aget(s.id);
  return `<div class="card">
    ${s.desc?`<div class="small" style="margin-bottom:10px">${esc(s.desc)}</div>`:''}
    <div class="grid2">
      <div><div class="lbl">Duration (min)</div><input inputmode="numeric" value="${esc(a.dur||'')}" onchange="aset('${s.id}','dur',this.value)"></div>
      <div><div class="lbl">${s.distLabel||'Distance (mi)'}</div><input inputmode="decimal" value="${esc(a.dist||'')}" onchange="aset('${s.id}','dist',this.value)"></div>
    </div>
    <div class="lbl">How did it feel? (1 rough – 5 great)</div>
    <div class="rd">${[1,2,3,4,5].map(n=>`<button class="rb ${a.feel===n?'on':''}" onclick="aset('${s.id}','feel',${n})">${n}</button>`).join('')}</div>
    <div class="lbl">Note</div><textarea onchange="aset('${s.id}','c',this.value)">${esc(a.c||'')}</textarea>
    <div style="margin-top:12px"><button class="done-big ${a.done?'on':''}" onclick="aset('${s.id}','done',${a.done?0:1})">${a.done?'✓ Done':'Mark done'}</button></div>
  </div>`;
}

/* ---------- rest timer ---------- */
let TINT = null;
function startTimer(sec, nextSet, last, nextName){
  stopTimer();
  const end = Date.now() + sec*1000;
  $('timer').style.display = 'block';
  $('tlab').textContent = (last ? 'Rest · next lift after this' : 'Rest · ' + (nextName ? nextName : 'set ' + nextSet) + ' next') + ' · target ' + fmtRest(sec);
  TINT = setInterval(()=>{
    const left = Math.max(0, end - Date.now());
    const s = Math.ceil(left/1000);
    $('tclock').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    $('tbar').style.width = (left/(sec*1000)*100)+'%';
    if(left<=0){ $('tclock').textContent = 'GO'; clearInterval(TINT);
      if(navigator.vibrate) navigator.vibrate([120,60,120]); }
  }, 250);
}
function stopTimer(){ if(TINT) clearInterval(TINT); $('timer').style.display='none'; }

/* ---------- export ---------- */
function buildExport(){
  let out = CFG.name.toUpperCase() + ' — C&C LOG EXPORT — ' + new Date().toLocaleString() + '\n';
  Object.keys(S.r).sort().forEach(d=>{
    const r = S.r[d]; const has = Object.values(r).some(v=>v);
    if(!has) return;
    out += '\n' + d + ' readiness: E' + (r.e||'-') + ' So' + (r.so||'-') + ' Sl' + (r.sl||'-') + ' M' + (r.m||'-');
    if(r.bw) out += ' | BW ' + r.bw;
    if(r.slh) out += ' | sleep ' + r.slh + 'h';
    if(CFG.whoop && (r.rec||r.hrv)) out += ' | Whoop rec ' + (r.rec||'-') + '% HRV ' + (r.hrv||'-') + ' RHR ' + (r.rhr||'-') + ' strain ' + (r.strain||'-');
  });
  CFG.sessions.forEach(s=>{
    const k = s.date + '|' + s.id;
    if(s.kind==='lift'){
      const x = S.x[k]; if(!x) return;
      let lines = '';
      const extras = S.added[k]||[];
      const names = s.ex.map(e=>e.name).concat(extras);
      names.forEach((nm,i)=>{
        const st = x[i]; if(!st || (!st.sets.length && !st.c && !st.tag)) return;
        const tEx = (s.ex[i]||{});
        const done = st.sets.map((t,k)=>t?Object.assign({k:k},t):null).filter(t=>t&&(t.t||t.w||t.r));
        const noW = tEx.load==='BW' ? 'BW' : '?';
        const setsTxt = done.map(t=> tEx.unit==='sec'
          ? (tEx.rows?tEx.rows[t.k % tEx.rows.length]+' ':'')+(t.w?t.w+'+':'')+(t.r||'?')+'s'+(t.rir?'@'+t.rir+'RIR':'')+(t.t?'':'(unchecked)')
          : (t.w||noW)+'×'+(t.r||'?')+'@'+(!t.rir?'?':t.rir)+'RIR'+(t.t?'':'(unchecked)')).join(', ');
        const rests = tEx.restEvery ? [] : done.map(t=>t.rest).filter(v=>v);
        const avgRest = rests.length ? Math.round(rests.reduce((a,b)=>a+b,0)/rests.length) : null;
        lines += '  ' + nm + (st.sub?' →SUB: '+st.sub:'') + ': ' + (setsTxt||'(no sets)');
        if(avgRest) lines += ' | avg rest ' + avgRest + 's (target ' + (tEx.rest||90) + 's)';
        if(S.gl[nm]) lines += ' | 🟢';
        if(st.tags&&st.tags.length) lines += ' | TAGS: ' + st.tags.join(',');
        if(st.c) lines += ' | "' + st.c + '"';
        lines += '\n';
      });
      if(lines){ out += '\n\n' + s.date + ' · ' + s.title + '\n' + lines; if(x.note) out += '  Session note: "' + x.note + '"\n'; }
    } else {
      const a = S.act[k]; if(!a || (!a.done && !a.dur && !a.c)) return;
      out += '\n\n' + s.date + ' · ' + s.title + ': ' + (a.done?'DONE':'logged') +
        (a.dur?' · '+a.dur+' min':'') + (a.dist?' · '+a.dist:'') + (a.feel?' · felt '+a.feel+'/5':'') + (a.c?' · "'+a.c+'"':'');
    }
  });
  if(fuelOn()){
    const hm = t => { const d = new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
    let fl = '', A=0, N=0, M=0, CR=0, BR=0, D=0;
    DATES.forEach(d=>{
      const st = fuelStats(d);
      if(!(st.ate || st.miss.length || st.opt.length || st.cr || st.note)) return;
      D++; A+=st.ate; N+=st.n; M+=st.miss.length; if(st.cr) CR++; if(st.opt.length) BR++;
      fl += '\n' + d + ' fuel (' + dayType(d) + '): ate ' + st.ate + '/' + st.n
        + (st.miss.length ? ' | MISSED: ' + st.miss.map(x=>x.l+' '+x.when).join(', ') : '')
        + (st.n-st.ate-st.miss.length>0 ? ' | not marked: ' + (st.n-st.ate-st.miss.length) : '')
        + (st.opt.length ? ' | bridge snack: yes' : '')
        + ' | creatine ' + (st.cr?'yes':'no')
        + (st.marks.length ? ' | tapped: ' + st.marks.map(k=>k.id+' '+hm(k.t)).join(', ') : '')
        + (st.note ? ' | "' + st.note + '"' : '');
    });
    if(fl) out += '\n\nFUEL — schedule adherence (food log and weight are in MacroFactor)' + fl
      + '\nFUEL WEEK: ' + D + ' days marked · ate ' + A + '/' + N + ' · missed ' + M + ' · bridge snack on ' + BR + ' days · creatine ' + CR + '/' + D;
  }
  out += '\n\n---JSON---\n' + JSON.stringify(S);
  return out;
}
function exportData(){
  const t = buildExport();
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>{}); ok = true; }
  alert(ok ? 'Log copied. Paste it to Claude.' : 'Copy failed — use Share instead.');
}
function shareData(){
  const t = buildExport();
  if(navigator.share){ navigator.share({title:CFG.name+' training log', text:t}); }
  else exportData();
}
function resetWeek(){
  if(!confirm('Reset for the new week? Make sure you exported first — this clears the week\'s logs. Green lights are kept.')) return;
  S.x={}; S.act={}; S.r={}; S.added={}; save(); VIEW='week'; render();
  alert('Clean slate. Green lights carried forward. See you Monday.');
}

render();
</script>
