<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Chancey // Ops · Week 10 · C&C Health OS</title>
<style>
:root{
  --bg:#101413; --panel:#181E1C; --panel2:#121816; --ink:#E9EDE8; --dim:#8C968E;
  --acc:#C9A227; --acc2:#9DB07A; --good:#6FBF73; --warn:#E2B93B; --bad:#D96A5F; --line:#26302B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:16px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 120px}
.hdr{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 2px}
.brand{font-family:'Avenir Next Condensed','Arial Narrow','HelveticaNeue-CondensedBold',sans-serif;
  font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:26px;color:var(--ink)}
.brand b{color:var(--acc)}
.sys{font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:var(--dim);
  font-size:13px;font-weight:600;background:var(--panel)}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:6px}
.mission{border-left:3px solid var(--acc)}
.mission .p{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:20px;line-height:1.25;margin:2px 0 8px;text-transform:uppercase;letter-spacing:.02em}
.mission .r{font-size:13px;color:var(--dim);line-height:1.45}
.mission .m{font-size:14px;color:var(--acc2);font-style:italic;margin-top:9px;line-height:1.4}
.stitle{display:flex;justify-content:space-between;align-items:center;margin:18px 0 4px}
.stitle h2{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-size:19px;margin:0;
  text-transform:uppercase;letter-spacing:.05em}
.tag{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.exc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exname{font-weight:700;font-size:16.5px;line-height:1.25}
.sub{color:var(--warn);font-size:12.5px;font-weight:600}
.target{font-size:13px;color:var(--acc);font-weight:600;margin-top:3px}
.last{font-size:12px;color:var(--dim);margin-top:3px}
.cue{font-size:12.5px;color:var(--dim);margin-top:6px;padding:7px 9px;background:var(--panel2);
  border-radius:8px;line-height:1.4}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 74px 44px;gap:7px;align-items:center;margin-top:8px}
.setrow .n{color:var(--dim);font-size:12px;text-align:center}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
  padding:10px 8px;font-size:16px;width:100%}
textarea{min-height:44px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.ck{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);
  font-size:18px;font-weight:700}
.ck.done{background:var(--good);border-color:var(--good);color:#10130f}
.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;
  padding:9px 12px;font-size:13px;font-weight:600}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn.ghost{color:var(--dim)}
.gl{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--good);font-weight:700}
.tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tg{flex:1 1 28%;text-align:center;padding:9px 4px;border-radius:9px;border:1px solid var(--line);
  color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.03em}
.tg.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.tg.on.sore{background:#3d3a22;color:var(--warn);border-color:var(--warn)}
.tg.on.hurt{background:#41291f;color:#E59866;border-color:#E59866}
.tg.on.pain{background:#3f2320;color:var(--bad);border-color:var(--bad)}
.mfig{margin-top:9px;background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.mfig .act{font-size:12.5px;color:var(--acc2);margin-top:6px;line-height:1.4;text-align:left}
.mreg{fill:#2a3230;stroke:none}
.mreg.hot{fill:var(--acc)}
.mbody{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.55}
.subs{margin-top:9px;background:var(--panel2);border-radius:10px;padding:10px}
.subs .so{padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px}
.subs .so:last-child{border-bottom:none}
.rd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 2px}
.rb{padding:10px 0;text-align:center;border:1px solid var(--line);border-radius:9px;color:var(--dim);
  font-weight:700;background:var(--panel2)}
.rb.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.lbl{font-size:12px;color:var(--dim);margin-top:10px;letter-spacing:.06em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.banner{background:#3a2f1d;border:1px solid var(--warn);color:var(--warn);border-radius:12px;
  padding:11px;font-size:13px;line-height:1.4;margin:10px 0}
.adjust{background:var(--panel2);border-left:3px solid var(--warn);border-radius:10px;padding:11px;
  font-size:13px;color:var(--ink);margin:10px 0;line-height:1.45}
#timer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--acc);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;z-index:50}
#timer .tin{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
#tclock{font-family:'Avenir Next Condensed','Arial Narrow',monospace;font-size:30px;font-weight:800;color:var(--acc)}
#tbarw{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
#tbar{height:100%;background:var(--acc);width:100%}
#tlab{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.foot{margin-top:22px;text-align:center;color:var(--dim);font-size:11.5px;letter-spacing:.06em}
details summary{cursor:pointer;color:var(--acc);font-size:13px;font-weight:600;letter-spacing:.04em}
details .card{margin-top:8px}
.small{font-size:12.5px;color:var(--dim);line-height:1.45}
h3.sect{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;text-transform:uppercase;
  letter-spacing:.08em;font-size:15px;margin:16px 0 4px;color:var(--acc2)}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:9px 0}
.wk.today{border-color:var(--acc)}
.wkh{display:flex;justify-content:space-between;align-items:baseline}
.wkd{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:17px;
  text-transform:uppercase;letter-spacing:.06em}
.wk.today .wkd{color:var(--acc)}
.wkdate{font-size:12px;color:var(--dim)}
.wks{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px}
.wks .t{color:var(--ink)}
.wks .sub2{color:var(--dim);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.wks .st{font-weight:700;font-size:12.5px;color:var(--dim)}
.wks .st.done{color:var(--good)}
.wks .st.part{color:var(--warn)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--dim);vertical-align:1px}
.dot.Strength{background:var(--acc)} .dot.Mobility{background:var(--acc2)}
.dot.Walk{background:#7FB2C9} .dot.Zone2{background:#7FB2C9}
.prog{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--good)}
.home{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:10px;
  padding:8px 12px;font-size:13px;font-weight:700}
.done-big{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;border:1px solid var(--acc);background:transparent;color:var(--acc)}
.done-big.on{background:var(--good);border-color:var(--good);color:#10130f}
.frow{display:grid;grid-template-columns:1fr 44px 44px;gap:7px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.frow .ft{font-size:14.5px;font-weight:700;line-height:1.3}
.frow .fw{font-size:12px;color:var(--acc);font-weight:600;margin-left:3px;white-space:nowrap}
.frow .fs{font-size:12.5px;color:var(--dim);line-height:1.4;margin-top:2px}
.frow .fs.tg2{color:var(--acc2);font-weight:600}
.ck.miss{background:var(--bad);border-color:var(--bad);color:#10130f}
</style>
</head>

<script>
const CFG = {"name":"Chancey","brand":"CHANCEY <b>// OPS</b>","tag":"Semper Fi","key":"cchos_chancey_v1","whoop":false,"motiv":["Discipline got you here. Data keeps you here.","Slow is smooth, smooth is fast — that includes the rest between sets.","You're not chasing 22-year-old you. You're outlasting him.","The mission is 30 more good years. Today is one rep of it.","Block 2, week 2 of 6. Week 1 set the baselines. Week 2 beats them.","Fuel is part of the set now. Log every feeding — the missed ones too.","495 for 10s. 205 for 10s. Reps first, then the plate.","The left arm sets the pace. The right arm follows.","Rest the full clock — and no more. 60 means 60.","The tweak is data. Log it, adjust it, keep moving.","'Today is first day I saw my legs and saw the muscles coming.' Keep going.","Five weeks to Nov 20. Then the full week off you asked for.","Elbows in. Narrow grip. The left arm gets a lane, not a pass."],"sessions":[{"id":"mob1","date":"2026-10-19","title":"Mobility — 10 min","time":"Morning","kind":"act","badge":"Mobility","why":"Same ten minutes as last Monday (logged 3/5). One change while the hip flexor settles: the hip-flexor stretch goes gentle","research":"Range of motion answers to total minutes per week and to how many days you stretch — at least 5 minutes a week per area, 5 days a week — more than to how long any one session runs (Thomas 2018). So if the rest week's morning stretches became a habit, keep them: the two carded days here plus a few loose minutes on the others is the better dose.","desc":"5 min easy bike if there's no mat. Then: cat-cow ×10, bird-dog ×8/side, half-kneeling hip-flexor stretch 30s/side RIGHT first — gentle, pain-free range only this week, no pushing into it — deep squat hold 30s (heels down, hold a post), band external rotation ×20/side LEFT first — slow, elbow pinned to the ribs. Note what catches, and which side.","distLabel":"—"},{"id":"push1","date":"2026-10-19","title":"Push — Block 2 · Wk 2","time":"Afternoon","kind":"lift","badge":"Strength","why":"205 and 495 opened clean. This week is reps before plates: chest press chases 10s, the DB press goes to 75 on your call, pushdown takes the next plate","research":"BLOCK 2, WEEK 2 OF 6. Fallback rule on every jump: set 1 at 1 RIR or less = the old number for the rest of the sets, logged. YOUR NOTE ON THE WEEK OFF — 'I've always responded to rest. First time I reloaded w a full week off. It was very beneficial. Need to implement again next time.' It's on the calendar: Thanksgiving week, Nov 23–29, is the next full week off, and Block 3 opens Nov 30. CHEST PRESS SEAT: setting 3 is right, for the reason you gave. Setting 2 puts the handles behind the chest, and the bottom of the press is the exact position your map flags ('fast pain in the shoulder bicep area,' 9/28). The growth comes from the load, not the extra inch: 205×8 across with 2–3 in the tank. 205 holds; the target is 10s. DB PRESS: 75, your call ('I think it's 75 next time not 70'). Honest warning: 65×12 @3–5 puts 75 at about 8–10 reps, so the range on this card is 8–10. It's a 15% jump on the one press with a pain gate — fallback 70, and any ache ends it on the pec deck. PEC DECK — YOUR QUESTION ON THE 3s HOLD: drop it. What builds size and strength is sets taken close to failure, across a wide range of loads (Schoenfeld 2017). The hold parks the chest at its shortest point — the closed end of the arc — and that's where set 1's reps went: 15, 15, then 13 @1. Where the research does favor a part of the range, it's the long end: muscles trained in the lengthened position tend to grow more (Pedrosa 2022 on the leg extension; Maeo 2021 on the leg curl). Your map keeps the stretch end of the pec deck off-limits, so the best use of the set is 1s at the squeeze and a slow 3s back to the short stop. LATERAL RAISE: 25×12 went @4/2/1. Build to 15 before 30 — 30 is a 20% jump on a small muscle. FRONT RAISE: you ran it with a 15 DB, so the DB version is the card now; the cable is the sub. PUSHDOWN: 80×12 @6+/4/2 — gate met, next plate. OVERHEAD EXTENSION: 20 needed an assist on the left in set 1 and went to zero by set 2. It drops to 15 (17.5 if the stack has a half step), 3×12 @2. This is the triceps card that matters most: overhead extensions grew the triceps about 1.4 times as much as pushdowns over 12 weeks (Maeo 2023), because the long head works stretched overhead. HIP FLEXOR: Wednesday's note — 'I tweaked my hip flexor.' The hanging knee raise is a hip-flexor exercise as much as an ab one. If it's still talking, take the reverse crunch on the bench: the abs do the curl and the hip flexor gets far less load. Grip went first on set 2 again — a captain's chair takes the grip out if the gym has one. THE CLOCK: the 60s cards averaged 106–180s last Monday. That's most of the difference between a 45-minute and a 61-minute session.","warmup":"5 min: band pull-aparts ×15, band external rotation ×20/side LEFT first (elbow pinned), arm circles, pec deck 40×15 easy. Chest press ramp 100×10, 145×6, 175×3 — 60s between.","ex":[{"name":"Machine Chest Press (Matrix converging or Life Fitness)","sets":4,"reps":"8-10","load":"205 Matrix · 185 LF","last":"205×8 @3/3/2/2 (10/12), seat setting 3 — 'No pain… good workout on the chest muscle.'","rest":150,"cue":"205, seat on setting 3. 4×8–10 @2 — chase 10s. 4×10 @2 opens the next plate. Narrow handles, elbows at 45°. Log the machine.","subs":["Hammer Strength Chest Press","Pec Deck","DB Floor Press (neutral grip)"]},{"name":"Neutral-Grip DB Press — elbows IN, short range — pain-gated","sets":3,"reps":"8-10","load":"75 (your call)","last":"65×12 @4/5/3 (10/12) — 'I think it's 75 next time not 70.'","rest":120,"cue":"75, narrow only. Palms facing, elbows to the ribs, stop 2–3\" above the chest. Set 1 under 8, or any ache = 70 for the rest, log it. 3×10 @2 at 75 = green.","subs":["Pec Deck (pads short)","Hammer Strength Chest Press (narrow)","Skip"]},{"name":"Pec Deck (pads set SHORT)","sets":3,"reps":"12-15","load":"85","last":"85×15/15/13 @2/2/1 (10/12) — 3s hold on set 1 only: 'It burned me out.'","rest":60,"cue":"No 3s hold. 1s squeeze, 3s back to the short stop. 85 holds; 3×15 @2 opens the next plate. Pads forward — arms never open past the shoulders.","subs":["DB Fly (light, elbows bent)","Cable Crossover (hip → mid, short range)"]},{"name":"DB Lateral Raise — both arms — SUPERSET with #5","sets":3,"reps":"12-15","load":"25","last":"25×12 @4/2/1 (10/12)","rest":60,"cue":"25s. Build toward 15, straight into the front raise. 3×15 @2 opens 30. Round 3 short of 10 = 22.5 for that round, log it.","subs":["Cable Lateral Raise","Machine Lateral Raise"]},{"name":"DB Front Raise (to eye level) — SUPERSET with #4","sets":3,"reps":"12-15","load":"15 (17.5 if there)","last":"DB 15×15 @3/3/2 (10/12) — subbed for the cable","rest":60,"cue":"15s, or 17.5 if the rack has them. Left arm sets the height. The 60 is after this one.","subs":["Cable Front Raise — 10","Plate Front Raise"]},{"name":"Triceps Pushdown (bar)","sets":3,"reps":"10-12","load":"next plate (85–87.5)","last":"80×12 @6+/4/2 (10/12) — gate met","rest":60,"cue":"Next plate up from 80, elbows pinned. 3×12 @2 opens the one after. Set 1 at 1 RIR or less = 80 for the rest.","subs":["Rope Pushdown","OH Cable Ext","Bench Dips"]},{"name":"One-Arm OH Cable Ext — LEFT FIRST","sets":3,"reps":"10-12","load":"15 (or 17.5)","last":"20×12 @1, 8 @0, 8 @0 (10/12) — 'Had to assist the left on the first set.'","rest":60,"cue":"Down to 15 (17.5 if the stack has it). Left first, left sets the count, no assist. 3×12 @2 opens 20 again. Full 60.","subs":["DB OH Ext (single, light)","Rope OH Ext"]},{"name":"Hanging Knee Raise — lower half — back-gated","sets":3,"reps":"15-20","load":"BW","last":"20/15/20 @1/0/5 (10/12) — '2nd set the grip and forearm gave out'","rest":60,"cue":"Hip flexor still talking = reverse crunch on the bench instead. Grip goes before the abs = captain's chair. Sets 1–2 with the 3s lowering.","subs":["Reverse Crunch on bench","Captain's Chair Raise","Dead Bug ×10/side"]}]},{"id":"pull1","date":"2026-10-20","title":"Pull — Block 2 · Wk 2","time":"Afternoon","kind":"lift","badge":"Strength","why":"Pull moved to the Precor gym and you logged every machine. Those are the baselines now: ISO row goes to 110, the high pull finally gets a real load","research":"BLOCK 2, WEEK 2 OF 6. Fallback rule on every jump: set 1 at 1 RIR or less = the old number for the rest of the sets, logged. NEW GYM: last Tuesday's Precor numbers are this week's starting point. Life Fitness numbers stay in the cues for days you're back there — different machines, different numbers, so keep logging which. PULLDOWN: 170 on the Precor cable with the real wide grip went 12/12/10/10 @2/2/2/1. Holds. 4×12 @2 opens 180. CABLE ROW: your call — 'I may need to go down to keep 2 rir.' 150 for all four sets; 4×10 @2 opens 155 on the Precor. ISO ROW: 100×12 @3 across on the Precor diverging row — the same pattern 90 showed on 9/22. 110, left first. FACE PULL: 25×15 @2 across, green. Holds. STRAIGHT-ARM: 50×12 @3 across. Next plate. EZ CURL 80 and CROSS-BODY HAMMER 45 hold — the last set on both was @1. HIGH PULL: the Smith bar with a 5 a side went 15 @6+ on all three sets — too light to do anything. 65 (a 10 a side), and if set 1 is 15 @4 or better, 75 for sets 2–3. Smith bars aren't all 45 lb; log it the same way every week and the numbers stay honest. KNEE RAISE (upper half): skipped for time after the late start. It's last on purpose — the first thing to go when a meeting runs long. HIP FLEXOR: Wednesday's note — 'I tweaked my hip flexor.' The hanging knee raise is a hip-flexor exercise as much as an ab one. If it's still talking, take the reverse crunch on the bench: the abs do the curl and the hip flexor gets far less load.","warmup":"Band rows ×20, band external rotation ×20/side LEFT first (elbow pinned), dead hang 20s, pulldown ramp 135×10, 185×6 (or cable 100×10, 130×6) — 60s between.","ex":[{"name":"Lat Pulldown — wide grip (Precor cable · or LF)","sets":4,"reps":"10-12","load":"170 Precor · 225 LF plate · 160 LF cable","last":"Precor cable 170×12/12/10/10 @2/2/2/1 (10/13) — 'Used the real wide grip.'","rest":150,"cue":"Precor: 170, wide grip, 3s return. 4×12 @2 opens 180. At Life Fitness: plate 225 or cable 160, same gates as before. Full 150 before set 4. Log which.","subs":["Cable-stack Lat Pulldown","Assisted Pull-up","Machine Pullover"]},{"name":"Seated Cable Row — narrow grip, 2s return (Precor · or LF)","sets":4,"reps":"10","load":"150 Precor · 155 LF","last":"Precor 155×10 @1/1, 150×10 @2/2 (10/13) — 'I may need to go down to keep 2 rir'","rest":120,"cue":"150 for all four, 2s return. 4×10 @2 opens 155. Row taken: Precor diverging row at 110.","subs":["Chest-Supported Row Machine","ISO-Lateral Low Row","Single-Arm Cable Row"]},{"name":"Single-Arm Row — LEFT FIRST (Life Fitness ISO)","sets":3,"reps":"10-12","load":"110 Precor","last":"Precor diverging row 100×12 @3/3/3 (10/13) — green","rest":90,"cue":"110 on the Precor diverging row, 3s return, left first and left sets the reps. Left under 10 on set 1 = 100 for the rest. At LF: ISO 100.","subs":["Single-Arm DB Row (bench)","One-arm Cable Row"]},{"name":"Face Pull (staggered stance)","sets":3,"reps":"15","load":"25","last":"25×15 @2/2/2 (10/13) — green","rest":60,"cue":"25, slight squat, pull to the face, 1s at the back. Full 60 — the log shows the timer wasn't running. Set 3 at 30 if set 2 is @3.","subs":["Rear Delt — Matrix diverging, face-pull grip","Rear-Delt Fly (machine)","Reverse Pec Deck"]},{"name":"Straight-Arm Cable Pulldown","sets":3,"reps":"12","load":"next plate (55–57.5)","last":"50×12 @3/3/3 (10/13) — green","rest":60,"cue":"Next plate up from 50. Arms long, pull to the thighs, 2s up. 3×12 @2 = green. Set 1 at 1 RIR or less = 50 for the rest.","subs":["Cable Pullover","DB Pullover"]},{"name":"EZ-Bar Curl","sets":3,"reps":"8-10","load":"80","last":"80×10 @3/3/1 (10/13) — green","rest":90,"cue":"80 holds. nce with either (Schumann 2022). The one cost it found was in explosive power, which isn't what this block trains. After the lift, never before it. This card is optional — it doesn't count against the week if you skip it.","desc":"Bike, incline walk or elliptical, straight after the last set. Easy enough for full sentences the whole way. 20 minutes. Log the minutes and the distance. Day ran long = skip it.","distLabel":"Distance (mi)"},{"id":"mob2","date":"2026-10-21","title":"Mobility — 15 min","time":"Morning","kind":"act","badge":"Mobility","why":"Leg day. The depth work for the leg press lives here — and this week it's also the check on the hip flexor before the split squat","research":"The deep squat hold, the adductor rock-backs and the 90/90 are the leg-press depth work. Slow. A strained muscle gets loaded in its pain-free range, not stretched hard in the first days — so the hip-flexor stretch is a light 20–30s this week. If the 90/90 or the stretch pulls at the front of the hip, note the side: it decides the split squat this afternoon.","desc":"Easy bike 5 min if no mat. Then: 90/90 hip switches ×5/side, half-kneeling hip-flexor stretch 20–30s/side RIGHT first (gentle), adductor rock-backs ×10 (hold the last one 20s), deep squat hold 2×30s (heels down, hold a post), dead bug ×8/side, band external rotation ×15/side LEFT first. Note which side of the hip catches, if either.","distLabel":"—"},{"id":"legs1","date":"2026-10-21","title":"Legs — Block 2 · Wk 2","time":"Afternoon","kind":"lift","badge":"Strength","why":"Leg press holds at 495 and chases 10s. Leg extension goes to 110. The Glute Builder gets its own card — and the hip flexor gets a test before the split squat","research":"BLOCK 2, WEEK 2 OF 6. Fallback rule on every jump: set 1 at 1 RIR or less = the old number for the rest of the sets, logged. THE HIP FLEXOR: last Wednesday you wrote 'Trying diff movements bcs I tweaked my hip flexor,' skipped the split squat, and tried the Glute Builder and a goblet squat. On 9/2 you logged 'right hip flexor (maybe) is sore.' If it's the right side again, that's twice in seven weeks — worth noting where it is and what set it off. This card works either way. The leg press, curl and extension put little load on the hip flexor. What does load it: the split squat (the back leg is in a stretch), the hanging knee raise, and this morning's hip-flexor stretch. So the split squat opens with a bodyweight test, and the hip thrust has its own slot either way. LEG PRESS: 495×8 @3 across, 'No pain,' on a new machine at a different angle. Holds — chase 10s. 4×10 @2 is the gate. On the etiquette note: rest stays 3 minutes. If it's busy, let someone work in between sets — you lose nothing. HIP THRUST (Glute Builder): 'Loved it. It kicked my ass literally.' The log shows 0 for the load — type the plates this time so next week has a number to beat. ADDUCTOR: 55 went @5 and 6+. 65. LEG CURL: your call — 'Don't go up in weight.' 80 holds with the 2s hold. The seated curl is the right machine: in a 12-week trial the seated version grew the hamstrings more than the lying version, because the bent hip works the hamstring at a longer length (Maeo 2021). LEG EXTENSION: 100×12 @6+/4/2 — gate met, 110. And your note: 'Today is first day I saw my legs and saw the muscles coming.' CALF: 70 on the Hammer Strength plate-loaded with the 3s hold went 12, 8, 8. Your read was right — 'If I'm gonna hold 3s I gotta stay lower.' 60, and keep the hold.","warmup":"5 min bike, bodyweight squat ×15, 90/90 ×5/side, hip-flexor stretch 20s RIGHT first (gentle). Leg press ramp 135×12, 225×8, 315×5, 405×3, 455×1 — 60s between.","ex":[{"name":"Leg Press (Life Fitness linear — feet HIGH)","sets":4,"reps":"8-10","load":"495","last":"495×8 @3/3/3/3 (10/14), new machine — 'Nice. No pain. This machine is diff angle and it's to my benefit.'","rest":180,"cue":"495. 4×8–10 @2 — chase 10s. Tailbone on the pad, brace before every unrack. 4×10 @2 opens 515. Log the machine.","subs":["Hack Squat","Belt Squat","Goblet Squat"]},{"name":"Seated Adductor Machine (2s hold)","sets":3,"reps":"15","load":"65","last":"55×15 @5/6+, set 3 skipped (10/14)","rest":90,"cue":"65, 2s at the squeeze. Three sets this time. Right groin changes feel = back to 55, log it.","subs":["Copenhagen Plank (knee)","Side-lying Adductor Raise","Cossack Squat (BW)"]},{"name":"Bulgarian Split Squat — LEFT LEG FIRST — hip-gated","sets":3,"reps":"10","load":"40","last":"Skipped 10/14 — hip flexor · 35×10 @6+/6+/4 (9/23)","rest":150,"cue":"Test first: 5 bodyweight reps each leg, left first. Any pull at the front of either hip = skip this card, log 'hip — skipped' and which side. Clear = 40, same short stance, DB in the opposite hand.","subs":["DB Reverse Lunge — LEFT first","Step-up (LEFT first)","Leg Press single-leg","Skip — hip"]},{"name":"Hip Thrust — Glute Builder machine","sets":3,"reps":"10-12","load":"log the plates","last":"Load logged as 0 — 10/10/10 @2/1/2 (10/14) — 'Loved it. It kicked my ass literally.'","rest":90,"cue":"Same load as last week — type it this time. Pad on the hips, chin tucked, ribs down, drive through the heels, 1s squeeze at the top. 3×12 @2 = next plate next week.","subs":["Barbell Hip Thrust (bench)","Glute Bridge — DB on hips","Cable Pull-through"]},{"name":"Seated Leg Curl (2s hold)","sets":3,"reps":"8-10","load":"80","last":"80×8 @2/2/1 (10/14) — 'The hold is killa. I need to do better. Don't go up in weight.'","rest":90,"cue":"80 with the 2s hold — your call, no jump. Chase 10s with the hold intact. 3×10 @2 opens 85.","subs":["Lying Leg Curl","Nordic Negatives","Cable Pull-through"]},{"name":"Leg Extension","sets":3,"reps":"12","load":"110","last":"100×12 @6+/4/2 (10/14) — green · 'saw the muscles coming'","rest":90,"cue":"110, 1s squeeze at the top. 3×12 @2 opens 120. Set 1 at 1 RIR or less = 100 for the rest.","subs":["Sissy Squat (BW)","Single-leg Extension"]},{"name":"Seated Calf Raise (Hammer Strength plate-loaded or Matrix, 3s bottom hold)","sets":3,"reps":"12","load":"60 HS plate · 65 Matrix","last":"HS plate-loaded 70×12 @2, 8 @0, 8 @0 (10/14) — 'If I'm gonna hold 3s I gotta stay lower.'","rest":60,"cue":"60 on the Hammer Strength, 3s at the bottom on every rep. 3×12 @2 opens 70 again. Log the machine.","subs":["Standing Calf Raise","Leg-press Calf Press","Single-leg BW on step (3s down)"]},{"name":"Hanging Knee Raise — lower half — back-gated","sets":3,"reps":"15-20","load":"BW","last":"BW 20/15/15 @2/2/1 (10/14)","rest":60,"cue":"Knees to 90, 3s down. Hip flexor still talking = reverse crunch on the bench. Grip gone = dead bug.","subs":["Reverse Crunch on bench","Dead Bug — 3s reach","Hanging Knee Raise (full) — back-gated"]}]},{"id":"z2b","date":"2026-10-21","title":"Zone 2 — 20 min · optional","time":"After the lift","kind":"act","badge":"Zone2","opt":true,"why":"Moved from Thursday to Wednesday. Thursday ran 67 minutes and you said it was too long; Wednesday ran 48, the shortest full session of the week. Easy spinning after legs doubles as recovery","research":"Easy cardio in the same session doesn't take from muscle or max strength: a 43-study meta-analysis found no interference with either (Schumann 2022). The one cost it found was in explosive power, which isn't what this block trains. After the lift, never before it. This card is optional — it doesn't count against the week if you skip it.","desc":"Bike, incline walk or elliptical, straight after the last set. Easy enough for full sentences the whole way. 20 minutes. Log the minutes and the distance. Day ran long = skip it.","distLabel":"Distance (mi)"},{"id":"arms1","date":"2026-10-22","title":"Arms + Shoulders — Block 2 · Wk 2","time":"Afternoon","kind":"lift","badge":"Strength","why":"Shoulder press goes to 45, incline curl to 35, hammer to 50 — all three earned last Thursday. Plus an option to get this day under an hour","research":"BLOCK 2, WEEK 2 OF 6. Fallback rule on every jump: set 1 at 1 RIR or less = the old number for the rest of the sets, logged. 'Great workout. It took a long time.' 67 minutes, 26 sets. The rests are where the time went: laterals averaged 180s against 60, curls 160–200s against 90. TIME OPTION, yours to use or not: pair a biceps card with a triceps card and alternate — curl, 45s, pushdown, 45s. The opposing muscle rests while the other works, and paired sets like this kept the total work the same in less time (Robbins 2010). Easy pairs: incline curl + pushdown, hammer curl + seated extension, reverse curl + one-arm OH extension. SHOULDER PRESS: 40×10 @4/4/3 — top of the range with room. 45, same rotation, tight to the body. Can't keep it tight = 40. PREACHER: 55 if it's free. If not, the strict standing curl — you ran 40 with 6s lowerings because 45 and 50 were taken. That works: a slower lowering at a lighter load still takes the set close to failure. INCLINE CURL: 30×10 @6+/5/3 — gate met, 35. HAMMER: 45×8 @2 across, green — 50. REVERSE CURL: 50 holds (set 2 @1). PUSHDOWN: 80 with the 1s hold went @4/2/1. Holds — or Monday's new plate if Monday went @2 across. BENCH DIPS — honest warning: the bottom of a dip puts the front of the shoulder in the same stretched position as the bottom of a wide press, the position that hurt on 9/28. Yours went clean, so it stays as a sub — stop with the upper arm level with the floor. The first sub is now the rope overhead extension, for the same reason as Monday: overhead work grows the long head more (Maeo 2023). HALO: no 35s at this gym, so you took the 45 to 12 @1. That's heavy for a circle around the head. 45 for 10, or the 25 for 15–20 — both fine. Set 2 of the halo logged as 66,329 reps — fix it in the app if you want the record clean.","warmup":"Band pull-aparts ×15, band external rotation ×20/side LEFT first (elbow pinned), light curls ×15, light pushdowns ×15, 20×10 then 30×5 DB press easy — how does the left feel going up?","ex":[{"name":"DB Lateral Raise — both arms","sets":3,"reps":"12-15","load":"25","last":"25×12 @6+/3/2 (10/15)","rest":60,"cue":"25s, build toward 15. 3×15 @2 opens 30. Full 60 — it averaged 180 last week.","subs":["Cable Lateral Raise","Machine Lateral Raise"]},{"name":"Face Pull (staggered stance)","sets":3,"reps":"15","load":"25–30","last":"25×15 @2/2/2 (10/15) — green","rest":60,"cue":"25 for set 1; 30 for sets 2–3 if set 1 is @3. 1s at the back.","subs":["Rear Delt — Matrix diverging, face-pull grip","Rear-Delt Fly (machine)","Reverse Pec Deck"]},{"name":"Seated DB Shoulder Press — palms in, rotate out — YOUR CALL","sets":3,"reps":"8-10","load":"45/db","last":"40×10 @4/4/3 (10/15) — green","rest":120,"cue":"45s, same rotation, tight to the body the whole way. Left sets the depth. Can't keep it tight at 45, or any pinch = 40, log it.","subs":["Landmine Press (light)","Machine Shoulder Press (light)","Skip"]},{"name":"Preacher Curl (machine)","sets":3,"reps":"10-12","load":"55","last":"Subbed: standing DB 40×12 @6+/4/4 (10/15), 6s down on sets 2–3 — '45 and 50 was taken'","rest":90,"cue":"55 on the machine, 3s down, full stretch. Taken: strict standing DB curl — 45 if it's there, 40 with 5–6s down if not.","subs":["Standing DB Curl — strict, 3s down — 45","EZ-Bar Curl","Cable Curl"]},{"name":"Incline DB Curl — alternating, 3s down","sets":3,"reps":"8-10","load":"35","last":"30×10 @6+/5/3 (10/15) — gate met","rest":90,"cue":"35, same honest 3s. Set 1 under 8 = 30 for the rest. 3×10 @2 at 35 = green.","subs":["Bayesian Cable Curl","Preacher Curl"]},{"name":"Hammer Curl — straight — LEFT FIRST","sets":3,"reps":"8","load":"50","last":"45×8 @2/2/2 (10/15) — green","rest":90,"cue":"50, left first, left sets the count. Left under 6 on set 1 = 45 for the rest.","subs":["Rope Cable Hammer","Cross-Body Hammer"]},{"name":"Reverse-Grip EZ Curl — forearms","sets":2,"reps":"12-15","load":"50","last":"50×15 @2/1 (10/15)","rest":60,"cue":"50 holds, wrists straight. 2×15 @2 opens 60.","subs":["DB Wrist Curl + Extension ×15 each","Plate Pinch Hold 30s","Cable Reverse Curl"]},{"name":"Triceps Pushdown — bar or rope (1s bottom hold)","sets":3,"reps":"12","load":"80 (or Monday's plate)","last":"80×12 @4/2/1 with the hold (10/15)","rest":60,"cue":"80 with the 1s hold — or Monday's new plate if Monday went @2 across. 3×12 @2 = green.","subs":["Single-arm Pushdown","OH Cable Ext"]},{"name":"Seated Triceps Extension (Hammer Strength cable)","sets":3,"reps":"10-12","load":"130","last":"Machine not there — subbed Bench Dip BW×15 @3/2/2 (10/15)","rest":60,"cue":"130 if the Hammer Strength is there. Not there = rope OH cable extension, 3×12. Bench dip only with the upper arm stopping level with the floor.","subs":["Rope OH Cable Ext — two hands","One-Arm OH Cable Ext — LEFT FIRST","Bench Dip — upper arm to parallel, pain-gated"]},{"name":"One-Arm OH Cable Ext — LEFT FIRST","sets":2,"reps":"10-12","load":"15 (or 17.5)","last":"Skipped 10/15 — time · Monday: 20×12 @1, 8 @0, 8 @0","rest":60,"cue":"Same number as Monday: 15, left first. Paired with the reverse curl it costs almost no time.","subs":["DB OH Ext (single, light)","Rope OH Ext"]},{"name":"Plate Halo — 'Around the World'","sets":2,"reps":"10-12","load":"45 · or 25","last":"45×12 @1 (10/15), set 2 logged as 66,329 — 'No 35 plates or kettles.'","rest":90,"cue":"45 for 2×10, or the 25 for 2×15–20. Elbows soft, slow circle. Any tweak = log exactly where.","subs":["DB Front Raise","Skip"]}]},{"id":"post1","date":"2026-10-23","title":"Posterior + Back — Block 2 · Wk 2","time":"Afternoon","kind":"lift","badge":"Strength","why":"'Keep the workout. Just long day.' Kept. Carry goes to 75; the RDL holds at 95 and stops further from failure","research":"BLOCK 2, WEEK 2 OF 6. Fallback rule on every jump: set 1 at 1 RIR or less = the old number for the rest of the sets, logged. The row, the hang and the plank were skipped last Friday ('Just tired'). You did cable rotations 3×12 at 25 a side instead — that's real core work, and it's on the plank's sub list now. CARRY: 70×40 yd ×3, clean. 75. RDL: the card asked for 3–4 in the tank and you ran 95×10 @2 and @1. No back note, which is the part that matters. 95 holds and stops at @3. The hinge is still being earned back — 95 @3 with a quiet back two weeks running opens 115. The RDL loads the hip flexor lightly; Wednesday will tell you if it's an issue. SHRUG: no 65s. 60×15 went @5/4 — 70 if the rack has them, otherwise 60×20. ROW: 100, as carded last week. HANG and PLANK: same targets — 30s hangs, 60/30/30 plank. There's no Block 2 number yet, so whatever you hold is the one to beat. THE ORDER stays: carries first so the grip work gets done, pull-through before the back extension.","warmup":"Cat-cow ×10, bird-dog ×8/side, hinge drill with a dowel ×10 — hips back, dowel touching head, upper back, tailbone. No mat: bike 5 min, then the dowel drill standing.","ex":[{"name":"Suitcase Carry — LEFT HAND FIRST","sets":3,"reps":"40 yd/side","load":"75","last":"70×40 yd ×3 (10/16)","rest":90,"cue":"75. Tall, no lean, other arm quiet, left first. No 75s = 70 for 50 yd. Low back working is the point; low back pinching is not — log which.","subs":["Farmer Carry (both hands)","Rack Carry"]},{"name":"Cable Pull-Through","sets":3,"reps":"12","load":"35","last":"35×12 @2/2/2 (10/16) — green","rest":90,"cue":"35, hips back, let the cable set the hinge. 3×12 @2 again = next plate next week. Goes first on purpose.","subs":["Kettlebell/DB Swing (light)","Hip Thrust (BW)"]},{"name":"45° Back Extension (BW)","sets":3,"reps":"12","load":"BW","last":"BW×12 @1/2/2 (10/16)","rest":90,"cue":"Glutes squeeze at the top, spine long. 3×12 @2. Set 1 headed to 0 = stop at 10.","subs":["Bird-dog ×10/side","Glute Bridge ×15","Cable Pull-through"]},{"name":"Chest-Supported Row — Matrix diverging, ROW grip","sets":3,"reps":"10-12","load":"100","last":"Skipped 10/16 — 'Just tired.' · 100×12 @2 (9/25)","rest":120,"cue":"100 from set 1, 2s return, chest on the pad. 3×12 @2 opens 110. Not at this gym = Precor diverging row at 110, or LF ISO at 130.","subs":["ISO-La /* ---------- storage (safe) ---------- */
let MEM = {}; let CANSTORE = true;
function load(){ try{ const s = localStorage.getItem(CFG.key); return s?JSON.parse(s):{}; }
  catch(e){ CANSTORE=false; return MEM; } }
function save(){ try{ localStorage.setItem(CFG.key, JSON.stringify(S)); }
  catch(e){ CANSTORE=false; MEM = S; } }
let S = load();
S.r = S.r||{}; S.x = S.x||{}; S.act = S.act||{}; S.gl = S.gl||{}; S.added = S.added||{}; S.f = S.f||{};
if(CFG.block && S.glBlock !== CFG.block){ // new block: archive the old green lights, start clean
  if(Object.keys(S.gl).length){ S.glOld = S.glOld||{}; S.glOld['b'+(S.glBlock||CFG.block-1)] = S.gl; }
  S.gl = {}; S.glBlock = CFG.block; save();
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayName(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}); }
function mday(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'}); }
function doy(){ const d=new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0))/864e5); }
function minRep(r){ const m = String(r).match(/\d+/); return m?parseInt(m[0]):1; }

const DATES = [...new Set(CFG.sessions.map(s=>s.date).concat(CFG.fuel && CFG.fuel.on && CFG.restDate ? [CFG.restDate] : []))].sort();
let CUR = DATES.includes(todayISO()) ? todayISO() : DATES[0];
let VIEW = 'week';

/* ---------- session status ---------- */
function sesStatus(s){
  const k = s.date + '|' + s.id;
  if(s.kind !== 'lift'){
    const a = S.act[k];
    return (a && a.done) ? {txt:'✓ done', cls:'done'} : {txt:s.opt?'optional':'—', cls:''};
  }
  const x = S.x[k]; if(!x) return {txt:'—', cls:''};
  const total = s.ex.length;
  let n = 0;
  s.ex.forEach((e,i)=>{ const st=x[i]; if(st && st.sets && st.sets.some(t=>t&&t.t)) n++; });
  if(n===0) return {txt:'—', cls:''};
  return n>=total ? {txt:'✓ done', cls:'done'} : {txt:n+'/'+total+' lifts', cls:'part'};
}

/* ---------- render ---------- */
function render(){ VIEW==='week' ? renderWeek() : renderDay(); }
function goWeek(){ VIEW='week'; render(); window.scrollTo(0,0); }
function setDay(d){ CUR = d; VIEW='day'; render(); window.scrollTo(0,0); }

function renderWeek(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><div class="sys">C&amp;C Health OS</div></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari.</div>`;
  const req = CFG.sessions.filter(s=>!s.opt);
  const all = req.length;
  const done = req.filter(s=>sesStatus(s).cls==='done').length;
  const bonus = CFG.sessions.filter(s=>s.opt && sesStatus(s).cls==='done').length;
  h += `<div class="card"><div class="eyebrow">${esc(CFG.weekLabel)}</div>
    <div style="font-size:14px">${done} of ${all} sessions complete${bonus?' · +'+bonus+' optional':''}</div>
    <div class="prog"><i style="width:${all?Math.round(done/all*100):0}%"></i></div>${fuelWeekLine()}</div>`;
  DATES.forEach(d=>{
    const today = d===todayISO();
    const ss = CFG.sessions.filter(s=>s.date===d);
    if(!ss.length) return;
    h += `<div class="wk ${today?'today':''}" onclick="setDay('${d}')">
      <div class="wkh"><div class="wkd">${dayName(d)}${today?' · today':''}</div><div class="wkdate">${mday(d)}</div></div>`;
    ss.forEach(s=>{
      const st = sesStatus(s);
      h += `<div class="wks"><div><span class="dot ${(s.badge||'').replace(' ','')}"></span><span class="t">${esc(s.title)}</span>
        <div class="sub2" style="margin-left:15px">${esc(s.time||'')}</div></div>
        <div class="st ${st.cls}">${st.txt}</div></div>`;
    });
    h += `</div>`;
  });
  h += `<div class="wk ${fuelOn()&&CFG.restDate===todayISO()?'today':''}" onclick="${fuelOn()&&CFG.restDate?`setDay('${CFG.restDate}')`:'void(0)'}"><div class="wkh"><div class="wkd" style="color:var(--dim)">Sun · rest</div><div class="wkdate">${mday(CFG.restDate||DATES[DATES.length-1])}</div></div>
    <div class="wks"><div><span class="dot"></span><span class="t" style="color:var(--dim)">${fuelOn()?'Full rest — fuel card and check-in · reset today':'Full rest — export Saturday, reset today'}</span></div></div></div>`;
  h += `<div class="card"><div class="eyebrow">Week close-out</div>
    <div class="small" style="margin-bottom:9px"><b>The ritual:</b> Saturday → Export week, paste to Claude${fuelOn()?', and attach the MacroFactor Quick Export':''}. Sunday → Reset. Monday's files arrive reprogrammed.</div>
    <div class="row"><button class="btn acc" onclick="exportData()">Export week &amp; copy</button>
    <button class="btn" onclick="shareData()">Share…</button>
    <button class="btn ghost" onclick="resetWeek()">Reset week</button></div></div>`;
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

function renderDay(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><button class="home" onclick="goWeek()">‹ Week</button></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari. It works offline and remembers everything.</div>`;
  h += `<div class="chips">` + DATES.map(d=>
    `<button class="chip ${d===CUR?'on':''}" onclick="setDay('${d}')">${dayName(d)} ${mday(d)}</button>`).join('') + `</div>`;
  h += readinessCard();
  h += fuelCard();
  h += lowBanner();
  const todays = CFG.sessions.filter(s=>s.date===CUR);
  todays.forEach(s=>{ h += missionCard(s); h += (s.kind==='lift') ? liftCard(s) : actCard(s); });
  if(!todays.length) h += `<div class="card small">Rest day. Check-in and fuel only. Export was Saturday; reset today.</div>`;
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

/* ---------- exercise state ---------- */
function xkey(sid){ return CUR + '|' + sid; }
function exState(sid, i){
  const k = xkey(sid); S.x[k] = S.x[k]||{};
  S.x[k][i] = S.x[k][i]||{sets:[],c:'',tags:[],sub:''};
  return S.x[k][i];
}

/* ---------- readiness ---------- */
function rget(){ S.r[CUR] = S.r[CUR]||{}; return S.r[CUR]; }
function rset(f,v){ rget()[f]=v; save(); render(); }
function rateRow(f,label){
  const v = rget()[f];
  return `<div class="lbl">${label}</div><div class="rd">` +
    [1,2,3,4,5].map(n=>`<button class="rb ${v===n?'on':''}" onclick="rset('${f}',${n})">${n}</button>`).join('') + `</div>`;
}
function readinessCard(){
  const r = rget();
  let inner = rateRow('e','Energy') + rateRow('so','Soreness (5 = very sore)') + rateRow('sl','Sleep quality') + rateRow('m','Mood');
  inner += `<div class="grid2" style="margin-top:10px">
    <div><div class="lbl">Bodyweight (lbs)</div><input inputmode="decimal" value="${esc(r.bw||'')}" onchange="rset('bw',this.value)"></div>
    <div><div class="lbl">Sleep (hrs)</div><input inputmode="decimal" value="${esc(r.slh||'')}" onchange="rset('slh',this.value)"></div></div>`;
  if(CFG.whoop){
    inner += `<h3 class="sect">Whoop</h3><div class="grid2">
      <div><div class="lbl">Recovery %</div><input inputmode="numeric" value="${esc(r.rec||'')}" onchange="rset('rec',this.value)"></div>
      <div><div class="lbl">HRV (ms)</div><input inputmode="numeric" value="${esc(r.hrv||'')}" onchange="rset('hrv',this.value)"></div>
      <div><div class="lbl">Resting HR</div><input inputmode="numeric" value="${esc(r.rhr||'')}" onchange="rset('rhr',this.value)"></div>
      <div><div class="lbl">Strain</div><input inputmode="decimal" value="${esc(r.strain||'')}" onchange="rset('strain',this.value)"></div></div>`;
  }
  const filled = ['e','so','sl','m'].filter(f=>r[f]).length;
  return `<details ${filled<4?'open':''}><summary>Daily check-in ${filled===4?'✓':'('+filled+'/4)'}</summary>
    <div class="card">${inner}</div></details>`;
}
function lowBanner(){
  const r = rget();
  const vals = ['e','sl','m'].map(f=>r[f]).filter(Boolean);
  const avg = vals.length===3 ? (vals.reduce((a,b)=>a+b,0) + (r.so?(6-r.so):0)) / (r.so?4:3) : null;
  const whoopLow = CFG.whoop && r.rec && Number(r.rec) < 34;
  if((avg!==null && avg <= 2.5) || whoopLow){
    return `<div class="adjust"><b>Readiness is low today.</b> Option, not an order: keep planned loads, drop the last set of each exercise, and bank recovery. Research: acute readiness-based volume cuts protect long-term progress (autoregulation, Helms 2018). Your call — you set the limits.</div>`;
  }
  return '';
}

/* ---------- fuel: the schedule and the misses (food log + weight live in MacroFactor) ---------- */
function fuelOn(){ return !!(CFG.fuel && CFG.fuel.on); }
function dayType(d){ return CFG.sessions.some(s=>s.date===d && s.kind==='lift') ? 'lift' : 'rest'; }
function fget(d){ S.f[d] = S.f[d]||{}; S.f[d].s = S.f[d].s||{}; return S.f[d]; }
function fmark(id,v){ const f=fget(CUR); if(f.s[id] && f.s[id].v===v) delete f.s[id]; else f.s[id]={v:v,t:Date.now()}; save(); render(); }
function fcre(){ const f=fget(CUR); f.cr = f.cr?0:1; save(); render(); }
function fnote(v){ fget(CUR).n = v; save(); }
function fuelStats(d){
  const slots = CFG.fuel[dayType(d)]||[], f = S.f[d]||{}, m = f.s||{};
  const core = slots.filter(x=>!x.opt);
  return { n:core.length, ate:core.filter(x=>m[x.id]&&m[x.id].v===1).length,
    miss:core.filter(x=>m[x.id]&&m[x.id].v===-1), opt:slots.filter(x=>x.opt&&m[x.id]&&m[x.id].v===1),
    cr:!!f.cr, note:f.n||'', marks:slots.filter(x=>m[x.id]&&m[x.id].v===1).map(x=>({id:x.id,t:m[x.id].t})) };
}
function fuelWeekLine(){
  if(!fuelOn()) return '';
  let a=0,n=0,mi=0;
  DATES.filter(d=>d<=todayISO()).forEach(d=>{ const st=fuelStats(d); a+=st.ate; n+=st.n; mi+=st.miss.length; });
  return `<div class="small" style="margin-top:9px">Fuel: ${a} of ${n} feedings eaten${mi?' · '+mi+' missed':''}${n-a-mi>0?' · '+(n-a-mi)+' not marked':''}</div>`;
}
function fuelCard(){
  if(!fuelOn()) return '';
  const F = CFG.fuel, ty = dayType(CUR), T = F.targets[ty], slots = F[ty]||[], f = fget(CUR), st = fuelStats(CUR);
  let rows = '';
  slots.forEach(x=>{ const v = f.s[x.id] ? f.s[x.id].v : 0;
    rows += `<div class="frow"><div><div class="ft">${esc(x.l)} <span class="fw">${esc(x.when)}</span></div>
      <div class="fs tg2">${esc(x.t)}</div><div class="fs">${esc(x.cue)}</div></div>
      <button class="ck ${v===1?'done':''}" onclick="fmark('${x.id}',1)">✓</button>
      <button class="ck ${v===-1?'miss':''}" onclick="fmark('${x.id}',-1)">✕</button></div>`; });
  const left = st.n - st.ate - st.miss.length;
  return `<details ${left>0?'open':''}><summary>Fuel · ${ty==='lift'?'lift day':'rest day'} · ${st.ate}/${st.n} eaten${st.miss.length?' · '+st.miss.length+' missed':''}${left>0||st.miss.length?'':' ✓'}</summary>
    <div class="card"><div class="eyebrow">${esc(F.phase)}</div>
    <div class="target">${T.k.toLocaleString('en-US')} kcal · protein ${T.p} g · carbs ${T.c} g · fat ${T.f} g · fiber ${esc(F.fiber)} g</div>
    <div class="small" style="margin:6px 0 4px">Food and morning weight go in MacroFactor. On this card: ✓ ate it, ✕ missed it.</div>
    ${rows}
    <div class="frow"><div><div class="ft">Creatine ${F.creatine} g</div><div class="fs">Any time of day, every day.</div></div>
      <button class="ck ${f.cr?'done':''}" onclick="fcre()">✓</button><div></div></div>
    <div class="lbl">Fuel note — restaurant, off-plan, how 5:00 felt</div>
    <textarea onchange="fnote(this.value)">${esc(f.n||'')}</textarea>
    <details style="margin-top:10px"><summary>Why these numbers</summary>
      <div class="small" style="margin-top:8px">${esc(F.why)}</div>
      ${(F.rules||[]).map(r=>`<div class="small" style="margin-top:6px">• ${esc(r)}</div>`).join('')}</details>
    </div></details>`;
}

}

function exCard(s,ex,i){
  const st = exState(s.id,i);
  const planned = ex.sets;
  const sec = ex.unit==='sec';
  const nsets = Math.max(planned, st.sets.length + (st.sets.length>=planned?1:0));
  let rows = '';
  for(let si=0; si<nsets; si++){
    const set = st.sets[si]||{};
    const lab = ex.rows ? ex.rows[si % ex.rows.length] : '';
    rows += `<div class="setrow"><div class="n">${lab?esc(lab.charAt(0)):si+1}</div>
      <input placeholder="${ex.load==='BW'?'BW':'lbs'}" inputmode="decimal" id="w_${s.id}_${i}_${si}" value="${esc(set.w||'')}" onchange="setField('${s.id}',${i},${si},'w',this.value)">
      <input placeholder="${sec?(lab?esc(lab):'sec'):'reps'}" inputmode="numeric" id="r_${s.id}_${i}_${si}" value="${esc(set.r||'')}" onchange="setField('${s.id}',${i},${si},'r',this.value)">
      <select id="rir_${s.id}_${i}_${si}" onchange="setField('${s.id}',${i},${si},'rir',this.value)">
        <option value="">RIR</option>${[0,1,2,3,4,5].map(n=>`<option ${set.rir===String(n)||set.rir===n?'selected':''}>${n}</option>`).join('')}
        <option ${set.rir==='6+'?'selected':''}>6+</option></select>
      <button class="ck ${set.t?'done':''}" onclick="ckSet('${s.id}',${i},${si},${ex.rest||90})">✓</button></div>`;
  }
  const glOn = !ex.nogl && S.gl[ex.name];
  const subsOpen = st.showSubs;
  return `<div class="exc">
    <div class="exhead"><div>
      <div class="exname">${esc(ex.name)}${st.sub?` <span class="sub">→ ${esc(st.sub)}</span>`:''}${ex.added?' <span class="sub">(added)</span>':''}</div>
      <div class="target">${ex.target?esc(ex.target):ex.sets+'×'+esc(ex.reps)+' @ '+esc(ex.load)} · rest ${fmtRest(ex.rest||90)}</div>
      ${ex.last?`<div class="last">Last: ${esc(ex.last)}</div>`:''}
    </div></div>
    ${ex.cue?`<div class="cue">Coach: ${esc(ex.cue)}</div>`:''}
    ${rows}
    ${glOn?`<div class="gl">🟢 Green light — ${sec?'add time next week':'add load or a rep next time'}</div>`:''}
    <div class="tags">
      ${CFG.tags.map(t=>`<button class="tg ${t.cls||''} ${(st.tags||[]).includes(t.l)?'on':''}" onclick="tagEx('${s.id}',${i},'${t.l}')">${t.l}</button>`).join('')}
    </div>
    <div class="row">
      ${ex.subs&&ex.subs.length?`<button class="btn" onclick="toggleSubs('${s.id}',${i})">${st.sub?'Change / undo swap':'Machine taken?'}</button>`:''}
      ${ex.mus?`<button class="btn" onclick="toggleMus('${s.id}',${i})">💪 The muscle</button>`:''}
      <button class="btn ghost" onclick="addSetNow('${s.id}',${i})">＋ Set</button>
    </div>
    ${st.showMus&&ex.mus?musFig(ex):''}
    ${subsOpen?`<div class="subs"><div class="lbl" style="margin-top:0">Same muscle, do instead:</div>
      ${st.sub?`<div class="so" style="color:var(--good)" onclick="useSub('${s.id}',${i},'')">↩ Back to original: ${esc(ex.name)}</div>`:''}
      ${ex.subs.map(o=>`<div class="so" onclick="useSub('${s.id}',${i},'${esc(o).replace(/'/g,"\\'")}')">→ ${esc(o)}</div>`).join('')}</div>`:''}
    <div class="lbl">Comment</div>
    <textarea onchange="cmt('${s.id}',${i},this.value)">${esc(st.c||'')}</textarea>
  </div>`;
}
function fmtRest(s){ return s>=120 ? (s/60)+' min' : s+'s'; }
function setField(sid,i,si,f,v){ const st=exState(sid,i); st.sets[si]=st.sets[si]||{}; st.sets[si][f]=v; save(); }
function ckSet(sid,i,si,rest){
  const st = exState(sid,i);
  const w = $('w_'+sid+'_'+i+'_'+si).value, r = $('r_'+sid+'_'+i+'_'+si).value, rir = $('rir_'+sid+'_'+i+'_'+si).value;
  const cur = st.sets[si]||{};
  if(cur.t){ // second tap = un-check, keep the numbers
    st.sets[si] = {w, r, rir}; save(); render(); stopTimer(); return;
  }
  const now = Date.now();
  const prev = st.sets[si-1];
  st.sets[si] = {w, r, rir, t: now, rest: prev&&prev.t ? Math.round((now-prev.t)/1000) : null};
  greenCheck(sid,i); save(); render();
  const pl = ((CFG.sessions.find(x=>x.id===sid)||{}).ex||[])[i];
  if(pl && pl.restEvery && (si+1) % pl.restEvery !== 0){ stopTimer(); return; }
  startTimer(rest, si+2, !pl || si+1 >= pl.sets, pl && pl.rows ? pl.rows[(si+1) % pl.rows.length] : '');
}
function greenCheck(sid,i){
  if(CFG.deload) return;
  const s = CFG.sessions.find(x=>x.id===sid); if(!s||!s.ex[i]) return;
  const ex = s.ex[i]; const st = exState(sid,i);
  if(ex.nogl) return;
  if(ex.unit==='sec'){
    const first = st.sets.slice(0, ex.sets);
    if(first.length >= ex.sets && first.every((x,k)=>x && x.t && Number(x.r) >= (ex.secs ? ex.secs[k % ex.secs.length] : minRep(ex.reps)))) S.gl[ex.name] = 1;
    return;
  }
  const doneSets = st.sets.filter(x=>x&&x.t);
  if(doneSets.length >= ex.sets && doneSets.slice(0,ex.sets).every(x=>Number(x.r)>=minRep(ex.reps) && (x.rir==='6+'||Number(x.rir)>=2))){
    S.gl[ex.name] = 1;
  }
}
function tagEx(sid,i,t){ const st=exState(sid,i); st.tags=st.tags||[];
  const ix=st.tags.indexOf(t); if(ix>=0) st.tags.splice(ix,1); else st.tags.push(t); save(); render(); }
function toggleMus(sid,i){ const st=exState(sid,i); st.showMus=!st.showMus; save(); render(); }

/* ---------- muscle map (front + back figures) ---------- */
const MREG = {
 front: {
  shoulders:'<circle cx="30" cy="46" r="8"/><circle cx="72" cy="46" r="8"/>',
  chest:'<ellipse cx="40" cy="57" rx="10" ry="7"/><ellipse cx="62" cy="57" rx="10" ry="7"/>',
  biceps:'<ellipse cx="17" cy="64" rx="6" ry="11"/><ellipse cx="85" cy="64" rx="6" ry="11"/>',
  core:'<rect x="39" y="68" width="24" height="28" rx="7"/>',
  quads:'<ellipse cx="40" cy="128" rx="8" ry="23"/><ellipse cx="62" cy="128" rx="8" ry="23"/>',
  calves:'<ellipse cx="40" cy="170" rx="6" ry="13"/><ellipse cx="62" cy="170" rx="6" ry="13"/>'
 },
 back: {
  upperback:'<ellipse cx="51" cy="52" rx="17" ry="10"/>',
  lats:'<ellipse cx="40" cy="67" rx="9" ry="12"/><ellipse cx="62" cy="67" rx="9" ry="12"/>',
  lowerback:'<ellipse cx="51" cy="86" rx="9" ry="8"/>',
  triceps:'<ellipse cx="17" cy="64" rx="6" ry="11"/><ellipse cx="85" cy="64" rx="6" ry="11"/>',
  glutes:'<circle cx="43" cy="104" r="8"/><circle cx="59" cy="104" r="8"/>',
  hamstrings:'<ellipse cx="40" cy="134" rx="8" ry="18"/><ellipse cx="62" cy="134" rx="8" ry="18"/>',
  calves:'<ellipse cx="40" cy="170" rx="6" ry="13"/><ellipse cx="62" cy="170" rx="6" ry="13"/>'
 }
};
function bodyOutline(){
  return '<circle class="mbody" cx="51" cy="22" r="12"/>'+
   '<path class="mbody" d="M33 38 h36 a8 8 0 0 1 8 8 v46 a8 8 0 0 1 -8 8 h-36 a8 8 0 0 1 -8 -8 v-46 a8 8 0 0 1 8 -8 z"/>'+
   '<rect class="mbody" x="8" y="44" width="13" height="44" rx="6.5"/>'+
   '<rect class="mbody" x="81" y="44" width="13" height="44" rx="6.5"/>'+
   '<rect class="mbody" x="31" y="100" width="17" height="86" rx="8"/>'+
   '<rect class="mbody" x="54" y="100" width="17" height="86" rx="8"/>';
}
function musFig(ex){
  function fig(side,label){
    const regs = MREG[side];
    let shapes='';
    Object.keys(regs).forEach(k=>{
      const hot = ex.mus.includes(k);
      shapes += '<g class="mreg'+(hot?' hot':'')+'">'+regs[k]+'</g>';
    });
    return '<svg width="104" height="200" viewBox="0 0 102 192">'+shapes+bodyOutline()+
      '<text x="51" y="190" text-anchor="middle" fill="var(--dim)" font-size="9" letter-spacing="2">'+label+'</text></svg>';
  }
  const needF = ex.mus.some(k=>MREG.front[k]), needB = ex.mus.some(k=>MREG.back[k]);
  return '<div class="mfig">'+(needF?fig('front','FRONT'):'')+(needB?fig('back','BACK'):'')+
    (ex.act?'<div class="act">✋ '+esc(ex.act)+'</div>':'')+'</div>';
}
function cmt(sid,i,v){ exState(sid,i).c = v; save(); }
function toggleSubs(sid,i){ const st=exState(sid,i); st.showSubs=!st.showSubs; save(); render(); }
function useSub(sid,i,name){ const st=exState(sid,i); st.sub=name; st.showSubs=false; save(); render(); }
function addSetNow(sid,i){ const st=exState(sid,i); st.sets.push({}); save(); render(); }
function addEx(sid){
  const n = prompt('Exercise name:'); if(!n) return;
  const k = xkey(sid); S.added[k] = S.added[k]||[]; S.added[k].push(n); save(); render();
}

/* ---------- activity sessions (yoga / walks / zone 2) ---------- */
function aget(sid){ const k=xkey(sid); S.act[k]=S.act[k]||{}; return S.act[k]; }
function aset(sid,f,v){ aget(sid)[f]=v; save(); if(f==='done'||f==='feel') render(); }
function actCard(s){
  const a = aget(s.id);
  return `<div class="card">
    ${s.desc?`<div class="small" style="margin-bottom:10px">${esc(s.desc)}</div>`:''}
    <div class="grid2">
      <div><div class="lbl">Duration (min)</div><input inputmode="numeric" value="${esc(a.dur||'')}" onchange="aset('${s.id}','dur',this.value)"></div>
      <div><div class="lbl">${s.distLabel||'Distance (mi)'}</div><input inputmode="decimal" value="${esc(a.dist||'')}" onchange="aset('${s.id}','dist',this.value)"></div>
    </div>
    <div class="lbl">How did it feel? (1 rough – 5 great)</div>
    <div class="rd">${[1,2,3,4,5].map(n=>`<button class="rb ${a.feel===n?'on':''}" onclick="aset('${s.id}','feel',${n})">${n}</button>`).join('')}</div>
    <div class="lbl">Note</div><textarea onchange="aset('${s.id}','c',this.value)">${esc(a.c||'')}</textarea>
    <div style="margin-top:12px"><button class="done-big ${a.done?'on':''}" onclick="aset('${s.id}','done',${a.done?0:1})">${a.done?'✓ Done':'Mark done'}</button></div>
  </div>`;
}

/* ---------- rest timer ---------- */
let TINT = null;
function startTimer(sec, nextSet, last, nextName){
  stopTimer();
  const end = Date.now() + sec*1000;
  $('timer').style.display = 'block';
  $('tlab').textContent = (last ? 'Rest · next lift after this' : 'Rest · ' + (nextName ? nextName : 'set ' + nextSet) + ' next') + ' · target ' + fmtRest(sec);
  TINT = setInterval(()=>{
    const left = Math.max(0, end - Date.now());
    const s = Math.ceil(left/1000);
    $('tclock').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    $('tbar').style.width = (left/(sec*1000)*100)+'%';
    if(left<=0){ $('tclock').textContent = 'GO'; clearInterval(TINT);
      if(navigator.vibrate) navigator.vibrate([120,60,120]); }
  }, 250);
}
function stopTimer(){ if(TINT) clearInterval(TINT); $('timer').style.display='none'; }

/* ---------- export ---------- */
function buildExport(){
  let out = CFG.name.toUpperCase() + ' — C&C LOG EXPORT — ' + new Date().toLocaleString() + '\n';
  Object.keys(S.r).sort().forEach(d=>{
    const r = S.r[d]; const has = Object.values(r).some(v=>v);
    if(!has) return;
    out += '\n' + d + ' readiness: E' + (r.e||'-') + ' So' + (r.so||'-') + ' Sl' + (r.sl||'-') + ' M' + (r.m||'-');
    if(r.bw) out += ' | BW ' + r.bw;
    if(r.slh) out += ' | sleep ' + r.slh + 'h';
    if(CFG.whoop && (r.rec||r.hrv)) out += ' | Whoop rec ' + (r.rec||'-') + '% HRV ' + (r.hrv||'-') + ' RHR ' + (r.rhr||'-') + ' strain ' + (r.strain||'-');
  });
  CFG.sessions.forEach(s=>{
    const k = s.date + '|' + s.id;
    if(s.kind==='lift'){
      const x = S.x[k]; if(!x) return;
      let lines = '';
      const extras = S.added[k]||[];
      const names = s.ex.map(e=>e.name).concat(extras);
      names.forEach((nm,i)=>{
        const st = x[i]; if(!st || (!st.sets.length && !st.c && !st.tag)) return;
        const tEx = (s.ex[i]||{});
        const done = st.sets.map((t,k)=>t?Object.assign({k:k},t):null).filter(t=>t&&(t.t||t.w||t.r));
        const noW = tEx.load==='BW' ? 'BW' : '?';
        const setsTxt = done.map(t=> tEx.unit==='sec'
          ? (tEx.rows?tEx.rows[t.k % tEx.rows.length]+' ':'')+(t.w?t.w+'+':'')+(t.r||'?')+'s'+(t.rir?'@'+t.rir+'RIR':'')+(t.t?'':'(unchecked)')
          : (t.w||noW)+'×'+(t.r||'?')+'@'+(!t.rir?'?':t.rir)+'RIR'+(t.t?'':'(unchecked)')).join(', ');
        const rests = tEx.restEvery ? [] : done.map(t=>t.rest).filter(v=>v);
        const avgRest = rests.length ? Math.round(rests.reduce((a,b)=>a+b,0)/rests.length) : null;
        lines += '  ' + nm + (st.sub?' →SUB: '+st.sub:'') + ': ' + (setsTxt||'(no sets)');
        if(avgRest) lines += ' | avg rest ' + avgRest + 's (target ' + (tEx.rest||90) + 's)';
        if(S.gl[nm]) lines += ' | 🟢';
        if(st.tags&&st.tags.length) lines += ' | TAGS: ' + st.tags.join(',');
        if(st.c) lines += ' | "' + st.c + '"';
        lines += '\n';
      });
      if(lines){ out += '\n\n' + s.date + ' · ' + s.title + '\n' + lines; if(x.note) out += '  Session note: "' + x.note + '"\n'; }
    } else {
      const a = S.act[k]; if(!a || (!a.done && !a.dur && !a.c)) return;
      out += '\n\n' + s.date + ' · ' + s.title + ': ' + (a.done?'DONE':'logged') +
        (a.dur?' · '+a.dur+' min':'') + (a.dist?' · '+a.dist:'') + (a.feel?' · felt '+a.feel+'/5':'') + (a.c?' · "'+a.c+'"':'');
    }
  });
  if(fuelOn()){
    const hm = t => { const d = new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
    let fl = '', A=0, N=0, M=0, CR=0, BR=0, D=0;
    DATES.forEach(d=>{
      const st = fuelStats(d);
      if(!(st.ate || st.miss.length || st.opt.length || st.cr || st.note)) return;
      D++; A+=st.ate; N+=st.n; M+=st.miss.length; if(st.cr) CR++; if(st.opt.length) BR++;
      fl += '\n' + d + ' fuel (' + dayType(d) + '): ate ' + st.ate + '/' + st.n
        + (st.miss.length ? ' | MISSED: ' + st.miss.map(x=>x.l+' '+x.when).join(', ') : '')
        + (st.n-st.ate-st.miss.length>0 ? ' | not marked: ' + (st.n-st.ate-st.miss.length) : '')
        + (st.opt.length ? ' | bridge snack: yes' : '')
        + ' | creatine ' + (st.cr?'yes':'no')
        + (st.marks.length ? ' | tapped: ' + st.marks.map(k=>k.id+' '+hm(k.t)).join(', ') : '')
        + (st.note ? ' | "' + st.note + '"' : '');
    });
    if(fl) out += '\n\nFUEL — schedule adherence (food log and weight are in MacroFactor)' + fl
      + '\nFUEL WEEK: ' + D + ' days marked · ate ' + A + '/' + N + ' · missed ' + M + ' · bridge snack on ' + BR + ' days · creatine ' + CR + '/' + D;
  }
  out += '\n\n---JSON---\n' + JSON.stringify(S);
  return out;
}
function exportData(){
  const t = buildExport();
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>{}); ok = true; }
  alert(ok ? 'Log copied. Paste it to Claude.' : 'Copy failed — use Share instead.');
}
function shareData(){
  const t = buildExport();
  if(navigator.share){ navigator.share({title:CFG.name+' training log', text:t}); }
  else exportData();
}
function resetWeek(){
  if(!confirm('Reset for the new week? Make sure you exported first — this clears the week\'s logs. Green lights are kept.')) return;
  S.x={}; S.act={}; S.r={}; S.added={}; save(); VIEW='week'; render();
  alert('Clean slate. Green lights carried forward. See you Monday.');
}

render();
</script>
