<script>
const CFG = {"name": "Cassandra", "brand": "CASS <b>// RISE</b>", "tag": "Stronger every decade", "key": "cchos_cass_v1", "whoop": true, "deload": false, "weekLabel": "Week 9 · Oct 12 – 18 · Block 2, week 2 · Mon/Tue/Thu/Fri 45 min", "motiv": ["Block 2, week two. Last week you hit every number. This week some of them move.", "140 on the leg press. One set. You earned it at 130.", "Log dinner. Two weeks running, the app thinks you skip it.", "Four feedings, thirty grams each. That's the whole assignment.", "Protein before bed is tomorrow's breakfast.", "Eat for the 6:45 you. She's the one lifting.", "Stop with one left. The last ugly rep costs more than it pays.", "The elbow gets its test this week. One set. Listen to it.", "Curls are on the card Friday. You asked for arms.", "The 25 is yours on the row. Three tens at 22.5 said so.", "Recovery averaged 70 last week — your best week since August.", "Fast sets first. Push like you mean it, lower like you don't.", "Lean and strong, not small.", "Stronger came first. Bigger comes from sets and food.", "Creatine with breakfast. Every day, including Sunday.", "A rest day still has 120 grams in it.", "Every heavy rep today is bone you keep at 70.", "Whoop can't see an empty tank. Only you can — so log the food.", "Saturday: four numbers off the scale. The scoreboard starts there.", "Done beats perfect. Logged beats done."], "sessions": [{"id": "lowA", "date": "2026-10-12", "title": "Lower A — Block 2 · 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "Every lift hit its number last week. So the leg press gets one set at 140, the squat goes for eight, and the balance drill gets a fingertip", "research": "Last Monday was the cleanest session in your log: 130 for three eights with exactly two left each time, the 55 on the squat, every lift on target. That is what a well-chosen weight looks like, so today moves one step, not three. The leg press copies what worked on the row last Tuesday — one heavier set first, then back to the weight you own. Heavy sets are the ones that build strength: when the same work is done with heavy or light weights, muscle grows about the same, but strength goes up more with the heavy ones (Schoenfeld 2017). Your rests ran long last week — over two minutes on the pull-through and the step-up. Leave them long. In a trial comparing one-minute and three-minute rests, the longer rests built more strength and more muscle (Schoenfeld 2016; the lifters were trained young men), and your session still fit inside 45 minutes. The eyes-closed balance was too big a jump. That's the card's mistake, not yours — a few seconds is where almost everyone starts. Today it gets one fingertip on the rack: a touch too light to hold you up still steadies the body (Jeka 1994). Fuel: your recovery averaged 70 last week, the best since August. The food log still stops mid-afternoon. Dinner and the bedtime protein are this week's one ask.", "warmup": "5 min: brisk walk in, bodyweight squats ×10, glute bridges ×10, hip hinge drill with hands on hips ×10 (butt back, flat back), single-leg stand 15s each. Then one easy set on the leg press at 55 for 8 — the speed sets below finish the job.", "ex": [{"name": "Leg Press — speed set", "sets": 2, "reps": "5 fast", "load": "70", "last": "70×5 @6+/6+ RIR (10/5)", "rest": 60, "nogl": 1, "cue": "Two sets of five at 70 — half of today's heavy set. Lower for 3 seconds, then push as fast as you can. Keep your feet on the plate and stop just short of locking your knees. Easy and quick, not tiring. Pick 6+ for reps left. The weight stays light on purpose — speed is the whole point.", "mus": ["quads", "glutes"], "act": "Same muscles as the heavy sets — front of the thighs and the butt — asked to fire fast instead of hard. Think 'jump' without leaving the plate."}, {"name": "Leg Press", "sets": 3, "reps": "6, then 8", "load": "140 → 130", "last": "130×8 @2/2/2 RIR (10/5) 🟢", "rest": 120, "cue": "You hit 130 for three eights with exactly 2 left — right on target. So one set goes up. First a bridge: 110 for 3 easy reps, not logged. Set 1: 140 for six, stopping with 2 left — if rep 5 would be a grind, stop at 4 and write it down; that's the data. Sets 2 and 3: back to 130 for 8. Feet mid-platform, lower to 90°, drive through the whole foot, 2-minute rests. When 130 for 8 feels like 3 left, all three sets go to 140.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Goblet Squat", "sets": 3, "reps": "7-8", "load": "55", "last": "55×7 @2/2/2 RIR (10/5) 🟢", "rest": 120, "cue": "Same 55, one more rep: go for eight on any set that still has 2 left at seven. Chest proud, elbows inside the knees, full depth, slow down. Three eights with 2 left and the 60 is next. The elbow said nothing about holding the bell last week — if that changes, hug it tight against your chest so the forearms carry it, and tag it.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Cable Pull-Through", "sets": 3, "reps": "10-12", "load": "40", "last": "37.5×12 @2/2/2 RIR (10/5) 🟢", "rest": 120, "cue": "One small step: 40, for ten to twelve. Face away, rope between the legs, butt back toward the machine, flat back, stand and squeeze for a full second. Glutes, not back. Stop with 2 left — if that's ten, it's ten. If the back does the work at 40, go back to 37.5 for 12.", "mus": ["glutes", "hamstrings"], "act": "The butt. Squeeze it hard at the top of every rep — if you feel it in your lower back instead, don't lift as high."}, {"name": "Step-Up — RIGHT LEG FIRST", "sets": 3, "reps": "12/leg", "load": "BW · high step", "last": "High step, BW ×12 @3/2/1 RIR (10/5) 🟢", "rest": 120, "cue": "Same high step, same twelve a leg. Last week the third set ended with 1 left; this week the job is to finish it with 2. Hands free with the rack in reach. Right first. Drive through the heel, stand fully tall, take 3 seconds to lower. Take the full 2 minutes — the clock starts after the left leg. When all three sets have 2 left, a 10-lb bell joins, hanging at your side like Thursday's split squat.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Calf Raise", "sets": 2, "reps": "12", "load": "100", "last": "90×12 @4/4 RIR (10/5) 🟢", "rest": 60, "cue": "Up to 100 — four left on both sets says 90 was light. Two sets of twelve, 1s pause at the top, 3s down. If twelve isn't there at 100, take ten and note it.", "mus": ["calves"], "act": "Back of the lower leg. Pause at the top, slow 3s down."}, {"name": "Single-Leg Balance — eyes closed, fingertip on the rack — RIGHT FIRST", "sets": 2, "reps": "20s/side", "load": "BW", "last": "Eyes closed, no hands: a few seconds (10/5) · eyes open: 60s each side", "rest": 30, "cue": "Eyes closed with no hands was too big a step, so we build up to it. Stand next to the rack and rest one fingertip on it — light enough that it couldn't hold you up. Find your balance with eyes open, close them, and count to 20. Then the test: for the last 5 seconds, lift the fingertip half an inch and see how long you last. Right in set 1, left in set 2. Type your hands-free seconds in the reps box — 2 or 3 is a real number.", "mus": ["core", "calves"], "act": "Quiet strength: calf and deep core making hundreds of tiny corrections — now without your eyes helping. Soft knee, tall spine, breathe."}]}, {"id": "upA", "date": "2026-10-13", "title": "Upper A — Block 2 · 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "Two heavy sets on the row, four clean sets on the press, and the elbow gets its one-set push-up test", "research": "Your elbow has been quiet for two full weeks — through the deload, and through last week's first heavy row at 72. That was the condition, so today the push-up comes back for one set, on the high bar, as a test. One set is enough to get an answer. On the press: you were right, that machine goes from 20 a side to 30, so there is no small step. Both chest presses have now ended the same way three times — ten, ten, then eight with nothing left. That last set is the problem. Pushing a set until nothing is left doesn't build more than stopping a rep or two short — across fifteen studies, strength and muscle gains came out the same either way (Grgic 2022) — and it costs you the set after it. So today is four sets of eight at the same weight, each with 2 left: 32 good reps instead of 28 with a grinder. The row moves from one heavy set to two; 72 for six had three left. The pulldown earned its ticket — three twelves — but the next plate is 55, a jump of more than a third. That test is saved for next week, so the elbow only answers one new question at a time. The other half of today is last night's dinner and this morning's pre-lift. Log both.", "warmup": "5 min: arm circles ×10 each way, band pull-aparts ×15, 10 slow wrist circles each way, 10 open-close fists, then one easy set on the Hammer Strength press at 10 a side for 10.", "ex": [{"name": "Hammer Strength MTS Chest Press — speed set", "sets": 2, "reps": "5 fast", "load": "10/side", "last": "10/side ×5 @4/4 RIR (10/6)", "rest": 60, "nogl": 1, "cue": "Two sets of five at 10 a side. Bring the handles back for 3 seconds, then press as fast as you can and stop just short of locking the elbows. You marked 4 left on these last week. If five fast reps at 10 a side really leave only four, write that in the comment — it's useful to know. If a fast rep bothers the right elbow, slow them down and tag it.", "mus": ["chest", "triceps"], "act": "Chest, firing fast. Shoulders down and back, blades pinned, then push like you're shoving a door open.", "subs": ["Machine Chest Press — speed set, 25×5"]}, {"name": "Hammer Strength MTS Chest Press", "sets": 4, "reps": "8", "load": "20/side (type 40)", "last": "20/side ×10/10/8 @2/1/0 RIR (10/6) · the machine jumps 20 → 30 a side", "rest": 120, "cue": "Same 20 a side — keep typing 40 in the weight box. New plan: four sets of eight, and every set stops with 2 left, even the last one. If set 4 would dip under 2 left, stop at 7 — that still counts. No set goes to zero today. Blades pinned, press both arms together, 2-minute rests. The elbow rule stands: a rep that hurts ends the set — tag HURT and write which rep.", "mus": ["chest", "triceps"], "act": "Chest. Hand flat on your chest — that muscle does the pressing. Shoulders down and back.", "subs": ["Machine Chest Press — 40×8, 4 sets"]}, {"name": "Seated Row", "sets": 3, "reps": "6, 6, then 10", "load": "72 → 60", "last": "72×6 @3 RIR, then 60×10 @3/3 (10/6) 🟢", "rest": 120, "cue": "Last week's first heavy set had 3 left — so now there are two of them. Sets 1 and 2: 72 for six, stopping with 2 left; if set 1 still has 3 left at six, take a seventh. Set 3: back to 60 for 10. Squeeze the blades to start every pull, elbows close, wrists straight, slow return. If the top of the right elbow talks at 72, finish at 60 and tag it.", "mus": ["lats", "upperback", "biceps"], "act": "Mid-back, between the shoulder blades. Start every pull by squeezing them together, then the arms follow."}, {"name": "Lat Pulldown", "sets": 3, "reps": "12", "load": "40 · neutral grip · slow return", "last": "40×12 @3/3/2 RIR, neutral grip (10/6) 🟢 — ticket earned", "rest": 90, "cue": "Three twelves with 2 or more left — you earned the next plate. It's 55, a big jump, and that test is next week so the elbow answers one new question at a time. This week the same 40 gets harder a different way: pull to the top of the chest, hold 1 second, then take 4 full seconds to let the bar back up. Twelve reps, neutral handle (palms facing each other). The slow return keeps the muscle working for the whole rep.", "mus": ["lats", "upperback", "biceps"], "act": "Mid-back, between the shoulder blades. Start every pull by squeezing them together, then the arms follow.", "subs": ["Assisted Pull-up — neutral grip, 3×8", "One-Arm DB Row — RIGHT ARM FIRST, 20×10"]}, {"name": "Seated DB Shoulder Press", "sets": 3, "reps": "10", "load": "12.5/db", "last": "12.5×10 @3/1/0 RIR (10/6) 🟢", "rest": 120, "cue": "Three tens last week — but the last set ended with nothing left. Same 12.5s, same ten, with 2 full minutes between sets. The win is finishing set 3 with 1 left. If rep 9 of the last set is a grind, stop at 9 — that's the right call. Back on the pad, bells at ear height, press up and slightly in. If the 12.5s are taken, the 10s for 15.", "mus": ["shoulders"], "act": "Top of the shoulders. Light weight, no swinging — if you have to swing, it's too heavy."}, {"name": "DB Lateral Raise — easy sets", "sets": 2, "reps": "12", "load": "5/db", "last": "5×12 @3 RIR, then 5×14 @1 (10/6)", "rest": 60, "cue": "Two sets of twelve with the 5s, and stop at twelve — these are the easy ones on purpose; Friday carries the hard sets. Slight elbow bend, raise to shoulder height like pouring two jugs, 3 seconds down.", "mus": ["shoulders"], "act": "Top of the shoulders. Light weight, no swinging — if you have to swing, it's too heavy."}, {"name": "Incline Push-up (35\" bar) — elbow test", "sets": 1, "reps": "6-8", "load": "BW · 35\" bar", "last": "24\" bar ×12 @2/2 RIR, HURT — \"definitely tweaking my elbow\" (9/21) · out since", "rest": 60, "nogl": 1, "cue": "One set, and it's a test: the answer matters more than the reps. High bar (35 inches). Hands just wider than the shoulders, body in one straight line, lower for 3 seconds until the chest nears the bar, press up. Six to eight reps, stopping with 3 or more left. Any feeling in the right elbow — even a small one — stop right there, tag HURT, and write which rep. Quiet elbow: tag SMOOTH and write 'quiet'. Either answer is a good one.", "mus": ["chest", "triceps", "shoulders"], "act": "Chest and the back of the arms. The body stays a plank — squeeze the butt and brace the belly."}, {"name": "Dead Bug", "sets": 2, "reps": "15/side", "load": "BW", "last": "2×15 with the 2s pause @2/2 RIR (10/6) 🟢", "rest": 45, "cue": "Two sets of 15 a side, and the pause at full reach is 3 seconds now. Low back gently into the floor, exhale on the reach. If the back arches, shorten the reach.", "mus": ["core"], "act": "Deep belly. Ribs down, low back gently pressed toward the floor. Breathe the whole time."}]}, {"id": "lowB", "date": "2026-10-15", "title": "Lower B — Block 2 · 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "Reps go up on the hinge, the press and the split squat, the bridge gets the 45, and the inner-thigh machine gets one careful test set", "research": "Every lift here ended with room to spare last week, so most of today moves by reps: ten on the RDL, twelve on the leg press, ten a leg on the split squat. For growing muscle, the rep number matters less than people think — lighter sets of 12 to 15 and heavier sets of 6 to 8 build about the same amount when each ends close to its limit (Schoenfeld 2017). What counts is hard sets and enough of them, and this day carries most of yours: nineteen for the glutes and thighs. The bridge gets the 45 the card promised — four sets with 2 or more left earned it. The RDL has gone four sessions with no back note, which is why it keeps moving. Your left groin has been quiet since September 24th — three weeks. So the inner-thigh machine comes back for one set at the lightest weight, with the pads one notch narrower so the legs start from less of a stretch. If it feels weird again, that's a clear answer and the floor version stays the plan; you wrote 'definitely harder' about that one last week, which means it is doing its job. You did this session a day early last week, the third lifting day in a row, and it was still clean. If the week gets moved around again, that's fine — tell the note box.", "warmup": "5 min: brisk walk in, glute bridges ×12, hip hinge drill with a dowel ×10 (stick touches head, upper back, tailbone), bodyweight squats ×10, 10 slow side-to-side leg swings each leg with a hand on the rack.", "ex": [{"name": "Sit-to-Stand — speed set", "sets": 2, "reps": "5 fast", "load": "BW", "last": "BW ×5 @6+/6+ RIR (10/7)", "rest": 60, "nogl": 1, "cue": "A bench or box about knee height, arms crossed on your chest. Stand up as fast as you can, then take 3 seconds to sit back down. Five reps, two sets. Pick 6+ for reps left. If the right knee complains, use a higher seat.", "mus": ["quads", "glutes"], "act": "Thighs and butt, firing fast. Lean forward a little, then drive the floor away."}, {"name": "DB RDL — form checklist", "sets": 3, "reps": "10", "load": "20/db", "last": "20×8 @4/3 RIR (10/7) — no back note", "rest": 90, "cue": "The 20s again, ten reps now — reps before weight on this lift. Same checklist every set: (1) butt back, not down; (2) soft knees; (3) bells slide down the thighs; (4) stop when the hamstrings stretch; (5) squeeze glutes to stand. Three tens with 2 left and no back note, and the 22.5s are next. If the back talks, back to eight reps — right call, not a fail. Check off set 3: it was left open on three lifts last week, and the green light needs every set.", "mus": ["hamstrings", "glutes"], "act": "Back of the thighs. Feel them stretch as you hinge, then squeeze them to stand. If your lower back talks, the hamstrings aren't doing their job yet — lighten and go slower."}, {"name": "Leg Press — feet high and wide", "sets": 3, "reps": "12", "load": "120", "last": "120×10 @3/3 RIR, high and wide (10/7)", "rest": 120, "cue": "Same 120, same high-and-wide feet, twelve reps now. One hand-width higher and one hand-width wider than Monday, toes turned out a little; lower a touch past 90° as long as your tailbone stays down on the pad. Stop with 2 left. Three twelves and this goes to 130. If the left groin talks, feet go back to Monday's position and you tag it.", "mus": ["glutes", "quads"], "act": "The butt and the inner thighs. Push through the heels and feel the stretch at the bottom."}, {"name": "Split Squat — RIGHT LEG FIRST — knee watch", "sets": 3, "reps": "10/leg", "load": "10 · one bell at your side", "last": "10 at the side ×8 @4/3/2 RIR (10/7) 🟢 — no elbow note", "rest": 120, "cue": "The bell at your side worked — no elbow note. Same 10, ten a leg now. The bell hangs in the hand opposite the front leg, arm straight; other hand free near the rack. Right first. Front shin vertical, knee over the second toe. Take the full rest — that's what fixed the knee. Three tens with 2 left and the bell becomes a 12.5.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away.", "subs": ["Reverse Lunge — RIGHT LEG FIRST, BW ×10", "Step-Up — RIGHT LEG FIRST, BW ×10"]}, {"name": "Glute Bridge — feet on floor", "sets": 4, "reps": "10-12", "load": "45 plate", "last": "35×12 @3/3/3/2 RIR (10/7) 🟢", "rest": 75, "cue": "The 45 you earned. Getting it in place: sit on the floor with your legs out, stand the plate on its edge beside your hip, tip it onto your lap, then lie back and hold it with both hands. Don't pick it up off the floor with one bent arm. Ten to twelve reps, four sets, 2-second squeeze at the top, ribs down. Stop with 2 left — ten is a fine first day. If the 45 is awkward to get into place, 35 for 15 is the same step.", "mus": ["glutes", "hamstrings"], "act": "The butt. Squeeze it hard at the top of every rep — if you feel it in your lower back instead, don't lift as high."}, {"name": "Outer Thigh (machine)", "sets": 3, "reps": "12-15", "load": "25 — one pin up", "last": "20×15 @4/3/3 RIR (10/7) 🟢", "rest": 60, "cue": "One pin heavier than 20 — it should read 25. If this stack jumps further, take the next pin and write the number in the comment. Twelve to fifteen reps. Sit tall, press the knees out smoothly, 1-second hold at the widest point, 3 seconds back in. Don't let the stack slam.", "mus": ["glutes"], "act": "Side of the hip — the muscle that keeps your knee from falling inward. If you feel it in the front of the hip, sit taller.", "subs": ["Side-Lying Leg Raise — RIGHT SIDE FIRST, 15 a side with a 5-lb plate on the thigh", "Banded Lateral Walk — 15 steps each way ×3"]}, {"name": "Side-Lying Inner-Thigh Raise — RIGHT SIDE FIRST", "sets": 2, "reps": "15/side", "load": "BW", "last": "BW ×15 with a 2s hold @3/3/3 RIR (10/7) 🟢 — \"definitely harder\"", "rest": 45, "cue": "Two sets now — the third became the machine test below. Fifteen a side, and hold the top for 3 seconds this time. Lie on your right side, top foot planted in front of you, bottom leg straight; lift it 6–8 inches, hold 3, lower for 3. Right side first. Any groin twinge: stop, tag HURT, note it — and skip the machine test.", "mus": ["glutes"], "act": "Inner thigh — the long muscle from the groin down the inside of the thigh. Small range, slow. If you feel it in the groin crease rather than the thigh, lower the leg less.", "subs": ["Sumo Squat — BW ×12, toes out"]}, {"name": "Inner Thigh (machine) — test set", "sets": 1, "reps": "10", "load": "15 · pads one notch narrower", "last": "15×15 — \"feels weird in my left groin\" (9/24) · out for three weeks", "rest": 60, "nogl": 1, "cue": "One set, and it's a test. Lightest weight (15). Set the pads one notch narrower than you used to, so the legs start less far apart. Ten slow reps: 3 seconds squeezing in, 3 seconds back out, and don't let the pads pull your legs wider than where you started. Quiet groin: tag SMOOTH and write 'quiet' — the machine comes back next week. Anything weird in the left groin, even small: stop on that rep, tag HURT, and write which rep. Then it stays out and the floor version carries on.", "mus": ["glutes"], "act": "Inner thigh — the long muscle from the groin down the inside of the thigh. You should feel it in the thigh, not in the crease of the groin."}]}, {"id": "upB", "date": "2026-10-16", "title": "Upper B — Block 2 · 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "The 25 on the row, a new way up on the chest press, and the arm work you were promised — if Tuesday's elbow test was quiet", "research": "Last week's retest passed: three tens at 22.5 on the row, where two weeks earlier the third set stopped at eight. So the 25 is yours. The chest press is the one lift that hasn't moved — ten, ten, eight with nothing left, three sessions running. Tuesday changed how it's done on the other machine; today it changes here too: one more rep on the first set, where you've had 2 left every time, and the other two sets stop with 1 left instead of running to empty. Arms: the card said curls and pushdowns join when the elbow stayed quiet under a heavier row. It did. Rows already work the biceps, but a curl works it harder — when one arm did only rows and the other did only curls for eight weeks, the curl arm's biceps grew about twice as much (Mannarino 2021; the lifters were young men new to training). Both start light on purpose. This week the elbow is the test, not the biceps. One rule: if the elbow said anything during or after Tuesday's push-up test, skip both arm lifts today and write that in the note. Fuel is still the open question. The log has shown no dinner on any day for two weeks, and nothing at all last Wednesday or Thursday. If today feels flat, that is the first place to look. Tomorrow: scale numbers on waking — they were missed last Saturday — then the walk, then Export.", "warmup": "5 min: arm circles, band pull-aparts ×15, 10 slow wrist circles each way, 10 open-close fists, one easy set of chest press at 10 for 10.", "ex": [{"name": "Machine Chest Press — speed set", "sets": 2, "reps": "5 fast", "load": "25", "last": "25×5 @3/2 RIR (10/8)", "rest": 60, "nogl": 1, "cue": "Two sets of five at 25. Let the handles come back for 3 seconds, then press as fast as you can, stopping just short of locking the elbows. You marked 3 and 2 left on these last week — five reps at 25 should leave six or more when 40 goes for ten. If it really doesn't, write that in the comment; it tells Chancey something. If fast reps feel wrong on the elbow, slow them down and tag it.", "mus": ["chest", "triceps"], "act": "Chest, firing fast. Shoulders down and back, blades pinned, then push like you're shoving a door open."}, {"name": "Machine Chest Press", "sets": 3, "reps": "10-12", "load": "40", "last": "40×10/10/8 @2/2/0 RIR (10/8) 🟢", "rest": 120, "cue": "Same 40, new rule. Set 1: go for 11 or 12 — you've had 2 left at ten every time. Sets 2 and 3: stop with 1 left, whatever the number is, even if it's 8. No set runs to empty. The stack jumps 40 to 55, so the road is still three twelves — this is how the reps start moving again. Blades pinned, smooth press, 2-minute rests. A rep that hurts the elbow ends the set — tag HURT and write which rep.", "mus": ["chest", "triceps"], "act": "Chest. Hand flat on your chest — that muscle does the pressing. Shoulders down and back.", "subs": ["Hammer Strength MTS Chest Press — 20/side ×8, 4 sets"]}, {"name": "One-Arm DB Row — RIGHT ARM FIRST", "sets": 3, "reps": "8/arm", "load": "25/db", "last": "22.5×10/10/10 @3/1 RIR (10/8) 🟢", "rest": 120, "cue": "Three tens at 22.5 — done. Now the 25 for eight each arm, stopping with 2 left. Knee and hand on the bench, flat back, pull to the hip, squeeze the blade, slow down. Right first. Elbow close to your side, wrist straight. If the 25 pulls your shoulder forward or rounds your back, it's 22.5 for 12 instead. Start the rest clock after the left arm finishes. Check off set 3 — it was left open last week.", "mus": ["lats", "upperback", "biceps"], "act": "Mid-back, between the shoulder blades. Start every pull by squeezing them together, then the arms follow.", "subs": ["One-Arm DB Row — RIGHT ARM FIRST, 22.5×12"]}, {"name": "Face Pull (rope)", "sets": 3, "reps": "15", "load": "17.5", "last": "17.5×15/14/13 @2/1/1 RIR (10/8) 🟢", "rest": 60, "cue": "Same 17.5, finishing the job: fifteen on all three sets. Last week went 15, 14, 13. Rope at face height, thumbs pointing back, pull straight at your nose, hands finish beside your ears, elbows wide, 1s squeeze. The next step on this stack is 22.5, so three fifteens with 2 left comes first. Leave the rope and the pin where they are when you finish — the next lift uses both.", "mus": ["upperback", "shoulders"], "act": "Back of the shoulders and between the blades. Elbows lead, hands follow. This is the posture muscle."}, {"name": "Rope Triceps Pushdown — new, light", "sets": 2, "reps": "12", "load": "17.5", "last": "New — arm work joins this week", "rest": 60, "nogl": 1, "cue": "New this week, and light on purpose. Same rope, same 17.5 — slide the pulley to the top if it adjusts. Stand tall, elbows pinned to your sides, and push the rope down until your arms are straight, spreading the ends apart at the bottom. 3 seconds back up; the elbows don't leave your ribs. Twelve reps, two sets, 3 or more left. If 17.5 leaves fewer than 3, drop to 12.5. Any feeling in the right elbow: stop, tag HURT, write which rep.", "mus": ["triceps"], "act": "Back of the upper arm. Only the forearms move — the elbows are hinges bolted to your sides."}, {"name": "DB Lateral Raise", "sets": 3, "reps": "8, 8, then 12", "load": "7.5 → 5/db", "last": "7.5×9 @1 RIR, then 5×12 @2/1 (10/8)", "rest": 60, "cue": "The 7.5s take two sets now, a different way: eight reps and stop, on both sets, even if there's more in there. One hard set at 7.5 kept ending with 1 left; two sets that stop early is the better road to owning that weight. Set 3: the 5s for 12, 3 seconds down. No swinging on any of them.", "mus": ["shoulders"], "act": "Top of the shoulders. Light weight, no swinging — if you have to swing, it's too heavy."}, {"name": "DB Curl — new, light", "sets": 2, "reps": "12", "load": "7.5/db", "last": "New — arm work joins this week", "rest": 60, "nogl": 1, "cue": "New this week, and light on purpose. Stand tall with the 7.5s, palms facing forward, elbows at your sides. Curl both up without the elbows drifting forward, squeeze 1 second, lower for 3. Twelve reps, two sets, 3 or more left — it should feel easy. If it's very easy, say so in the comment and the 10s are next week. Any feeling in the right elbow: stop, tag HURT, write which rep.", "mus": ["biceps"], "act": "Front of the upper arm. Put a hand on it between sets — that's the one working. No swinging, no leaning back."}, {"name": "Plank + Side Plank", "sets": 2, "reps": "50s + 30s/side", "load": "BW", "last": "45s front + 25s a side, both rounds (10/8)", "rest": 45, "cue": "Two rounds. Front plank 50 seconds — five more than last week — then 30 a side. Elbows under shoulders, glutes tight, hips level; on your hands if the forearm version bothers the elbow. Type your front-plank seconds in the reps box.", "mus": ["core"], "act": "Deep belly. Ribs down, low back gently pressed toward the floor. Breathe the whole time."}]}, {"id": "walk1", "date": "2026-10-17", "title": "Scale Check + Beach Walk or Yoga", "time": "Morning", "kind": "act", "badge": "Mobility", "why": "Four numbers off the scale, one tape, an easy walk. Then Export", "research": "This check was missed last Saturday, so today is the first Block 2 entry on the scoreboard. The scoreboard is body fat and lean mass, not scale weight. Same conditions every time: on waking, after the bathroom, before food or water. Type weight, body fat %, skeletal muscle % and muscle mass into the note below. One tape — shoulders: all the way around both shoulders at the widest point, arms down. The last shoulder number came through as 25, which can't be a full lap around. Then 30 minutes easy on the beach or a yoga class, and Export the week and paste it to Chancey.", "desc": "Scale numbers first (see above), then the shoulder tape, then a 30-min beach walk or a yoga class. Export the whole week after.", "distLabel": "Distance (mi)", "notePh": "BW __ · BF __% · SM __% · MM __ | Shoulders, all the way around __ in"}], "tags": [{"l": "STRONG"}, {"l": "SMOOTH"}, {"l": "SORE", "cls": "sore"}, {"l": "HURT", "cls": "hurt"}, {"l": "PAIN", "cls": "pain"}], "restDate": "2026-10-18", "fuel": {"on": true, "phase": "Phase 1 · Recomp", "ffm": 43.0, "bmr": 1298, "prot": 120, "protMeal": 30, "protDay": 110, "kcal": {"lift": 2000, "rest": 1800}, "carbs": {"lift": 245, "rest": 195}, "fatMin": 50, "burn": {"lift": 220, "act": 150}, "ea": {"red": 30, "green": 40}, "creatine": 5, "slots": [{"id": "pre", "l": "Pre-lift", "when": "5:50–6:15 AM", "p": "15–25 g", "c": "25–35 g", "cue": "Liquid is fine and fast: a banana and a scoop of whey in water, 30–45 minutes before the first set. Can't face food that early? The shake alone still counts."}, {"id": "post", "l": "Post-lift", "when": "within 45 min of the last set", "p": "35 g", "c": "50–60 g", "cue": "Inside 45 minutes of the last set — the app checks the clock. Eggs + toast + fruit; oats + whey + berries; a Greek yogurt bowl with granola. Creatine goes in this meal."}, {"id": "mid", "l": "Midday", "when": "12–1 PM", "p": "30 g", "c": "", "cue": "A palm of protein, a fist of carbs, a vegetable. Same shape every day."}, {"id": "snk", "l": "Afternoon", "when": "3:30–4:30 PM", "p": "15–25 g", "c": "", "cue": "Cottage cheese, jerky, string cheese and fruit, a shake. This is what stops dinner from being a rescue mission."}, {"id": "din", "l": "Dinner", "when": "6:30–7 PM", "p": "30 g", "c": "", "cue": "Protein, carbs, vegetables, some fat. Same plate, every night. This is the week's one ask: log it, even as a rough guess. No dinner has been entered in two weeks, so every day reads as about 600 calories."}, {"id": "bed", "l": "Pre-sleep", "when": "9–9:30 PM", "p": "25–30 g", "c": "", "cue": "Slow protein 30–60 minutes before bed: cottage cheese, Greek yogurt, or a casein shake. This is tomorrow's 6:45 breakfast. Lights o /* ---------- storage (safe) ---------- */
let MEM = {}; let CANSTORE = true;
function load(){ try{ const s = localStorage.getItem(CFG.key); return s?JSON.parse(s):{}; }
  catch(e){ CANSTORE=false; return MEM; } }
function save(){ try{ localStorage.setItem(CFG.key, JSON.stringify(S)); }
  catch(e){ CANSTORE=false; MEM = S; } }
let S = load();
S.r = S.r||{}; S.x = S.x||{}; S.act = S.act||{}; S.gl = S.gl||{}; S.added = S.added||{}; S.f = S.f||{}; S.stp = S.stp||[];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isoOf(ms){ const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return isoOf(Date.now()); }
function addDays(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoOf(d.getTime()); }
function dayName(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}); }
function mday(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'}); }
function doy(){ const d=new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0))/864e5); }
function minRep(r){ const m = String(r).match(/\d+/); return m?parseInt(m[0]):1; }
function num(v){ const n=parseFloat(v); return isFinite(n)?n:0; }
function fmtK(n){ return Math.round(n).toLocaleString('en-US'); }

const DATES = [...new Set(CFG.sessions.map(s=>s.date))].sort();
const WEEK = (function(){ const a=[]; let d=DATES[0]; const end=CFG.restDate||DATES[DATES.length-1]; while(d<=end && a.length<8){ a.push(d); d=addDays(d,1); } return a; })();
let CUR = WEEK.includes(todayISO()) ? todayISO() : WEEK[0];
let VIEW = 'week';
const FUEL = CFG.fuel || {on:false};
const EM = {grn:'🟢', yel:'🟡', red:'🔴'};

/* ---------- session status ---------- */
function sesStatus(s){
  const k = s.date + '|' + s.id;
  if(s.kind !== 'lift'){
    const a = S.act[k];
    return (a && a.done) ? {txt:'✓ done', cls:'done'} : {txt:'—', cls:''};
  }
  const x = S.x[k]; if(!x) return {txt:'—', cls:''};
  const total = s.ex.length;
  let n = 0;
  s.ex.forEach((e,i)=>{ const st=x[i]; if(st && st.sets && st.sets.some(t=>t&&t.t)) n++; });
  if(n===0) return {txt:'—', cls:''};
  return n>=total ? {txt:'✓ done', cls:'done'} : {txt:n+'/'+total+' lifts', cls:'part'};
}

/* ---------- render ---------- */
function render(){ VIEW==='week' ? renderWeek() : renderDay(); }
function goWeek(){ VIEW='week'; render(); window.scrollTo(0,0); }
function setDay(d){ CUR = d; VIEW='day'; render(); window.scrollTo(0,0); }

function renderWeek(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><div class="sys">C&amp;C Health OS</div></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari.</div>`;
  const all = CFG.sessions.length;
  const done = CFG.sessions.filter(s=>sesStatus(s).cls==='done').length;
  h += `<div class="card"><div class="eyebrow">${esc(CFG.weekLabel||'This week')}</div>
    <div style="font-size:14px">${done} of ${all} sessions complete</div>
    <div class="prog"><i style="width:${all?Math.round(done/all*100):0}%"></i></div></div>`;
  WEEK.forEach(d=>{
    const today = d===todayISO();
    const ss = CFG.sessions.filter(s=>s.date===d);
    h += `<div class="wk ${today?'today':''}" onclick="setDay('${d}')">
      <div class="wkh"><div class="wkd">${dayName(d)}${today?' · today':''}</div><div class="wkdate">${mday(d)}</div></div>`;
    if(ss.length){
      ss.forEach(s=>{
        const st = sesStatus(s);
        h += `<div class="wks"><div><span class="dot ${(s.badge||'').replace(' ','')}"></span><span class="t">${esc(s.title)}</span>
          <div class="sub2" style="margin-left:15px">${esc(s.time||'')}</div></div>
          <div class="st ${st.cls}">${st.txt}</div></div>`;
      });
    } else {
      h += `<div class="wks"><div><span class="dot"></span><span class="t" style="color:var(--dim)">${d===CFG.restDate?'Full rest — export Saturday, reset today':'Rest day — the fuel still counts'}</span></div></div>`;
    }
    if(FUEL.on) h += fuelLine(d);
    h += `</div>`;
  });
  if(FUEL.on) h += fuelReport();
  h += `<div class="card"><div class="eyebrow">Week close-out</div>
    <div class="small" style="margin-bottom:9px"><b>The ritual:</b> Saturday after the walk → Export week, paste to Claude. Sunday → Reset (lifts only — check-ins, fuel and staples are kept). Monday's file arrives reprogrammed.</div>
    <div class="row"><button class="btn acc" onclick="exportData()">Export week &amp; copy</button>
    <button class="btn" onclick="shareData()">Share…</button>
    <button class="btn ghost" onclick="resetWeek()">Reset week</button></div></div>`;
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

function renderDay(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><button class="home" onclick="goWeek()">‹ Week</button></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari. It works offline and remembers everything.</div>`;
  h += `<div class="chips">` + WEEK.map(d=>
    `<button class="chip ${d===CUR?'on':''}" onclick="setDay('${d}')">${dayName(d)} ${mday(d)}</button>`).join('') + `</div>`;
  h += readinessCard();
  h += lowBanner();
  if(FUEL.on) h += fuelCard();
  const todays = CFG.sessions.filter(s=>s.date===CUR);
  if(!todays.length) h += restCard();
  todays.forEach(s=>{ h += missionCard(s); h += (s.kind==='lift') ? liftCard(s) : actCard(s); });
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

/* ---------- exercise state ---------- */
function xkey(sid){ return CUR + '|' + sid; }
function exState(sid, i){
  const k = xkey(sid); S.x[k] = S.x[k]||{};
  S.x[k][i] = S.x[k][i]||{sets:[],c:'',tags:[],sub:''};
  return S.x[k][i];
}

/* ---------- readiness ---------- */
function rget(){ S.r[CUR] = S.r[CUR]||{}; return S.r[CUR]; }
function rset(f,v){ rget()[f]=v; save(); render(); }
function rateRow(f,label){
  const v = rget()[f];
  return `<div class="lbl">${label}</div><div class="rd">` +
    [1,2,3,4,5].map(n=>`<button class="rb ${v===n?'on':''}" onclick="rset('${f}',${n})">${n}</button>`).join('') + `</div>`;
}
function readinessCard(){
  const r = rget();
  let inner = rateRow('e','Energy') + rateRow('so','Soreness (5 = very sore)') + rateRow('sl','Sleep quality') + rateRow('m','Mood');
  inner += `<div class="grid2" style="margin-top:10px">
    <div><div class="lbl">Bodyweight (lbs)</div><input inputmode="decimal" value="${esc(r.bw||'')}" onchange="rset('bw',this.value)"></div>
    <div><div class="lbl">Sleep (hrs)</div><input inputmode="decimal" value="${esc(r.slh||'')}" onchange="rset('slh',this.value)"></div></div>`;
  if(CFG.whoop){
    inner += `<h3 class="sect">Whoop</h3><div class="grid2">
      <div><div class="lbl">Recovery %</div><input inputmode="numeric" value="${esc(r.rec||'')}" onchange="rset('rec',this.value)"></div>
      <div><div class="lbl">HRV (ms)</div><input inputmode="numeric" value="${esc(r.hrv||'')}" onchange="rset('hrv',this.value)"></div>
      <div><div class="lbl">Resting HR</div><input inputmode="numeric" value="${esc(r.rhr||'')}" onchange="rset('rhr',this.value)"></div>
      <div><div class="lbl">Strain</div><input inputmode="decimal" value="${esc(r.strain||'')}" onchange="rset('strain',this.value)"></div></div>`;
  }
  const filled = ['e','so','sl','m'].filter(f=>r[f]).length;
  return `<details ${filled<4?'open':''}><summary>Daily check-in ${filled===4?'✓':'('+filled+'/4)'}</summary>
    <div class="card">${inner}</div></details>`;
}
function lowBanner(){
  const r = rget();
  const vals = ['e','sl','m'].map(f=>r[f]).filter(Boolean);
  const avg = vals.length===3 ? (vals.reduce((a,b)=>a+b,0) + (r.so?(6-r.so):0)) / (r.so?4:3) : null;
  const whoopLow = CFG.whoop && r.rec && Number(r.rec) < 34;
  if((avg!==null && avg <= 2.5) || whoopLow){
    let fl = '';
    if(FUEL.on){
      const y = addDays(CUR,-1); const fc = fuelCalc(y);
      if(fc.logged) fl = ` <b>Yesterday's fuel:</b> P ${fc.P} g · ${fmtK(fc.K)} kcal · EA ${fc.ea.toFixed(0)} ${EM[fc.band]||''}${fc.band==='grn'?'.':' — that is the likeliest cause.'}`;
      else fl = ` Yesterday's fuel wasn't logged — with September's numbers, an empty tank is the first suspect.`;
    }
    return `<div class="adjust"><b>Readiness is low today.</b> Option, not an order: keep planned loads, drop the last set of each exercise, and bank recovery. Research: acute readiness-based volume cuts protect long-term progress (autoregulation, Helms 2018). Your call — you set the limits.${fl}</div>`;
  }
  return '';
}

/* ---------- lift sessions ---------- */
function allEx(s){
  const extra = (S.added[xkey(s.id)]||[]).map(n=>({name:n, sets:3, reps:'8-12', load:'—', rest:90, subs:[], added:true}));
  return s.ex.concat(extra);
}

  allEx(s).forEach((ex,i)=>{ h += exCard(s,ex,i); });

  h += `<div class="card"><div class="lbl">Session note — how did it go?</div>
    <textarea onchange="snote('${s.id}',this.value)">${esc((S.x[xkey(s.id)]||{}).note||'')}</textarea></div>`;
  return h;
}
function snote(sid,v){ const k=xkey(sid); S.x[k]=S.x[k]||{}; S.x[k].note=v; save(); }

function exCard(s,ex,i){
  const st = exState(s.id,i);
  const planned = ex.sets;
  const nsets = Math.max(planned, st.sets.length + (st.sets.length>=planned?1:0));
  let rows = '';
  for(let si=0; si<nsets; si++){
    const set = st.sets[si]||{};
    rows += `<div class="setrow"><div class="n">${si+1}</div>
      <input placeholder="lbs" inputmode="decimal" id="w_${s.id}_${i}_${si}" value="${esc(set.w||'')}" onchange="setField('${s.id}',${i},${si},'w',this.value)">
      <input placeholder="reps" inputmode="numeric" id="r_${s.id}_${i}_${si}" value="${esc(set.r||'')}" onchange="setField('${s.id}',${i},${si},'r',this.value)">

        <option ${set.rir==='6+'?'selected':''}>6+</option></select>
      <button class="ck ${set.t?'done':''}" onclick="ckSet('${s.id}',${i},${si},${ex.rest||90})">✓</button></div>`;
  }
  const glOn = !ex.nogl && S.gl[ex.name];
  const subsOpen = st.showSubs;
  return `<div class="exc">

      <div class="exname">${esc(ex.name)}${st.sub?` <span class="sub">→ ${esc(st.sub)}</span>`:''}${ex.added?' <span class="sub">(added)</span>':''}</div>
      <div class="target">${ex.sets}×${esc(ex.reps)} @ ${esc(ex.load)} · rest ${fmtRest(ex.rest||90)}</div>
      ${ex.last?`<div class="last">Last: ${esc(ex.last)}</div>`:''}
    </div></div>
    ${ex.cue?`<div class="cue">Coach: ${esc(ex.cue)}</div>`:''}
    ${rows}
    ${glOn?`<div class="gl">🟢 Green light — add load or a rep next time</div>`:''}
    <div class="tags">
      ${CFG.tags.map(t=>`<button class="tg ${t.cls||''} ${(st.tags||[]).includes(t.l)?'on':''}" onclick="tagEx('${s.id}',${i},'${t.l}')">${t.l}</button>`).join('')}
    </div>
    <div class="row">
      ${ex.subs&&ex.subs.length?`<button class="btn" onclick="toggleSubs('${s.id}',${i})">${st.sub?'Change / undo swap':'Machine taken?'}</button>`:''}

      <button class="btn ghost" onclick="addSetNow('${s.id}',${i})">＋ Set</button>
    </div>

    ${subsOpen?`<div class="subs"><div class="lbl" style="margin-top:0">Same muscle, do instead:</div>
      ${st.sub?`<div class="so" style="color:var(--good)" onclick="useSub('${s.id}',${i},'')">↩ Back to original: ${esc(ex.name)}</div>`:''}
      ${ex.subs.map(o=>`<div class="so" onclick="useSub('${s.id}',${i},'${esc(o).replace(/'/g,"\\'")}')">→ ${esc(o)}</div>`).join('')}</div>`:''}
    <div class="lbl">Comment</div>
    <textarea onchange="cmt('${s.id}',${i},this.value)">${esc(st.c||'')}</textarea>
  </div>`;
}
function fmtRest(s){ return s>=120 ? (s/60)+' min' : s+'s'; }
function setField(sid,i,si,f,v){ const st=exState(sid,i); st.sets[si]=st.sets[si]||{}; st.sets[si][f]=v; save(); }
function ckSet(sid,i,si,rest){
  const st = exState(sid,i);
  const w = $('w_'+sid+'_'+i+'_'+si).value, r = $('r_'+sid+'_'+i+'_'+si).value, rir = $('rir_'+sid+'_'+i+'_'+si).value;
  const cur = st.sets[si]||{};
  if(cur.t){ st.sets[si] = {w, r, rir}; save(); render(); stopTimer(); return; }
  const now = Date.now();
  const prev = st.sets[si-1];
  st.sets[si] = {w, r, rir, t: now, rest: prev&&prev.t ? Math.round((now-prev.t)/1000) : null};

function fget(d){ S.f[d] = S.f[d]||{}; return S.f[d]; }
function fslot(d,id){ const f=fget(d); f[id]=f[id]||{p:'',k:'',c:'',t:'',it:[]}; return f[id]; }
function tms(d,t){ if(!t) return null; const x=new Date(d+'T'+t+':00').getTime(); return isFinite(x)?x:null; }
function hm12(t){ if(!t) return ''; const p=t.split(':'); let h=parseInt(p[0]); const m=p[1]; const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return h+':'+m+' '+ap; }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function setsOn(d){
  let first=null,last=null;
  Object.keys(S.x).forEach(k=>{ const x=S.x[k]; if(!x) return; Object.keys(x).forEach(i=>{ if(i==='note') return; const st=x[i]; if(!st||!st.sets) return;
    st.sets.forEach(t=>{ if(t&&t.t&&isoOf(t.t)===d){ if(first===null||t.t<first) first=t.t; if(last===null||t.t>last) last=t.t; } }); }); });
  const f = S.f[d];
  if(first){ if(f) f.so={first,last}; else S.f[d]={so:{first,last}}; return {first,last}; }
  if(f&&f.so&&f.so.first) return {first:f.so.first,last:f.so.last};
  return {first:null,last:null};
}
function dayKind(d){
  if(setsOn(d).first) return 'lift';
  if(CFG.sessions.some(s=>s.kind==='lift'&&s.date===d) && d>=todayISO()) return 'lift';
  return 'rest';
}
function actDone(d){ return CFG.sessions.some(s=>s.kind!=='lift'&&s.date===d&&(S.act[d+'|'+s.id]||{}).done); }
function fuelCalc(d){
  const f=S.f[d]||{}; const kind=dayKind(d); const so=setsOn(d);
  let P=0,K=0,C=0,n30=0,logged=false;
  FUEL.slots.concat([{id:'x'}]).forEach(sl=>{ const s=f[sl.id]; if(!s) return; const p=num(s.p),k=num(s.k),c=num(s.c);
    if(p||k||c) logged=true; P+=p; K+=k; C+=c; if(p>=FUEL.protMeal) n30++; });
  const burn = so.first ? FUEL.burn.lift : (kind==='lift' ? FUEL.burn.lift : (actDone(d)?FUEL.burn.act:0));
  const tgtK = kind==='lift'?FUEL.kcal.lift:FUEL.kcal.rest;
  const tgtC = kind==='lift'?FUEL.carbs.lift:FUEL.carbs.rest;
  const ea = logged ? (K-burn)/FUEL.ffm : null;
  const band = ea===null ? '' : (ea<FUEL.ea.red?'red':(ea<FUEL.ea.green?'yel':'grn'));
  const pre=f.pre||{}, post=f.post||{}, bed=f.bed||{};
  let preOk=null, preMin=null, postOk=null, postMin=null;
  if(kind==='lift'){
    const pt=tms(d,pre.t), qt=tms(d,post.t);
    if(so.first&&pt){ preMin=Math.round((so.first-pt)/60000); preOk=(preMin>=0&&preMin<=150); }
    if(so.last&&qt){ postMin=Math.round((qt-so.last)/60000); postOk=(postMin>=-5&&postMin<=45); }
  }
  const bedOk = num(bed.p)>=20;
  let st='';
  if(logged){ st = (P>=FUEL.prot && band==='grn') ? 'grn' : ((P>=FUEL.prot*0.8 && band!=='red') ? 'yel' : 'red'); }
  return {kind,P,K,C,n30,burn,tgtK,tgtC,ea,band,preOk,preMin,postOk,postMin,bedOk,logged,st,so,cr:!!f.cr,pre,post};
}
function eaText(c,today){
  if(c.ea===null) return `<b>Energy availability</b> shows once a feeding is logged. Under ${FUEL.ea.red} is the low-fuel line; ${FUEL.ea.green}+ is green. (intake − session burn) ÷ ${FUEL.ffm} kg lean mass.`;
  const calc = `<span style="color:var(--dim)">(${fmtK(c.K)} − ${c.burn} burn) ÷ ${FUEL.ffm} kg lean</span>`;
  if(today && c.band!=='grn'){
    const need = Math.ceil(FUEL.ea.green*FUEL.ffm + c.burn - c.K);
    return `<b>Energy availability so far ${c.ea.toFixed(0)}</b> — about <b>${fmtK(need)} kcal</b> more gets you to ${FUEL.ea.green} 🟢 by bedtime. ${calc}`;
  }
  const msg = {red:`under ${FUEL.ea.red} — the low-fuel line. Eat.`, yel:`${FUEL.ea.red}–${FUEL.ea.green-1} — better, not there. Carbs around the lift.`, grn:`${FUEL.ea.green}+ — fueled.`}[c.band];
  return `<b>Energy availability ${c.ea.toFixed(0)}</b> ${EM[c.band]} — ${msg} ${calc}`;
}
function timingText(c){
  const bed = c.bedOk ? '<b>✓</b>' : '—';
  if(c.kind!=='lift') return `Rest day · Pre-sleep protein ${bed}`;
  let pre, post;
  if(c.preOk===true) pre = `<b>✓ ${hm12(c.pre.t)}</b> (${c.preMin} min before the first set)`;
  else if(c.preOk===false) pre = `<b>✗</b> ${hm12(c.pre.t)} — ${c.preMin<0?'after the first set':'more than 2.5 h before'}`;
  else if(c.pre.t) pre = `⏱ ${hm12(c.pre.t)} — lift not logged yet`;
  else pre = c.so.first ? '<b>✗</b> none logged' : '—';
  if(c.postOk===true) post = `<b>✓ ${hm12(c.post.t)}</b> (${c.postMin} min after the last set)`;
  else if(c.postOk===false) post = `<b>⚠</b> ${hm12(c.post.t)} — ${c.postMin} min after the last set`;
  else if(c.post.t) post = `⏱ ${hm12(c.post.t)} — lift not logged yet`;
  else if(c.so.last){ const late=Math.round((Date.now()-c.so.last)/60000); post = late>45 ? `<b>✗</b> not logged — ${late} min since the last set` : `<b>window open</b> — ${45-late} min left`; }
  else post = '—';
  return `Pre-lift ${pre}<br>Post-lift ${post}<br>Pre-sleep protein ${bed}`;
}

  const eaB = s.EA===null?'':(s.EA<FUEL.ea.red?'red':(s.EA<FUEL.ea.green?'yel':'grn'));
  return `<div class="card fuel"><div class="eyebrow">Fuel report · this week</div><div class="frep">
    <span class="k">Protein</span><span>avg <b>${s.P===null?'—':Math.round(s.P)+' g'}</b> · <b>${s.pDays}/${s.n}</b> days ≥ ${FUEL.protDay} · <b>${s.n30===null?'—':s.n30.toFixed(1)}</b> feedings ≥ ${FUEL.protMeal}/day</span>
    <span class="k">Energy</span><span>avg <b>${s.K===null?'—':fmtK(s.K)+' kcal'}</b> · EA avg <b>${s.EA===null?'—':s.EA.toFixed(0)}</b> ${EM[eaB]||''}</span>
    <span class="k">Timing</span><span>pre-lift <b>${s.pre}/${s.lifts}</b> · post-lift <b>${s.post}/${s.lifts}</b> · pre-sleep <b>${s.bed}/${s.n}</b></span>
    <span class="k">Creatine</span><span><b>${s.cr}/7</b> · BW <b>${s.bw0===null?'—':s.bw0+' → '+s.bw1}</b> · Whoop rec avg <b>${s.rec===null?'—':Math.round(s.rec)+'%'}</b></span>
  </div>${WEEK.includes(todayISO())&&fuelCalc(todayISO()).logged?`<div class="small" style="margin-top:8px">Today is counted as logged so far — the averages settle by bedtime.</div>`:''}</div>`;
}

/* ---------- rest timer ---------- */
let TINT = null;
function startTimer(sec, nextSet, last){
  stopTimer();
  const end = Date.now() + sec*1000;
  $('timer').style.display = 'block';
  $('tlab').textContent = (last ? 'Rest · next lift after this' : 'Rest · set ' + nextSet + ' next') + ' · target ' + fmtRest(sec);
  TINT = setInterval(()=>{
    const left = Math.max(0, end - Date.now());
    const s = Math.ceil(left/1000);
    $('tclock').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    $('tbar').style.width = (left/(sec*1000)*100)+'%';
    if(left<=0){ $('tclock').textContent = 'GO'; clearInterval(TINT);
      if(navigator.vibrate) navigator.vibrate([120,60,120]); }
  }, 250);
}
function stopTimer(){ if(TINT) clearInterval(TINT); $('timer').style.display='none'; }

/* ---------- export ---------- */
function tmark(ok){ return ok===true?'✓':(ok===false?'✗':'—'); }
function buildExport(){
  let out = CFG.name.toUpperCase() + ' — C&C LOG EXPORT — ' + new Date().toLocaleString() + '\n' + (CFG.weekLabel||'') + '\n';
  Object.keys(S.r).sort().forEach(d=>{
    const r = S.r[d]; const has = Object.values(r).some(v=>v);
    if(!has) return;
    out += '\n' + d + ' readiness: E' + (r.e||'-') + ' So' + (r.so||'-') + ' Sl' + (r.sl||'-') + ' M' + (r.m||'-');
    if(r.bw) out += ' | BW ' + r.bw;
    if(r.slh) out += ' | sleep ' + r.slh + 'h';
    if(CFG.whoop && (r.rec||r.hrv)) out += ' | Whoop rec ' + (r.rec||'-') + '% HRV ' + (r.hrv||'-') + ' RHR ' + (r.rhr||'-') + ' strain ' + (r.strain||'-');
  });
  if(FUEL.on){
    let fl = '';
    Object.keys(S.f).sort().forEach(d=>{
      const c = fuelCalc(d); if(!c.logged && !c.cr) return;
      fl += '\n' + d + ' fuel [' + c.kind + ']: P ' + c.P + 'g (' + c.n30 + '×' + FUEL.protMeal + '+) | ' + fmtK(c.K) + ' kcal | C ' + c.C + 'g | EA ' + (c.ea===null?'-':c.ea.toFixed(0)) + ' ' + (EM[c.band]||'');
      if(c.kind==='lift') fl += ' | pre ' + tmark(c.preOk) + (c.preMin!==null?' ('+c.preMin+' min before)':'') + ' | post ' + tmark(c.postOk) + (c.postMin!==null?' ('+c.postMin+' min after)':'');
      fl += ' | bed ' + (c.bedOk?'✓':'—') + ' | creatine ' + (c.cr?'✓':'—');
      const f = S.f[d];
      const parts = FUEL.slots.concat([{id:'x',l:'extra'}]).map(sl=>{ const s=f[sl.id]; if(!s||!(num(s.p)||num(s.k))) return null;
        return sl.id + (s.t?' '+hm12(s.t):'') + ' P' + num(s.p) + '/' + fmtK(num(s.k)) + (s.it&&s.it.length?' ['+s.it.join(', ')+']':''); }).filter(Boolean);
      if(parts.length) fl += '\n   ' + parts.join(' · ');
    });
    if(fl){
      const s = fuelStats();
      out += '\n' + fl;
      out += '\n\nFUEL WEEK: protein avg ' + (s.P===null?'-':Math.round(s.P)+'g') + ' · ≥' + FUEL.protDay + 'g on ' + s.pDays + '/' + s.n + ' logged days · ' + (s.n30===null?'-':s.n30.toFixed(1)) + ' feedings≥' + FUEL.protMeal + '/day · kcal avg ' + (s.K===null?'-':fmtK(s.K)) + ' · EA avg ' + (s.EA===null?'-':s.EA.toFixed(0)) + ' · pre-lift ' + s.pre + '/' + s.lifts + ' · post-lift ' + s.post + '/' + s.lifts + ' · pre-sleep ' + s.bed + '/' + s.n + ' · creatine ' + s.cr + '/7 · BW ' + (s.bw0===null?'-':s.bw0+'→'+s.bw1) + ' · rec avg ' + (s.rec===null?'-':Math.round(s.rec)+'%');
    }
  }
  CFG.sessions.forEach(s=>{
    const k = s.date + '|' + s.id;
    if(s.kind==='lift'){
      const x = S.x[k]; if(!x) return;
      let lines = '';
      const extras = S.added[k]||[];
      const names = s.ex.map(e=>e.name).concat(extras);
      names.forEach((nm,i)=>{
        const st = x[i]; if(!st || (!st.sets.length && !st.c && !st.tag)) return;
        const done = st.sets.filter(t=>t&&(t.t||t.w||t.r));
        const setsTxt = done.map(t=>(t.w||'?')+'×'+(t.r||'?')+'@'+(!t.rir?'?':t.rir)+'RIR'+(t.t?'':'(unchecked)')).join(', ');
        const rests = done.map(t=>t.rest).filter(v=>v);
        const avgRest = rests.length ? Math.round(rests.reduce((a,b)=>a+b,0)/rests.length) : null;
        const tEx = (s.ex[i]||{});
        lines += '  ' + nm + (st.sub?' →SUB: '+st.sub:'') + ': ' + (setsTxt||'(no sets)');
        if(avgRest) lines += ' | avg rest ' + avgRest + 's (target ' + (tEx.rest||90) + 's)';
        if(S.gl[nm]) lines += ' | 🟢';
        if(st.tags&&st.tags.length) lines += ' | TAGS: ' + st.tags.join(',');
        if(st.c) lines += ' | "' + st.c + '"';
        lines += '\n';
      });
      if(lines){ out += '\n\n' + s.date + ' · ' + s.title + '\n' + lines; if(x.note) out += '  Session note: "' + x.note + '"\n'; }
    } else {
      const a = S.act[k]; if(!a || (!a.done && !a.dur && !a.c)) return;
      out += '\n\n' + s.date + ' · ' + s.title + ': ' + (a.done?'DONE':'logged') +
        (a.dur?' · '+a.dur+' min':'') + (a.dist?' · '+a.dist:'') + (a.feel?' · felt '+a.feel+'/5':'') + (a.c?' · "'+a.c+'"':'');
    }
  });
  out += '\n\n---JSON---\n' + JSON.stringify(S);
  return out;
}
function exportData(){
  const t = buildExport();
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>{}); ok = true; }
  alert(ok ? 'Log copied. Paste it to Claude.' : 'Copy failed — use Share instead.');
}
function shareData(){
  const t = buildExport();
  if(navigator.share){ navigator.share({title:CFG.name+' training log', text:t}); }
  else exportData();
}
function resetWeek(){
  if(!confirm('Reset for the new week? This clears the week\'s lifts and activities. Check-ins, fuel logs, staples and green lights are kept. Export first.')) return;
  S.x={}; S.act={}; S.added={}; save(); VIEW='week'; render();
  alert('Clean slate for the lifts. Check-ins and fuel history carried forward. See you Monday.');
}

render();
</script>
