input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);

.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}

.rb{padding:10px 0;text-align:center;border:1px solid var(--line);border-radius:9px;color:var(--dim);

.rb.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.lbl{font-size:12px;color:var(--dim);margin-top:10px;letter-spacing:.06em;text-transform:uppercase}

#timer .tin{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
#tclock{font-family:'Avenir Next Condensed','Arial Narrow',monospace;font-size:30px;font-weight:800;color:var(--acc)}
#tbarw{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
#tbar{height:100%;background:var(--acc);width:100%}

.foot{margin-top:22px;text-align:center;color:var(--dim);font-size:11.5px;letter-spacing:.06em}
details summary{cursor:pointer;color:var(--acc);font-size:13px;font-weight:600;letter-spacing:.04em}

h3.sect{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;text-transform:uppercase;

.wkd{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:17px;
  text-transform:uppercase;letter-spacing:.06em}

.wkdate{font-size:12px;color:var(--dim)}
.wks{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px}
.wks .t{color:var(--ink)}
.wks .sub2{color:var(--dim);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--dim);vertical-align:1px}

.dot.Walk{background:#7FB2C9} .dot.Zone2{background:#7FB2C9} .dot.Fuel{background:var(--warn)}

/* ---- fuel ---- */
.fuel{border-left:3px solid var(--warn)}
.ftg{font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:6px}

.fbar{margin-top:9px}

.fwhen{font-size:11.5px;color:var(--dim);margin-left:6px}

.ftgt{font-size:12px;color:var(--acc2);margin-top:3px}

.fchip.new{border-style:dashed;color:var(--acc)}

<script>
const CFG = {"name": "Cassandra", "brand": "CASS <b>// RISE</b>", "tag": "Stronger every decade", "key": "cchos_cass_v1", "whoop": true, "deload": false, "weekLabel": "Week 10 · Oct 19 – 25 · Block 2, week 3 · Mon/Tue/Thu/Fri 45 min", "motiv": ["Block 2, week three. Every lift hit its number last week. Today most of them move.", "Two sets at 140 today. The first one last week said the second is there.", "The 60 is yours on the goblet squat. Three eights at 55 said so.", "84 on the row — one set — then back to the 72 you own.", "The 55 pulldown gets its test today. Five clean reps is a pass. Three is still a number worth writing down.", "Monday and Tuesday your resting heart rate ran ten beats high. By Thursday it was back. Short things pass.", "Red morning rule: every lift stays, the heavy top set comes off, every set stops with 3 left.", "The elbow passed its test. The arms stay on the card.", "The groin passed its test. The machine is back — lightest pin, two sets.", "The bridge moves to the bench. Same 45, more road for the hips.", "Fast sets first. Push like you mean it, lower like you don't.", "Four feedings of 25. Tap the chip, tap Ate now. Ten seconds.", "Creatine every day — the button is on the Fuel card. One tap.", "Two Saturdays without a scale reading. This Saturday: four numbers, then the walk.", "Lean and strong, not small.", "Stop with two left. The last ugly rep costs more than it pays.", "Every heavy rep today is bone you keep at 70.", "Long rests are fine. Last week's sessions all finished inside 45 minutes anyway.", "Five lifting weeks to November 20, then Thanksgiving week off. Earn it.", "Done beats perfect. Logged beats done."], "sessions": [{"id": "lowA", "date": "2026-10-19", "title": "Lower A — Block 2 · 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "Two sets at 140 on the leg press, the 60 on the squat, 42.5 on the pull-through, and the step-up picks up a bell", "research": "You did this session last week with Whoop in the twenties and your resting heart rate ten beats above normal — and still took 140 for six with 2 left, three eights at 55, and three twelves on the pull-through. On a red morning. That says the weights are right, and a little under where you are on a good day, so today everything moves one step: the second set joins at 140, the squat goes to 60 for six to eight, the pull-through takes the 42.5 you found, and the step-up gets the 10-lb bell the card promised. Heavy sets are the ones that build strength: when the same work is done with heavy or light weights, muscle grows about the same, but strength goes up more with the heavy ones (Schoenfeld 2017). That is why the top sets keep stacking up before the reps do. About those red mornings: Monday and Tuesday were the two lowest Whoop readings in your log — 29 and 22 percent, heart rate 88 and 89 — and by Thursday it was back to 80. A two-day spike that clears on its own is a short thing: travel, a late night, a bug, a drink. It is not a trend, and you lifted through it fine. A rule for next time, so you don't have to decide at 6:40: Whoop under 33 percent, or you walk in flat — every lift stays, the heavy top set comes off, and every set stops with 3 left. Write 'red' in the note. You also ran the week upper-first: Upper A on Monday, this session on Tuesday, and the same swap Thursday and Friday. That works fine. The cards are built lower-first; if you'd rather keep upper first, tell Chancey and next week's cards will match you. Rests ran long again — over two minutes on the pull-through, three and a half on the step-up — and the session still finished in 42 minutes. Keep them. Fuel: nothing was logged last week, and the scale hasn't been read since the 5th. The Fuel card now matches the corrected plan — four feedings of 25 or more, not 30 — and the ask is as small as it gets: tap the creatine button, and log dinner by tapping a staple chip. Ten seconds.", "warmup": "5 min: brisk walk in, bodyweight squats ×10, glute bridges ×10, hip hinge drill with hands on hips ×10 (butt back, flat back), single-leg stand 15s each. Then one easy set on the leg press at 55 for 8 — the speed sets below finish the job.", "ex": [{"name": "Leg Press — speed set", "sets": 2, "reps": "5 fast", "load": "70", "last": "70×5 @4/4 RIR (10/12)", "rest": 60, "nogl": 1, "cue": "Two sets of five at 70 — half of today's heavy set. Lower for 3 seconds, then push as fast as you can. Feet on the plate, stop just short of locking the knees. Easy and quick, not tiring. Last week these read 4 left on a red morning, which is useful to know: if the fast fives at 70 feel like 4 left again, write it — that's the tank talking, not the legs.", "mus": ["quads", "glutes"], "act": "Same muscles as the heavy sets — front of the thighs and the butt — asked to fire fast instead of hard. Think 'jump' without leaving the plate."}, {"name": "Leg Press", "sets": 3, "reps": "6, 6, then 8", "load": "140 → 130", "last": "140×6 @2 RIR, then 130×8 @2/2 (10/12) 🟢", "rest": 120, "cue": "The 140 for six had exactly 2 left — on target — so the second set joins it. Bridge first: 110 for 3 easy reps, not logged. Sets 1 and 2: 140 for six, stopping with 2 left; if rep 5 of set 2 would be a grind, stop at 4 and write it down — that's the data. Set 3: 130 for 8. Feet mid-platform, lower to 90°, drive through the whole foot, 2-minute rests. Both sixes with 2 left and all three sets go to 140 next week.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Goblet Squat", "sets": 3, "reps": "6-8", "load": "60", "last": "55×8 @3/2/2 RIR (10/12) 🟢", "rest": 120, "cue": "Three eights at 55 with 2 or more left — the 60 is yours. Six to eight reps, stopping with 2 left; six is a fine first day. Chest proud, elbows inside the knees, full depth, slow down. Getting it up: stand the bell on a bench and scoop it to your chest with both hands under the top end. The elbow has said nothing about holding the 55; if the 60 changes that, hug it tight so the forearms carry it, tag it, and finish with the 55 for 8.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Cable Pull-Through", "sets": 3, "reps": "10-12", "load": "42.5", "last": "37.5×12 @3/2/2 RIR (10/12) 🟢 · \"There is no 40. Next weight is 42.5\"", "rest": 120, "cue": "You found the next pin — 42.5 — so that's the weight. Ten to twelve, stopping with 2 left; ten is fine. Face away, rope between the legs, butt back toward the machine, flat back, stand and squeeze for a full second. Glutes, not back. If the back does the work at 42.5, go back to 37.5 for 15.", "mus": ["glutes", "hamstrings"], "act": "The butt. Squeeze it hard at the top of every rep — if you feel it in your lower back instead, don't lift as high."}, {"name": "Step-Up — RIGHT LEG FIRST", "sets": 3, "reps": "10/leg", "load": "10 · one bell at your side", "last": "High step, BW ×12 @3/3/2 RIR (10/12) 🟢", "rest": 120, "cue": "All three sets had 2 left — the bell joins. Same high step, and now a 10-lb bell hanging at your side in the hand opposite the stepping leg, other hand free near the rack. Ten a leg, stopping with 2 left. Right first. Drive through the heel, stand fully tall, 3 seconds down. Full 2 minutes; the clock starts after the left leg. If the bell wrecks your balance on the high step, take the lower step with the bell rather than the high step without it — both are a step up from last week.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Calf Raise", "sets": 2, "reps": "12", "load": "110", "last": "100×12 @4/4 RIR (10/12) 🟢", "rest": 60, "cue": "Up to 110 — four left on both sets again says 100 was light. Two sets of twelve, 1s pause at the top, 3s down. If the stack skips 110, take the next pin up and write the number. If twelve isn't there, take ten and note it.", "mus": ["calves"], "act": "Back of the lower leg. Pause at the top, slow 3s down."}, {"name": "Single-Leg Balance — eyes closed, fingertip on the rack — RIGHT FIRST", "sets": 2, "reps": "20s/side", "load": "BW", "last": "Fingertip, eyes closed; hands-free: 2s right, 4s left (10/12)", "rest": 30, "cue": "Two and four seconds hands-free — real numbers, and the left is ahead, which fits the right-side-shorter pattern. Same drill: one fingertip on the rack, find your balance with eyes open, close them, count to 20. Then lift the fingertip for the last 8 seconds instead of 5 and see how long you last. Right in set 1, left in set 2. Type the hands-free seconds in the reps box; 5 is the goal, 3 is progress.", "mus": ["core", "calves"], "act": "Quiet strength: calf and deep core making hundreds of tiny corrections — now without your eyes helping. Soft knee, tall spine, breathe."}]}, {"id": "upA", "date": "2026-10-20", "title": "Upper A — Block 2 · 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "The 55 pulldown test, one set at 84 on the row, four nines on the press, and the push-up is back for real", "research": "The elbow answered every question last week: eight push-ups on the high bar with 4 left and no note, then two sets each of pushdowns and curls, no note. So the push-up comes back as a real lift, two sets, and the pulldown gets the test the card promised: 55. It is a jump of more than a third, so it is one set, done fresh, after a bridge rep or two at 40. Five or six clean reps with 2 left means the plate is yours. Three means it stays a one-set test next week. If it won't move cleanly at all, that's an answer too — write it. The row: 72 for ten with 2 left on the third set means 72 is owned. The next pin is 84; it gets one set, and 72 keeps the other two. The press: four eights with exactly 2 left each — the cleanest the press has ever looked. The machine jumps 20 to 30 a side, so the road up is reps: four nines this week, four tens next, then one set at 30 a side as a test. The shoulder press goes to twelves for the same reason — the next bells are the 17.5s, a 40 percent jump, so the reps come first. One thing to hold onto: tendons adapt slower than muscle — weeks, not days — so the arm work moves one notch at a time, and the push-up stays on the high bar until two sets of ten have 3 left and no note. Red morning rule applies here too: every lift stays, the 55 test and the 84 set come off, everything stops with 3 left. Fuel: tap creatine, log dinner. That's the whole ask.", "warmup": "5 min: arm circles ×10 each way, band pull-aparts ×15, 10 slow wrist circles each way, 10 open-close fists, then one easy set on the Hammer Strength press at 10 a side for 10.", "ex": [{"name": "Hammer Strength MTS Chest Press — speed set", "sets": 2, "reps": "5 fast", "load": "10/side (type 20)", "last": "10/side ×5 @5/5 RIR (10/13)", "rest": 60, "nogl": 1, "cue": "Two sets of five at 10 a side — type 20 in the weight box, like you did last week. Handles back for 3 seconds, then press as fast as you can and stop just short of locking the elbows. Five left is right for these; speed is the point. If a fast rep bothers the right elbow, slow them down and tag it.", "mus": ["chest", "triceps"], "act": "Chest, firing fast. Shoulders down and back, blades pinned, then push like you're shoving a door open.", "subs": ["Machine Chest Press — speed set, 25×5"]}, {"name": "Hammer Strength MTS Chest Press", "sets": 4, "reps": "9", "load": "20/side (type 40)", "last": "20/side ×8/8/8/8 @2/2/2/2 RIR (10/13) 🟢 — four clean sets", "rest": 120, "cue": "Four eights with exactly 2 left each — that's the press at its best. Same 20 a side, keep typing 40, and one more rep: four nines, every set stopping with 2 left. If set 4 would dip under 2 left at nine, stop at 8 — that still counts. Blades pinned, press both arms together, 2-minute rests. The road: four nines, then four tens, then one set at 30 a side as a test. The elbow rule stands: a rep that hurts ends the set — tag HURT and write which rep.", "mus": ["chest", "triceps"], "act": "Chest. Hand flat on your chest — that muscle does the pressing. Shoulders down and back.", "subs": ["Machine Chest Press — 40×9, 4 sets"]}, {"name": "Seated Row", "sets": 3, "reps": "6, then 8-10", "load": "84 → 72", "last": "72×6 @3/3 RIR, then 72×10 @2 (10/13) 🟢 — 72 is owned", "rest": 120, "cue": "You took the third set to ten at 72 with 2 left, so 72 is yours. Bridge: 60 for 3 easy reps, not logged. Set 1: 84 for six, stopping with 2 left — if rep 5 would be a grind, stop at 4 and write it down. Sets 2 and 3: 72 for eight to ten, stopping with 2 left. Squeeze the blades to start every pull, elbows close, wrists straight, slow return. If the top of the right elbow talks at 84, finish at 72 and tag it.", "mus": ["lats", "upperback", "biceps"], "act": "Mid-back, between the shoulder blades. Start every pull by squeezing them together, then the arms follow."}, {"name": "Lat Pulldown", "sets": 3, "reps": "5-6, then 12", "load": "55 → 40 · neutral grip", "last": "40×12 @2/2/1 RIR with the 4s return (10/13) 🟢", "rest": 120, "cue": "The test the card promised. Bridge: 40 for 3 easy reps, not logged. Set 1: 55, neutral handle, for five or six, stopping with 2 left — pull to the top of the chest, hold 1 second, control it back up, no leaning back to get it moving. If rep 3 is a grind, stop at 3 and write the number; if it won't move cleanly at all, write that — both are answers. Sets 2 and 3: back to 40 for twelve with the 4-second return. Any feeling in the right elbow at 55: stop, tag HURT, write which rep. Five clean reps is a pass, and 55 gets two sets next week.", "mus": ["lats", "upperback", "biceps"], "act": "Mid-back, between the shoulder blades. Start every pull by squeezing them together, then the arms follow.", "subs": ["Assisted Pull-up — neutral grip, 3×8", "One-Arm DB Row — RIGHT ARM FIRST, 20×10"]}, {"name": "Seated DB Shoulder Press", "sets": 3, "reps": "12", "load": "12.5/db", "last": "12.5×10 @2/2/2 RIR (10/13) 🟢", "rest": 120, "cue": "Three tens, all with 2 left — the reps go up: twelve a set, stopping with 2 left; if that's eleven on set 3, write eleven. There are no 15s on your rack, so the 17.5s are the next step, and they get one test set once all three sets reach twelve. Back on the pad, bells at ear height, press up and slightly in, 2 full minutes between sets. If the 12.5s are taken, the 10s for 15.", "mus": ["shoulders"], "act": "Top of the shoulders. Light weight, no swinging — if you have to swing, it's too heavy."}, {"name": "DB Lateral Raise — easy sets", "sets": 2, "reps": "15", "load": "5/db", "last": "5×12 @3/2 RIR (10/13) 🟢", "rest": 60, "cue": "The easy ones — Friday carries the hard sets. Two sets of fifteen with the 5s, and stop at fifteen. Slight elbow bend, raise to shoulder height like pouring two jugs, 3 seconds down.", "mus": ["shoulders"], "act": "Top of the shoulders. Light weight, no swinging — if you have to swing, it's too heavy."}, {"name": "Incline Push-up (35\" bar)", "sets": 2, "reps": "8-10", "load": "BW · 35\" bar", "last": "35\" bar ×8 @4 RIR, elbow quiet (10/13) — test passed", "rest": 60, "cue": "The test passed: eight with 4 left and nothing from the elbow. So it's a real lift again, two sets. High bar (35 inches), hands just wider than the shoulders, body in one straight line, 3 seconds down until the chest nears the bar, press up. Eight to ten, stopping with 3 left. Same rule as before: any feeling in the right elbow, stop on that rep, tag HURT, write which rep. The lower bar waits until two sets of ten here have 3 left and no note.", "mus": ["chest", "triceps", "shoulders"], "act": "Chest and the back of the arms. The body stays a plank — squeeze the butt and brace the belly."}, {"name": "Dead Bug", "sets": 2, "reps": "15/side", "load": "BW", "last": "2×15 with the 3s pause @4/3 RIR (10/13) 🟢", "rest": 45, "cue": "Two sets of 15 a side, 3-second pause at full reach, and one change: the heel stops an inch off the floor at the bottom instead of resting on it. Low back gently into the floor, exhale on the reach. If the back arches, shorten the reach.", "mus": ["core"], "act": "Deep belly. Ribs down, low back gently pressed toward the floor. Breathe the whole time."}]}, {"id": "lowB", "date": "2026-10-22", "title": "Lower B — Block 2 · 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "The 22.5s on the RDL, 130 high and wide, 12.5 on the split squat, the bridge moves to the bench, and the inner-thigh machine is back", "research": "Three cards made promises last week and you kept all three: three tens on the RDL with 3 left and no back note, so the 22.5s are next; three tens a leg on the split squat with 2 left, so the bell becomes a 12.5; and the inner-thigh machine's test set was quiet — fifteen slow reps at 15 with 5 left and no note — so it comes back properly, two sets, still the lightest pin, still with the pads a notch narrower. The groin has now been quiet for four weeks. The high-and-wide press hit three twelves, but the third set ran to nothing left, so instead of a fourth week at 120 it moves to 130 for ten — about the same effort as 120 for twelve, with more weight on the glutes and inner thighs. The bridge has run out of plates: the 45 went 10, 11, 12, 12 with 2 left every set, and the next step — two plates balanced on your lap — is awkward. So it moves to the bench. Shoulders on the bench edge, same 45, and the hips travel farther, which makes the same plate do more work. Three sets of ten to twelve. If the setup fights you the first time, the floor bridge for fifteen is on the sub list and is still a step up. This day carries nineteen hard sets for the glutes and thighs — the most of your week — which is the whole point of Block 2. Red morning rule applies here too: every lift stays, no top set, stop with 3 left.", "warmup": "5 min: brisk walk in, glute bridges ×12, hip hinge drill with a dowel ×10 (stick touches head, upper back, tailbone), bodyweight squats ×10, 10 slow side-to-side leg swings each leg with a hand on the rack.", "ex": [{"name": "Sit-to-Stand — speed set", "sets": 2, "reps": "5 fast", "load": "BW", "last": "BW ×5 @6+/6+ RIR (10/15)", "rest": 60, "nogl": 1, "cue": "A bench or box about knee height, arms crossed on your chest. Stand up as fast as you can, then take 3 seconds to sit back down. Five reps, two sets. Pick 6+ for reps left. If the right knee complains, use a higher seat.", "mus": ["quads", "glutes"], "act": "Thighs and butt, firing fast. Lean forward a little, then drive the floor away."}, {"name": "DB RDL — form checklist", "sets": 3, "reps": "8-10", "load": "22.5/db", "last": "20×10 @3/3/3 RIR (10/15) 🟢 — no back note", "rest": 90, "cue": "Three tens at 20 with 3 left and nothing from the back — the 22.5s. Eight to ten reps, stopping with 2 left; eight is a fine first day. Same checklist every set: (1) butt back, not down; (2) soft knees; (3) bells slide down the thighs; (4) stop when the hamstrings stretch; (5) squeeze glutes to stand. If the back talks at 22.5, finish with the 20s for ten — right call, not a fail.", "mus": ["hamstrings", "glutes"], "act": "Back of the thighs. Feel them stretch as you hinge, then squeeze them to stand. If your lower back talks, the hamstrings aren't doing their job yet — lighten and go slower."}, {"name": "Leg Press — feet high and wide", "sets": 3, "reps": "10", "load": "130", "last": "120×12 @2/2/0 RIR, high and wide (10/15) — third set ran to empty", "rest": 120, "cue": "Three twelves at 120, but the last one ran to nothing left — so the weight moves instead of a fourth week of reps. 130, same high-and-wide feet, ten reps, every set stopping with 2 left; if set 3 lands at 8 with 2 left, that's the right call. One hand-width higher and one wider than Monday, toes out a little, lower a touch past 90° as long as the tailbone stays down. Three tens with 2 left and it's twelve next. If the left groin talks, feet go back to Monday's position and you tag it.", "mus": ["glutes", "quads"], "act": "The butt and the inner thighs. Push through the heels and feel the stretch at the bottom."}, {"name": "Split Squat — RIGHT LEG FIRST — knee watch", "sets": 3, "reps": "8-10/leg", "load": "12.5 · one bell at your side", "last": "10 at the side ×10 @3/2/2 RIR (10/15) 🟢", "rest": 120, "cue": "Three tens with 2 left — the bell becomes a 12.5. Eight to ten a leg, stopping with 2 left. The bell hangs in the hand opposite the front leg, arm straight; other hand free near the rack. Right first. Front shin vertical, knee over the second toe. Take the full rest — that's what fixed the knee. The next bell is the 17.5 (there's no 15), so the reps climb to twelve before the weight moves again.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away.", "subs": ["Reverse Lunge — RIGHT LEG FIRST, BW ×10", "Step-Up — RIGHT LEG FIRST, BW ×10"]}, {"name": "Hip Thrust — shoulders on a bench", "sets": 3, "reps": "10-12", "load": "45 plate", "last": "Floor bridge, 45 ×10/11/12/12 @2 RIR on every set (10/15) 🟢", "rest": 90, "cue": "The floor bridge ran out of road: the 45 is done for twelves, and stacking a second plate on your lap is awkward. So the same 45 moves to the bench, where the hips travel farther and the plate does more. Setup: sit on the floor with your upper back against a bench (or a step about knee height), feet flat and hip-width, plate on your lap held with both hands — tip it on from its edge like before. Drive the hips up until the body is a flat line from shoulders to knees, shins vertical at the top, chin tucked, ribs down, 2-second squeeze, lower under control. Ten to twelve, three sets, stopping with 2 left. If the bench slides or the setup fights you, do the floor bridge with the 45 for fifteen instead and write that.", "mus": ["glutes", "hamstrings"], "act": "The butt. Squeeze it hard at the top of every rep — if you feel it in your lower back instead, don't lift as high.", "subs": ["Glute Bridge — feet on floor, 45 plate ×15", "Single-Leg Glute Bridge — RIGHT LEG FIRST, BW ×12"]}, {"name": "Outer Thigh (machine)", "sets": 3, "reps": "12-15", "load": "30 — one pin up", "last": "25×15 @3/3/3 RIR (10/15) 🟢", "rest": 60, "cue": "Three fifteens at 25 with 3 left — one pin up, 30. Twelve to fifteen, stopping with 2 left. Sit tall, press the knees out smoothly, 1-second hold at the widest point, 3 seconds back in. Don't let the stack slam.", "mus": ["glutes"], "act": "Side of the hip — the muscle that keeps your knee from falling inward. If you feel it in the front of the hip, sit taller.", "subs": ["Side-Lying Leg Raise — RIGHT SIDE FIRST, 15 a side with a 5-lb plate on the thigh", "Banded Lateral Walk — 15 steps each way ×3"]}, {"name": "Side-Lying Inner-Thigh Raise — RIGHT SIDE FIRST", "sets": 2, "reps": "20/side", "load": "BW", "last": "BW ×15 with the 3s hold @4/4 RIR (10/15) 🟢", "rest": 45, "cue": "Four left at fifteen — twenty a side now, same 3-second hold at the top. Lie on your right side, top foot planted in front of you, bottom leg straight; lift it 6–8 inches, hold 3, lower for 3. Right side first. Any groin twinge: stop, tag HURT, note it — and skip the machine below.", "mus": ["glutes"], "act": "Inner thigh — the long muscle from the groin down the inside of the thigh. Small range, slow. If you feel it in the groin crease rather than the thigh, lower the leg less.", "subs": ["Sumo Squat — BW ×12, toes out"]}, {"name": "Inner Thigh (machine) — back at 15", "sets": 2, "reps": "15", "load": "15 · pads one notch narrower", "last": "Test set: 15×15 @5 RIR, groin quiet (10/15) — passed", "rest": 60, "cue": "The test was quiet, so the machine is back: two sets of fifteen, still the lightest pin (15), still with the pads one notch narrower than you used to. Three seconds squeezing in, three back out, and don't let the pads pull the legs wider than where you started. Stop with 2 left. Two sets with 3 or more left and a quiet groin, and it's 20 next week — one pin at a time; 25 is where it hurt in September. Anything weird in the left groin: stop on that rep, tag HURT, write which rep, and it goes back to one test set.", "mus": ["glutes"], "act": "Inner thigh — the long muscle from the groin down the inside of the thigh. You should feel it in the thigh, not in the crease of the groin.", "subs": ["Side-Lying Inner-Thigh Raise — RIGHT SIDE FIRST, 20 a side with a 3s hold"]}]}, {"id": "upB", "date": "2026-10-23", "title": "Upper B — Block 2 · 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "Twelve on the press, tens on the row, 22.5 on the face pull, and the arm work earns a notch", "research": "The chest press moved for the first time in a month: eleven with 2 left, then ten and nine with 1 left — the new rule did what it was supposed to. So the rule stays and the first set reaches for twelve; the next plate on that stack is 55, and the road there is still three twelves. One change: two and a half minutes between the press sets instead of two. Rest is what the second and third sets have been missing, not strength — in the trial that tested it, longer rests between heavy sets built more strength and more muscle than short ones (Schoenfeld 2016). The row: 25 for eight with 2, 1 and 1 left. Set 1 goes for ten; three tens with 2 left and it's the next bell. Face pull: three fifteens at 17.5 with 2 or more left — the 22.5 you were waiting for, at twelve. Arms: the elbow passed the push-up test and said nothing through two sets each of pushdowns and curls, so both earn one notch. The pushdown's second set ran to 1 left at twelve, so its number is ten, not twelve, until both sets have 2 left. The curl gets one set with the 10s and keeps one with the 7.5s. Tendons adapt slower than muscle — weeks, not days — which is why the arms move one notch at a time. Red morning rule applies here too: every lift stays, no reaching for twelve, everything stops with 3 left. Tomorrow: scale numbers on waking — two Saturdays have gone by without them — then the walk, then Export.", "warmup": "5 min: arm circles, band pull-aparts ×15, 10 slow wrist circles each way, 10 open-close fists, one easy set of chest press at 10 for 10.", "ex": [{"name": "Machine Chest Press — speed set", "sets": 2, "reps": "5 fast", "load": "25", "last": "25×5 @4/3 RIR (10/16)", "rest": 60, "nogl": 1, "cue": "Two sets of five at 25. Handles back for 3 seconds, then press as fast as you can, stopping just short of locking the elbows. Four and three left last week — closer to right. If fast reps feel wrong on the elbow, slow them down and tag it.", "mus": ["chest", "triceps"], "act": "Chest, firing fast. Shoulders down and back, blades pinned, then push like you're shoving a door open."}, {"name": "Machine Chest Press", "sets": 3, "reps": "12, then 10+", "load": "40", "last": "40×11/10/9 @2/1/1 RIR (10/16) 🟢 — first move in a month", "rest": 150, "cue": "Same 40, same rule, one more rep at the top. Set 1: go for twelve — you had 2 left at eleven. Sets 2 and 3: stop with 1 left, whatever the number is; ten and nine were the right calls last week. Two and a half minutes between sets now — rest is what sets 2 and 3 have been missing. The stack jumps 40 to 55, so the road is three twelves. Blades pinned, smooth press. A rep that hurts the elbow ends the set — tag HURT and write which rep.", "mus": ["chest", "triceps"], "act": "Chest. Hand flat on your chest — that muscle does the pressing. Shoulders down and back.", "subs": ["Hammer Strength MTS Chest Press — 20/side ×9, 4 sets"]}, {"name": "One-Arm DB Row — RIGHT ARM FIRST", "sets": 3, "reps": "8-10/arm", "load": "25/db", "last": "25×8/8/8 @2/1/1 RIR (10/16) 🟢", "rest": 120, "cue": "Eight at 25 with 2, 1 and 1 left. Se e — the elbows are hinges bolted to your sides."}, {"name": "DB Lateral Raise", "sets": 3, "reps": "10, 10, then 12", "load": "7.5 → 5/db", "last": "7.5×8/8 @3/2 RIR, then 5×12 @2 (10/16) 🟢", "rest": 60, "cue": "Two eights at 7.5 with 3 and 2 left — ten on both now, and stop at ten even if there's more. Set 3: the 5s for twelve, 3 seconds down. No swinging on any of them. Two tens at 7.5 with 2 left and the third set joins at 7.5.", "mus": ["shoulders"], "act": "Top of the shoulders. Light weight, no swinging — if you have to swing, it's too heavy."}, {"name": "DB Curl", "sets": 2, "reps": "8-10, then 12", "load": "10 → 7.5/db", "last": "7.5×12 @3/3 RIR (10/16) — elbow quiet", "rest": 60, "cue": "Both sets had 3 left and the elbow said nothing, so the heavier bell gets one set. Set 1: the 10s for eight to ten, stopping with 2 left. Set 2: the 7.5s for twelve. Stand tall, palms forward, elbows at your sides and they don't drift forward; squeeze 1 second at the top, lower for 3. No swinging, no leaning back. Any feeling in the right elbow: stop, tag HURT, write which rep. Ten with the 10s and 2 left, and both sets go to the 10s next week.", "mus": ["biceps"], "act": "Front of the upper arm. Put a hand on it between sets — that's the one working. No swinging, no leaning back."}, {"name": "Plank + Side Plank", "sets": 2, "reps": "55s + 30s/side", "load": "BW", "last": "50s front + 30s a side, both rounds (10/16)", "rest": 45, "cue": "Two rounds. Front plank 55 seconds — five more — then 30 a side. Elbows under shoulders, glutes tight, hips level; on your hands if the forearm version bothers the elbow. Type your front-plank seconds in the reps box.", "mus": ["core"], "act": "Deep belly. Ribs down, low back gently pressed toward the floor. Breathe the whole time."}]}, {"id": "walk1", "date": "2026-10-24", "title": "Scale Check + Beach Walk or Yoga", "time": "Morning", "kind": "act", "badge": "Mobility", "why": "Four numbers off the scale, one tape, an easy walk. Then Expo /* ---------- storage (safe) ---------- */
let MEM = {}; let CANSTORE = true;
function load(){ try{ const s = localStorage.getItem(CFG.key); return s?JSON.parse(s):{}; }
  catch(e){ CANSTORE=false; return MEM; } }
function save(){ try{ localStorage.setItem(CFG.key, JSON.stringify(S)); }
  catch(e){ CANSTORE=false; MEM = S; } }
let S = load();
S.r = S.r||{}; S.x = S.x||{}; S.act = S.act||{}; S.gl = S.gl||{}; S.added = S.added||{}; S.f = S.f||{}; S.stp = S.stp||[];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isoOf(ms){ const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return isoOf(Date.now()); }
function addDays(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoOf(d.getTime()); }
function dayName(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}); }
function mday(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'}); }
function doy(){ const d=new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0))/864e5); }
function minRep(r){ const m = String(r).match(/\d+/); return m?parseInt(m[0]):1; }
function num(v){ const n=parseFloat(v); return isFinite(n)?n:0; }
function fmtK(n){ return Math.round(n).toLocaleString('en-US'); }

const DATES = [...new Set(CFG.sessions.map(s=>s.date))].sort();
const WEEK = (function(){ const a=[]; let d=DATES[0]; const end=CFG.restDate||DATES[DATES.length-1]; while(d<=end && a.length<8){ a.push(d); d=addDays(d,1); } return a; })();
let CUR = WEEK.includes(todayISO()) ? todayISO() : WEEK[0];
let VIEW = 'week';
const FUEL = CFG.fuel || {on:false};
const EM = {grn:'🟢', yel:'🟡', red:'🔴'};

/* ---------- session status ---------- */
function sesStatus(s){
  const k = s.date + '|' + s.id;
  if(s.kind !== 'lift'){
    const a = S.act[k];
    return (a && a.done) ? {txt:'✓ done', cls:'done'} : {txt:'—', cls:''};
  }
  const x = S.x[k]; if(!x) return {txt:'—', cls:''};
  const total = s.ex.length;
  let n = 0;
  s.ex.forEach((e,i)=>{ const st=x[i]; if(st && st.sets && st.sets.some(t=>t&&t.t)) n++; });
  if(n===0) return {txt:'—', cls:''};
  return n>=total ? {txt:'✓ done', cls:'done'} : {txt:n+'/'+total+' lifts', cls:'part'};
}

/* ---------- render ---------- */
function render(){ VIEW==='week' ? renderWeek() : renderDay(); }
function goWeek(){ VIEW='week'; render(); window.scrollTo(0,0); }
function setDay(d){ CUR = d; VIEW='day'; render(); window.scrollTo(0,0); }

function renderWeek(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><div class="sys">C&amp;C Health OS</div></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari.</div>`;
  const all = CFG.sessions.length;
  const done = CFG.sessions.filter(s=>sesStatus(s).cls==='done').length;
  h += `<div class="card"><div class="eyebrow">${esc(CFG.weekLabel||'This week')}</div>
    <div style="font-size:14px">${done} of ${all} sessions complete</div>
    <div class="prog"><i style="width:${all?Math.round(done/all*100):0}%"></i></div></div>`;
  WEEK.forEach(d=>{
    const today = d===todayISO();
    const ss = CFG.sessions.filter(s=>s.date===d);
    h += `<div class="wk ${today?'today':''}" onclick="setDay('${d}')">
      <div class="wkh"><div class="wkd">${dayName(d)}${today?' · today':''}</div><div class="wkdate">${mday(d)}</div></div>`;
    if(ss.length){
      ss.forEach(s=>{
        const st = sesStatus(s);
        h += `<div class="wks"><div><span class="dot ${(s.badge||'').replace(' ','')}"></span><span class="t">${esc(s.title)}</span>
          <div class="sub2" style="margin-left:15px">${esc(s.time||'')}</div></div>
          <div class="st ${st.cls}">${st.txt}</div></div>`;
      });
    } else {
      h += `<div class="wks"><div><span class="dot"></span><span class="t" style="color:var(--dim)">${d===CFG.restDate?'Full rest — export Saturday, reset today':'Rest day — the fuel still counts'}</span></div></div>`;
    }
    if(FUEL.on) h += fuelLine(d);
    h += `</div>`;
  });
  if(FUEL.on) h += fuelReport();
  h += `<div class="card"><div class="eyebrow">Week close-out</div>
    <div class="small" style="margin-bottom:9px"><b>The ritual:</b> Saturday after the walk → Export week, paste to Claude. Sunday → Reset (lifts only — check-ins, fuel and staples are kept). Monday's file arrives reprogrammed.</div>
    <div class="row"><button class="btn acc" onclick="exportData()">Export week &amp; copy</button>
    <button class="btn" onclick="shareData()">Share…</button>
    <button class="btn ghost" onclick="resetWeek()">Reset week</button></div></div>`;
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

function renderDay(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><button class="home" onclick="goWeek()">‹ Week</button></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari. It works offline and remembers everything.</div>`;
  h += `<div class="chips">` + WEEK.map(d=>
    `<button class="chip ${d===CUR?'on':''}" onclick="setDay('${d}')">${dayName(d)} ${mday(d)}</button>`).join('') + `</div>`;
  h += readinessCard();
  h += lowBanner();
  if(FUEL.on) h += fuelCard();
  const todays = CFG.sessions.filter(s=>s.date===CUR);
  if(!todays.length) h += restCard();
  todays.forEach(s=>{ h += missionCard(s); h += (s.kind==='lift') ? liftCard(s) : actCard(s); });
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

/* ---------- exercise state ---------- */
function xkey(sid){ return CUR + '|' + sid; }
function exState(sid, i){
  const k = xkey(sid); S.x[k] = S.x[k]||{};
  S.x[k][i] = S.x[k][i]||{sets:[],c:'',tags:[],sub:''};
  return S.x[k][i];
}

/* ---------- readiness ---------- */
function rget(){ S.r[CUR] = S.r[CUR]||{}; return S.r[CUR]; }
function rset(f,v){ rget()[f]=v; save(); render(); }
function rateRow(f,label){
  const v = rget()[f];
  return `<div class="lbl">${label}</div><div class="rd">` +
    [1,2,3,4,5].map(n=>`<button class="rb ${v===n?'on':''}" onclick="rset('${f}',${n})">${n}</button>`).join('') + `</div>`;
}
function readinessCard(){
  const r = rget();
  let inner = rateRow('e','Energy') + rateRow('so','Soreness (5 = very sore)') + rateRow('sl','Sleep quality') + rateRow('m','Mood');
  inner += `<div class="grid2" style="margin-top:10px">
    <div><div class="lbl">Bodyweight (lbs)</div><input inputmode="decimal" value="${esc(r.bw||'')}" onchange="rset('bw',this.value)"></div>
    <div><div class="lbl">Sleep (hrs)</div><input inputmode="decimal" value="${esc(r.slh||'')}" onchange="rset('slh',this.value)"></div></div>`;
  if(CFG.whoop){
    inner += `<h3 class="sect">Whoop</h3><div class="grid2">
      <div><div class="lbl">Recovery %</div><input inputmode="numeric" value="${esc(r.rec||'')}" onchange="rset('rec',this.value)"></div>
      <div><div class="lbl">HRV (ms)</div><input inputmode="numeric" value="${esc(r.hrv||'')}" onchange="rset('hrv',this.value)"></div>
      <div><div class="lbl">Resting HR</div><input inputmode="numeric" value="${esc(r.rhr||'')}" onchange="rset('rhr',this.value)"></div>
      <div><div class="lbl">Strain</div><input inputmode="decimal" value="${esc(r.strain||'')}" onchange="rset('strain',this.value)"></div></div>`;
  }
  const filled = ['e','so','sl','m'].filter(f=>r[f]).length;
  return `<details ${filled<4?'open':''}><summary>Daily check-in ${filled===4?'✓':'('+filled+'/4)'}</summary>
    <div class="card">${inner}</div></details>`;
}
function lowBanner(){
  const r = rget();
  const vals = ['e','sl','m'].map(f=>r[f]).filter(Boolean);
  const avg = vals.length===3 ? (vals.reduce((a,b)=>a+b,0) + (r.so?(6-r.so):0)) / (r.so?4:3) : null;
  const whoopLow = CFG.whoop && r.rec && Number(r.rec) < 34;
  if((avg!==null && avg <= 2.5) || whoopLow){
    let fl = '';
    if(FUEL.on){
      const y = addDays(CUR,-1); const fc = fuelCalc(y);
      if(fc.logged) fl = ` <b>Yesterday's fuel:</b> P ${fc.P} g · ${fmtK(fc.K)} kcal · EA ${fc.ea.toFixed(0)} ${EM[fc.band]||''}${fc.band==='grn'?'.':' — that is the likeliest cause.'}`;
      else fl = ` Yesterday's fuel wasn't logged — with September's numbers, an empty tank is the first suspect.`;
    }
    return `<div class="adjust"><b>Readiness is low today.</b> Option, not an order: keep planned loads, drop the last set of each exercise, and bank recovery. Research: acute readiness-based volume cuts protect long-term progress (autoregulation, Helms 2018). Your call — you set the limits.${fl}</div>`;
  }
  return '';
}

function ckSet(sid,i,si,rest){
  const st = exState(sid,i);
  const w = $('w_'+sid+'_'+i+'_'+si).value, r = $('r_'+sid+'_'+i+'_'+si).value, rir = $('rir_'+sid+'_'+i+'_'+si).value;

  const now = Date.now();
  const prev = st.sets[si-1];
  st.sets[si] = {w, r, rir, t: now, rest: prev&&prev.t ? Math.round((now-prev.t)/1000) : null};
  greenCheck(sid,i); save(); render(); const pl = ((CFG.sessions.find(x=>x.id===sid)||{}).ex||[])[i]; startTimer(rest, si+2, !pl || si+1 >= pl.sets);
}
function greenCheck(sid,i){
  if(CFG.deload) return;
  const s = CFG.sessions.find(x=>x.id===sid); if(!s||!s.ex[i]) return;
  const ex = s.ex[i]; const st = exState(sid,i);
  if(ex.nogl) return;
  const doneSets = st.sets.filter(x=>x&&x.t);
  if(doneSets.length >= ex.sets && doneSets.slice(0,ex.sets).every(x=>Number(x.r)>=minRep(ex.reps) && (x.rir==='6+'||Number(x.rir)>=2))){
    S.gl[ex.name] = 1;

}

/* ---------- fuel ---------- */
function fget(d){ S.f[d] = S.f[d]||{}; return S.f[d]; }
function fslot(d,id){ const f=fget(d); f[id]=f[id]||{p:'',k:'',c:'',t:'',it:[]}; return f[id]; }
function tms(d,t){ if(!t) return null; const x=new Date(d+'T'+t+':00').getTime(); return isFinite(x)?x:null; }
function hm12(t){ if(!t) return ''; const p=t.split(':'); let h=parseInt(p[0]); const m=p[1]; const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return h+':'+m+' '+ap; }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function setsOn(d){
  let first=null,last=null;
  Object.keys(S.x).forEach(k=>{ const x=S.x[k]; if(!x) return; Object.keys(x).forEach(i=>{ if(i==='note') return; const st=x[i]; if(!st||!st.sets) return;
    st.sets.forEach(t=>{ if(t&&t.t&&isoOf(t.t)===d){ if(first===null||t.t<first) first=t.t; if(last===null||t.t>last) last=t.t; } }); }); });
  const f = S.f[d];
  if(first){ if(f) f.so={first,last}; else S.f[d]={so:{first,last}}; return {first,last}; }
  if(f&&f.so&&f.so.first) return {first:f.so.first,last:f.so.last};
  return {first:null,last:null};
}
function dayKind(d){
  if(setsOn(d).first) return 'lift';
  if(CFG.sessions.some(s=>s.kind==='lift'&&s.date===d) && d>=todayISO()) return 'lift';
  return 'rest';
}
function actDone(d){ return CFG.sessions.some(s=>s.kind!=='lift'&&s.date===d&&(S.act[d+'|'+s.id]||{}).done); }
function fuelCalc(d){
  const f=S.f[d]||{}; const kind=dayKind(d); const so=setsOn(d);
  let P=0,K=0,C=0,n30=0,logged=false;
  FUEL.slots.concat([{id:'x'}]).forEach(sl=>{ const s=f[sl.id]; if(!s) return; const p=num(s.p),k=num(s.k),c=num(s.c);
    if(p||k||c) logged=true; P+=p; K+=k; C+=c; if(p>=FUEL.protMeal) n30++; });
  const burn = so.first ? FUEL.burn.lift : (kind==='lift' ? FUEL.burn.lift : (actDone(d)?FUEL.burn.act:0));
  const tgtK = kind==='lift'?FUEL.kcal.lift:FUEL.kcal.rest;
  const tgtC = kind==='lift'?FUEL.carbs.lift:FUEL.carbs.rest;
  const ea = logged ? (K-burn)/FUEL.ffm : null;
  const band = ea===null ? '' : (ea<FUEL.ea.red?'red':(ea<FUEL.ea.green?'yel':'grn'));
  const pre=f.pre||{}, post=f.post||{}, bed=f.bed||{};
  let preOk=null, preMin=null, postOk=null, postMin=null;
  if(kind==='lift'){
    const pt=tms(d,pre.t), qt=tms(d,post.t);
    if(so.first&&pt){ preMin=Math.round((so.first-pt)/60000); preOk=(preMin>=0&&preMin<=150); }
    if(so.last&&qt){ postMin=Math.round((qt-so.last)/60000); postOk=(postMin>=-5&&postMin<=45); }
  }
  const bedOk = num(bed.p)>=20;
  let st='';
  if(logged){ st = (P>=FUEL.prot && band==='grn') ? 'grn' : ((P>=FUEL.prot*0.8 && band!=='red') ? 'yel' : 'red'); }
  return {kind,P,K,C,n30,burn,tgtK,tgtC,ea,band,preOk,preMin,postOk,postMin,bedOk,logged,st,so,cr:!!f.cr,pre,post};
}
function eaText(c,today){
  if(c.ea===null) return `<b>Energy availability</b> shows once a feeding is logged. Under ${FUEL.ea.red} is the low-fuel line; ${FUEL.ea.green}+ is green. (intake − session burn) ÷ ${FUEL.ffm} kg lean mass.`;
  const calc = `<span style="color:var(--dim)">(${fmtK(c.K)} − ${c.burn} burn) ÷ ${FUEL.ffm} kg lean</span>`;
  if(today && c.band!=='grn'){
    const need = Math.ceil(FUEL.ea.green*FUEL.ffm + c.burn - c.K);
    return `<b>Energy availability so far ${c.ea.toFixed(0)}</b> — about <b>${fmtK(need)} kcal</b> more gets you to ${FUEL.ea.green} 🟢 by bedtime. ${calc}`;
  }
  const msg = {red:`under ${FUEL.ea.red} — the low-fuel line. Eat.`, yel:`${FUEL.ea.red}–${FUEL.ea.green-1} — better, not there. Carbs around the lift.`, grn:`${FUEL.ea.green}+ — fueled.`}[c.band];
  return `<b>Energy availability ${c.ea.toFixed(0)}</b> ${EM[c.band]} — ${msg} ${calc}`;
}
function timingText(c){
  const bed = c.bedOk ? '<b>✓</b>' : '—';
  if(c.kind!=='lift') return `Rest day · Pre-sleep protein ${bed}`;
  let pre, post;
  if(c.preOk===true) pre = `<b>✓ ${hm12(c.pre.t)}</b> (${c.preMin} min before the first set)`;
  else if(c.preOk===false) pre = `<b>✗</b> ${hm12(c.pre.t)} — ${c.preMin<0?'after the first set':'more than 2.5 h before'}`;
  else if(c.pre.t) pre = `⏱ ${hm12(c.pre.t)} — lift not logged yet`;
  else pre = c.so.first ? '<b>✗</b> none logged' : '—';
  if(c.postOk===true) post = `<b>✓ ${hm12(c.post.t)}</b> (${c.postMin} min after the last set)`;
  else if(c.postOk===false) post = `<b>⚠</b> ${hm12(c.post.t)} — ${c.postMin} min after the last set`;
  else if(c.post.t) post = `⏱ ${hm12(c.post.t)} — lift not logged yet`;
  else if(c.so.last){ const late=Math.round((Date.now()-c.so.last)/60000); post = late>45 ? `<b>✗</b> not logged — ${late} min since the last set` : `<b>window open</b> — ${45-late} min left`; }
  else post = '—';
  return `Pre-lift ${pre}<br>Post-lift ${post}<br>Pre-sleep protein ${bed}`;
}

  FUEL.slots.forEach(sl=>{ h += slotRow(d,sl,c); });

function fuelSummary(c,kindLbl,today){

function fclear(id){ if(!confirm('Clear this feeding?')) return; const s=fslot(CUR,id); s.p='';s.k='';s.c='';s.t='';s.it=[]; save(); render(); }

}
function fnew(id){
  const raw = prompt('Your staple — name, protein g, kcal, carbs g\n(e.g. Turkey wrap, 28, 350, 30)'); if(!raw) return;
  const parts = raw.split(',').map(s=>s.trim()); if(parts.length<3 || !parts[0]){ alert('Need at least: name, protein, kcal'); return; }
  const x={n:parts[0], p:num(parts[1]), k:num(parts[2]), c:num(parts[3]||0)};
  S.stp.unshift(x); save(); fadd(id,0);
}
function fcr(){ const f=fget(CUR); f.cr = f.cr?0:1; save(); render(); }
function fui(o){ const f=fget(CUR); const v=o?1:0; if(f.ui!==v){ f.ui=v; save(); } }
function fuelLine(d){
  const c=fuelCalc(d); const past = d < todayISO();
  const txt = c.logged ? `P ${c.P} · ${fmtK(c.K)} kcal · EA ${c.ea.toFixed(0)}${past&&c.st?' '+EM[c.st]:''}` : (past?'not logged':'—');
  return `<div class="wks"><div><span class="dot Fuel"></span><span class="t">Fuel</span>
    <div class="sub2" style="margin-left:15px">${c.kind==='lift'?'lift day · '+fmtK(FUEL.kcal.lift):'rest day · '+fmtK(FUEL.kcal.rest)} kcal · ${FUEL.prot} g</div></div>
    <div class="st ${past?c.st:''}">${txt}</div></div>`;
}
function fuelStats(){
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const days = WEEK.map(d=>({d,c:fuelCalc(d)}));
  const logged = days.filter(o=>o.c.logged);
  const lifted = days.filter(o=>o.c.so.first);
  const bw = WEEK.map(d=>num((S.r[d]||{}).bw)).filter(v=>v>0);
  const rec = WEEK.map(d=>num((S.r[d]||{}).rec)).filter(v=>v>0);
  return {
    n: logged.length, lifts: lifted.length,
    P: avg(logged.map(o=>o.c.P)), K: avg(logged.map(o=>o.c.K)), EA: avg(logged.map(o=>o.c.ea)),
    pDays: logged.filter(o=>o.c.P>=FUEL.protDay).length, n30: avg(logged.map(o=>o.c.n30)),
    pre: lifted.filter(o=>o.c.preOk===true).length, post: lifted.filter(o=>o.c.postOk===true).length,
    bed: logged.filter(o=>o.c.bedOk).length, cr: days.filter(o=>o.c.cr).length,
    bw0: bw.length?bw[0]:null, bw1: bw.length?bw[bw.length-1]:null, rec: avg(rec)
  };
}
function fuelReport(){
  const s = fuelStats();
  if(!s.n && !s.cr) return `<div class="card fuel"><div class="eyebrow">Fuel report · this week</div><div class="small">Nothing logged yet. Tap a day, open Fuel, log what you eat. Four feedings of 30 g protein is the whole assignment.</div></div>`;
  const eaB = s.EA===null?'':(s.EA<FUEL.ea.red?'red':(s.EA<FUEL.ea.green?'yel':'grn'));
  return `<div class="card fuel"><div class="eyebrow">Fuel report · this week</div><div class="frep">
    <span class="k">Protein</span><span>avg <b>${s.P===null?'—':Math.round(s.P)+' g'}</b> · <b>${s.pDays}/${s.n}</b> days ≥ ${FUEL.protDay} · <b>${s.n30===null?'—':s.n30.toFixed(1)}</b> feedings ≥ ${FUEL.protMeal}/day</span>
    <span class="k">Energy</span><span>avg <b>${s.K===null?'—':fmtK(s.K)+' kcal'}</b> · EA avg <b>${s.EA===null?'—':s.EA.toFixed(0)}</b> ${EM[eaB]||''}</span>
    <span class="k">Timing</span><span>pre-lift <b>${s.pre}/${s.lifts}</b> · post-lift <b>${s.post}/${s.lifts}</b> · pre-sleep <b>${s.bed}/${s.n}</b></span>
    <span class="k">Creatine</span><span><b>${s.cr}/7</b> · BW <b>${s.bw0===null?'—':s.bw0+' → '+s.bw1}</b> · Whoop rec avg <b>${s.rec===null?'—':Math.round(s.rec)+'%'}</b></span>
  </div>${WEEK.includes(todayISO())&&fuelCalc(todayISO()).logged?`<div class="small" style="margin-top:8px">Today is counted as logged so far — the averages settle by bedtime.</div>`:''}</div>`;
}

/* ---------- rest timer ---------- */
let TINT = null;
function startTimer(sec, nextSet, last){
  stopTimer();
  const end = Date.now() + sec*1000;
  $('timer').style.display = 'block';
  $('tlab').textContent = (last ? 'Rest · next lift after this' : 'Rest · set ' + nextSet + ' next') + ' · target ' + fmtRest(sec);
  TINT = setInterval(()=>{
    const left = Math.max(0, end - Date.now());
    const s = Math.ceil(left/1000);
    $('tclock').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    $('tbar').style.width = (left/(sec*1000)*100)+'%';
    if(left<=0){ $('tclock').textContent = 'GO'; clearInterval(TINT);
      if(navigator.vibrate) navigator.vibrate([120,60,120]); }
  }, 250);
}
function stopTimer(){ if(TINT) clearInterval(TINT); $('timer').style.display='none'; }

/* ---------- export ---------- */
function tmark(ok){ return ok===true?'✓':(ok===false?'✗':'—'); }
function buildExport(){
  let out = CFG.name.toUpperCase() + ' — C&C LOG EXPORT — ' + new Date().toLocaleString() + '\n' + (CFG.weekLabel||'') + '\n';
  Object.keys(S.r).sort().forEach(d=>{
    const r = S.r[d]; const has = Object.values(r).some(v=>v);
    if(!has) return;
    out += '\n' + d + ' readiness: E' + (r.e||'-') + ' So' + (r.so||'-') + ' Sl' + (r.sl||'-') + ' M' + (r.m||'-');
    if(r.bw) out += ' | BW ' + r.bw;
    if(r.slh) out += ' | sleep ' + r.slh + 'h';
    if(CFG.whoop && (r.rec||r.hrv)) out += ' | Whoop rec ' + (r.rec||'-') + '% HRV ' + (r.hrv||'-') + ' RHR ' + (r.rhr||'-') + ' strain ' + (r.strain||'-');
  });
  if(FUEL.on){
    let fl = '';
    Object.keys(S.f).sort().forEach(d=>{
      const c = fuelCalc(d); if(!c.logged && !c.cr) return;
      fl += '\n' + d + ' fuel [' + c.kind + ']: P ' + c.P + 'g (' + c.n30 + '×' + FUEL.protMeal + '+) | ' + fmtK(c.K) + ' kcal | C ' + c.C + 'g | EA ' + (c.ea===null?'-':c.ea.toFixed(0)) + ' ' + (EM[c.band]||'');
      if(c.kind==='lift') fl += ' | pre ' + tmark(c.preOk) + (c.preMin!==null?' ('+c.preMin+' min before)':'') + ' | post ' + tmark(c.postOk) + (c.postMin!==null?' ('+c.postMin+' min after)':'');
      fl += ' | bed ' + (c.bedOk?'✓':'—') + ' | creatine ' + (c.cr?'✓':'—');
      const f = S.f[d];
      const parts = FUEL.slots.concat([{id:'x',l:'extra'}]).map(sl=>{ const s=f[sl.id]; if(!s||!(num(s.p)||num(s.k))) return null;
        return sl.id + (s.t?' '+hm12(s.t):'') + ' P' + num(s.p) + '/' + fmtK(num(s.k)) + (s.it&&s.it.length?' ['+s.it.join(', ')+']':''); }).filter(Boolean);
      if(parts.length) fl += '\n   ' + parts.join(' · ');
    });
    if(fl){
      const s = fuelStats();
      out += '\n' + fl;
      out += '\n\nFUEL WEEK: protein avg ' + (s.P===null?'-':Math.round(s.P)+'g') + ' · ≥' + FUEL.protDay + 'g on ' + s.pDays + '/' + s.n + ' logged days · ' + (s.n30===null?'-':s.n30.toFixed(1)) + ' feedings≥' + FUEL.protMeal + '/day · kcal avg ' + (s.K===null?'-':fmtK(s.K)) + ' · EA avg ' + (s.EA===null?'-':s.EA.toFixed(0)) + ' · pre-lift ' + s.pre + '/' + s.lifts + ' · post-lift ' + s.post + '/' + s.lifts + ' · pre-sleep ' + s.bed + '/' + s.n + ' · creatine ' + s.cr + '/7 · BW ' + (s.bw0===null?'-':s.bw0+'→'+s.bw1) + ' · rec avg ' + (s.rec===null?'-':Math.round(s.rec)+'%');
    }
  }
  CFG.sessions.forEach(s=>{
    const k = s.date + '|' + s.id;
    if(s.kind==='lift'){
      const x = S.x[k]; if(!x) return;
      let lines = '';
      const extras = S.added[k]||[];
      const names = s.ex.map(e=>e.name).concat(extras);
      names.forEach((nm,i)=>{
        const st = x[i]; if(!st || (!st.sets.length && !st.c && !st.tag)) return;
        const done = st.sets.filter(t=>t&&(t.t||t.w||t.r));
        const setsTxt = done.map(t=>(t.w||'?')+'×'+(t.r||'?')+'@'+(!t.rir?'?':t.rir)+'RIR'+(t.t?'':'(unchecked)')).join(', ');
        const rests = done.map(t=>t.rest).filter(v=>v);
        const avgRest = rests.length ? Math.round(rests.reduce((a,b)=>a+b,0)/rests.length) : null;
        const tEx = (s.ex[i]||{});
        lines += '  ' + nm + (st.sub?' →SUB: '+st.sub:'') + ': ' + (setsTxt||'(no sets)');
        if(avgRest) lines += ' | avg rest ' + avgRest + 's (target ' + (tEx.rest||90) + 's)';
        if(S.gl[nm]) lines += ' | 🟢';
        if(st.tags&&st.tags.length) lines += ' | TAGS: ' + st.tags.join(',');
        if(st.c) lines += ' | "' + st.c + '"';
        lines += '\n';
      });
      if(lines){ out += '\n\n' + s.date + ' · ' + s.title + '\n' + lines; if(x.note) out += '  Session note: "' + x.note + '"\n'; }
    } else {
      const a = S.act[k]; if(!a || (!a.done && !a.dur && !a.c)) return;
      out += '\n\n' + s.date + ' · ' + s.title + ': ' + (a.done?'DONE':'logged') +
        (a.dur?' · '+a.dur+' min':'') + (a.dist?' · '+a.dist:'') + (a.feel?' · felt '+a.feel+'/5':'') + (a.c?' · "'+a.c+'"':'');
    }
  });
  out += '\n\n---JSON---\n' + JSON.stringify(S);
  return out;
}
function exportData(){
  const t = buildExport();
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>{}); ok = true; }
  alert(ok ? 'Log copied. Paste it to Claude.' : 'Copy failed — use Share instead.');
}
function shareData(){
  const t = buildExport();
  if(navigator.share){ navigator.share({title:CFG.name+' training log', text:t}); }
  else exportData();
}
function resetWeek(){
  if(!confirm('Reset for the new week? This clears the week\'s lifts and activities. Check-ins, fuel logs, staples and green lights are kept. Export first.')) return;
  S.x={}; S.act={}; S.added={}; save(); VIEW='week'; render();
  alert('Clean slate for the lifts. Check-ins and fuel history carried forward. See you Monday.');
}

render();
</script>
