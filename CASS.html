<script>
const CFG = {"name": "Cassandra", "brand": "CASS <b>// RISE</b>", "tag": "Stronger every decade", "key": "cchos_cass_v1", "whoop": true, "deload": true, "weekLabel": "Week 7 · Sep 28 – Oct 4 · Deload + refeed · Mon/Tue/Thu/Fri ~30 min · Sat measurements", "motiv": ["Deload is training. The muscle gets finished this week, not next.", "Eat for the 6:45 you. She's the one lifting.", "Half the sets. All the food.", "Four feedings, thirty grams each. That's the whole assignment.", "The scale will bounce this week. That's water in the muscle, not fat. Log it, don't fear it.", "Protein before bed is tomorrow's breakfast.", "Whoop can't see an empty tank. Only you can — so log the food.", "Bar hang and push-ups sit out. The elbow gets a vote this week.", "Saturday: seven numbers and three photos. The scale is one of the seven.", "You took 63 pounds off in 418 days. Now we build what's under it.", "Lean and strong, not small. Say it until the scale stops winning arguments.", "Recovery is where the last six weeks get cashed in.", "Four or more left in the tank. If it feels like work, you're doing it wrong this week.", "Ate now. Tap it. It's how the app knows you fed the lift.", "Creatine with breakfast. Every day, including Sunday.", "A rest day still has 120 grams in it.", "Same weights, same lifts, half the sets — easy on purpose.", "Block 2 starts Monday. Legs are the headline. Fuel is the ticket.", "Measurements before food, water, or the walk.", "Done beats perfect. Logged beats done."], "sessions": [{"id": "lowA", "date": "2026-09-28", "title": "Lower A — Deload — 30 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "Half the sets, same weights, four left in the tank. This week the work is at the table, not the rack", "research": "Deload means what it says: every lift below is one you've already owned, at the weight you owned it, for two sets instead of three, stopping with four or more reps left. Easy on purpose — the muscle you built over six weeks gets finished this week, not next. The bigger job is fuel. Your Whoop told the story in September: resting heart rate 79–81 on lift mornings against your own best of 73–75, HRV 12–15 against 16–18, recovery under 50% on three of four lift days last week, and 'tired, struggled' on Friday with a green Whoop — that's an empty tank, not a bad night. The scale went 134 to 131 in three weeks while you're trying to build. So the Fuel card above is now part of every day: 120 g of protein in four feedings of 30, about 2,000 calories on lift days and 1,800 on rest days, and food before and after the 6:45 session. Expect the scale to rise 1–3 lb over the next two weeks — that's water stored with carbohydrate in the muscle, not fat. The bar hang sits out this week for the elbow.", "warmup": "4 min: brisk walk in, bodyweight squats ×10, glute bridges ×10, hip hinge drill hands on hips ×10, single-leg stand 15s each.", "ex": [{"name": "Goblet Squat", "sets": 2, "reps": "10", "load": "50", "last": "50×10 @3/2/2 RIR (9/21) 🟢", "rest": 90, "cue": "Deload: two sets at 50, ten each, four or more left. Chest proud, elbows inside the knees, full depth, slow down. This is practice, not work.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Cable Pull-Through", "sets": 2, "reps": "12", "load": "32.5", "last": "32.5×12 @3/3/3 RIR (9/21) 🟢", "rest": 90, "cue": "Two sets at 32.5. Face away, rope between the legs, butt back, flat back, stand and squeeze. Four or more left.", "mus": ["glutes", "hamstrings"], "act": "The butt. Squeeze it hard at the top of every rep — if you feel it in your lower back instead, don't lift as high."}, {"name": "Leg Press", "sets": 2, "reps": "10", "load": "120", "last": "120×10 @2/2/1 RIR (9/21) 🟢 — the 130 preview waits for Block 2", "rest": 90, "cue": "Two sets at 120, ten each, easy. Feet mid-platform, lower to 90°. The 130×8 preview is postponed to Oct 5 on purpose — fueled, it'll be there.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Step-Up — RIGHT LEG FIRST", "sets": 2, "reps": "10/leg", "load": "BW · high step", "last": "High step, BW ×10 @2/2/1 RIR (9/21) 🟢", "rest": 90, "cue": "Two sets, right first, hands free with the rack there if you need it. Drive through the heel, stand fully tall, lower slowly. No bell this week.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Calf Raise", "sets": 2, "reps": "12", "load": "80", "last": "80×12 @3/3/3 RIR (9/21) 🟢", "rest": 60, "cue": "Two sets at 80. 1s pause at the top, 3s down.", "mus": ["calves"], "act": "Back of the lower leg. Pause at the top, slow 3s down."}, {"name": "Single-Leg Balance — RIGHT FIRST", "sets": 2, "reps": "60s/side", "load": "BW", "last": "Right 60s, left 60s (9/21) 🟢", "rest": 30, "cue": "Both sides hit 60 — repeat it. Hands on hips, eyes on one fixed point. Right in set 1, left in set 2. Type your seconds in the reps box. Eyes-closed version starts in Block 2.", "mus": ["core", "calves"], "act": "Quiet strength: calf and deep core making hundreds of tiny corrections. Soft knee, tall spine, breathe."}]}, {"id": "upA", "date": "2026-09-29", "title": "Upper A — Deload — 30 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "Two sets each, nothing new, the elbow gets the week off. Push-ups out, neutral grip in", "research": "Every set of chest press hit 10 at 40 last week for the first time — the 3×12 ticket is in sight, and Block 2's 6–8-rep version at 55 is the other road to the same place. Not this week. Two sets of each lift, four or more left, same weights. The right elbow has spoken three sessions running — push-ups on 9/22, then just holding a 10-lb bell at your chest on 9/2   catch(e){ CANSTORE=false; return MEM; } }
function save(){ try{ localStorage.setItem(CFG.key, JSON.stringify(S)); }

S.r = S.r||{}; S.x = S.x||{}; S.act = S.act||{}; S.gl = S.gl||{}; S.added = S.added||{}; S.f = S.f||{}; S.stp = S.stp||[];

const $ = id => document.getElementById(id);

function isoOf(ms){ const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return isoOf(Date.now()); }
function addDays(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoOf(d.getTime()); }
function dayName(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}); }
function mday(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'}); }
function doy(){ const d=new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0))/864e5); }
function minRep(r){ const m = String(r).match(/\d+/); return m?parseInt(m[0]):1; }
function num(v){ const n=parseFloat(v); return isFinite(n)?n:0; }
function fmtK(n){ return Math.round(n).toLocaleString('en-US'); }

const DATES = [...new Set(CFG.sessions.map(s=>s.date))].sort();
const WEEK = (function(){ const a=[]; let d=DATES[0]; const end=CFG.restDate||DATES[DATES.length-1]; while(d<=end && a.length<8){ a.push(d); d=addDays(d,1); } return a; })();
let CUR = WEEK.includes(todayISO()) ? todayISO() : WEEK[0];
let VIEW = 'week';
const FUEL = CFG.fuel || {on:false};
const EM = {grn:'🟢', yel:'🟡', red:'🔴'};

/* ---------- session status ---------- */
function sesStatus(s){
  const k = s.date + '|' + s.id;
  if(s.kind !== 'lift'){
    const a = S.act[k];
    return (a && a.done) ? {txt:'✓ done', cls:'done'} : {txt:'—', cls:''};
  }
  const x = S.x[k]; if(!x) return {txt:'—', cls:''};
  const total = s.ex.length;
  let n = 0;
  s.ex.forEach((e,i)=>{ const st=x[i]; if(st && st.sets && st.sets.some(t=>t&&t.t)) n++; });
  if(n===0) return {txt:'—', cls:''};
  return n>=total ? {txt:'✓ done', cls:'done'} : {txt:n+'/'+total+' lifts', cls:'part'};
}

/* ---------- render ---------- */
function render(){ VIEW==='week' ? renderWeek() : renderDay(); }
function goWeek(){ VIEW='week'; render(); window.scrollTo(0,0); }
function setDay(d){ CUR = d; VIEW='day'; render(); window.scrollTo(0,0); }

function renderWeek(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><div class="sys">C&amp;C Health OS</div></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari.</div>`;
  const all = CFG.sessions.length;

  h += `<div class="card"><div class="eyebrow">${esc(CFG.weekLabel||'This week')}</div>
    <div style="font-size:14px">${done} of ${all} sessions complete</div>
    <div class="prog"><i style="width:${all?Math.round(done/all*100):0}%"></i></div></div>`;
  WEEK.forEach(d=>{
    const today = d===todayISO();

      });

      h += `<div class="wks"><div><span class="dot"></span><span class="t" style="color:var(--dim)">${d===CFG.restDate?'Full rest — export Saturday, reset today':'Rest day — the fuel still counts'}</span></div></div>`;
    }
    if(FUEL.on) h += fuelLine(d);
    h += `</div>`;
  });
  if(FUEL.on) h += fuelReport();
  h += `<div class="card"><div class="eyebrow">Week close-out</div>
    <div class="small" style="margin-bottom:9px"><b>The ritual:</b> Saturday after the walk → Export week, paste to Claude. Sunday → Reset (lifts only — check-ins, fuel and staples are kept). Monday's file arrives reprogrammed.</div>

    <button class="btn" onclick="shareData()">Share…</button>
    <button class="btn ghost" onclick="resetWeek()">Reset week</button></div></div>`;
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

function renderDay(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><button class="home" onclick="goWeek()">‹ Week</button></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari. It works offline and remembers everything.</div>`;
  h += `<div class="chips">` + WEEK.map(d=>
    `<button class="chip ${d===CUR?'on':''}" onclick="setDay('${d}')">${dayName(d)} ${mday(d)}</button>`).join('') + `</div>`;
  h += readinessCard();
  h += lowBanner();
  if(FUEL.on) h += fuelCard();
  const todays = CFG.sessions.filter(s=>s.date===CUR);

  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;

}

/* ---------- fuel ---------- */
function fget(d){ S.f[d] = S.f[d]||{}; return S.f[d]; }
function fslot(d,id){ const f=fget(d); f[id]=f[id]||{p:'',k:'',c:'',t:'',it:[]}; return f[id]; }
function tms(d,t){ if(!t) return null; const x=new Date(d+'T'+t+':00').getTime(); return isFinite(x)?x:null; }
function hm12(t){ if(!t) return ''; const p=t.split(':'); let h=parseInt(p[0]); const m=p[1]; const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return h+':'+m+' '+ap; }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function setsOn(d){
  let first=null,last=null;
  Object.keys(S.x).forEach(k=>{ const x=S.x[k]; if(!x) return; Object.keys(x).forEach(i=>{ if(i==='note') return; const st=x[i]; if(!st||!st.sets) return;
    st.sets.forEach(t=>{ if(t&&t.t&&isoOf(t.t)===d){ if(first===null||t.t<first) first=t.t; if(last===null||t.t>last) last=t.t; } }); }); });
  const f = S.f[d];
  if(first){ if(f) f.so={first,last}; else S.f[d]={so:{first,last}}; return {first,last}; }
  if(f&&f.so&&f.so.first) return {first:f.so.first,last:f.so.last};
  return {first:null,last:null};
}
function dayKind(d){
  if(setsOn(d).first) return 'lift';
  if(CFG.sessions.some(s=>s.kind==='lift'&&s.date===d) && d>=todayISO()) return 'lift';
  return 'rest';
}
function actDone(d){ return CFG.sessions.some(s=>s.kind!=='lift'&&s.date===d&&(S.act[d+'|'+s.id]||{}).done); }
function fuelCalc(d){
  const f=S.f[d]||{}; const kind=dayKind(d); const so=setsOn(d);
  let P=0,K=0,C=0,n30=0,logged=false;
  FUEL.slots.concat([{id:'x'}]).forEach(sl=>{ const s=f[sl.id]; if(!s) return; const p=num(s.p),k=num(s.k),c=num(s.c);
    if(p||k||c) logged=true; P+=p; K+=k; C+=c; if(p>=FUEL.protMeal) n30++; });
  const burn = so.first ? FUEL.burn.lift : (kind==='lift' ? FUEL.burn.lift : (actDone(d)?FUEL.burn.act:0));
  const tgtK = kind==='lift'?FUEL.kcal.lift:FUEL.kcal.rest;
  const tgtC = kind==='lift'?FUEL.carbs.lift:FUEL.carbs.rest;
  const ea = logged ? (K-burn)/FUEL.ffm : null;
  const band = ea===null ? '' : (ea<FUEL.ea.red?'red':(ea<FUEL.ea.green?'yel':'grn'));
  const pre=f.pre||{}, post=f.post||{}, bed=f.bed||{};
  let preOk=null, preMin=null, postOk=null, postMin=null;
  if(kind==='lift'){
    const pt=tms(d,pre.t), qt=tms(d,post.t);
    if(so.first&&pt){ preMin=Math.round((so.first-pt)/60000); preOk=(preMin>=0&&preMin<=150); }
    if(so.last&&qt){ postMin=Math.round((qt-so.last)/60000); postOk=(postMin>=-5&&postMin<=45); }
  }
  const bedOk = num(bed.p)>=20;
  let st='';
  if(logged){ st = (P>=FUEL.prot && band==='grn') ? 'grn' : ((P>=FUEL.prot*0.8 && band!=='red') ? 'yel' : 'red'); }
  return {kind,P,K,C,n30,burn,tgtK,tgtC,ea,band,preOk,preMin,postOk,postMin,bedOk,logged,st,so,cr:!!f.cr,pre,post};
}
function eaText(c,today){
  if(c.ea===null) return `<b>Energy availability</b> shows once a feeding is logged. Under ${FUEL.ea.red} is the low-fuel line; ${FUEL.ea.green}+ is green. (intake − session burn) ÷ ${FUEL.ffm} kg lean mass.`;
  const calc = `<span style="color:var(--dim)">(${fmtK(c.K)} − ${c.burn} burn) ÷ ${FUEL.ffm} kg lean</span>`;
  if(today && c.band!=='grn'){
    const need = Math.ceil(FUEL.ea.green*FUEL.ffm + c.burn - c.K);
    return `<b>Energy availability so far ${c.ea.toFixed(0)}</b> — about <b>${fmtK(need)} kcal</b> more gets you to ${FUEL.ea.green} 🟢 by bedtime. ${calc}`;
  }
  const msg = {red:`under ${FUEL.ea.red} — the low-fuel line. Eat.`, yel:`${FUEL.ea.red}–${FUEL.ea.green-1} — better, not there. Carbs around the lift.`, grn:`${FUEL.ea.green}+ — fueled.`}[c.band];
  return `<b>Energy availability ${c.ea.toFixed(0)}</b> ${EM[c.band]} — ${msg} ${calc}`;
}
function timingText(c){
  const bed = c.bedOk ? '<b>✓</b>' : '—';
  if(c.kind!=='lift') return `Rest day · Pre-sleep protein ${bed}`;
  let pre, post;
  if(c.preOk===true) pre = `<b>✓ ${hm12(c.pre.t)}</b> (${c.preMin} min before the first set)`;
  else if(c.preOk===false) pre = `<b>✗</b> ${hm12(c.pre.t)} — ${c.preMin<0?'after the first set':'more than 2.5 h before'}`;
  else if(c.pre.t) pre = `⏱ ${hm12(c.pre.t)} — lift not logged yet`;
  else pre = c.so.first ? '<b>✗</b> none logged' : '—';
  if(c.postOk===true) post = `<b>✓ ${hm12(c.post.t)}</b> (${c.postMin} min after the last set)`;
  else if(c.postOk===false) post = `<b>⚠</b> ${hm12(c.post.t)} — ${c.postMin} min after the last set`;
  else if(c.post.t) post = `⏱ ${hm12(c.post.t)} — lift not logged yet`;
  else if(c.so.last){ const late=Math.round((Date.now()-c.so.last)/60000); post = late>45 ? `<b>✗</b> not logged — ${late} min since the last set` : `<b>window open</b> — ${45-late} min left`; }
  else post = '—';
  return `Pre-lift ${pre}<br>Post-lift ${post}<br>Pre-sleep protein ${bed}`;
}
function fuelCard(){
  const d=CUR; const c=fuelCalc(d); const f=fget(d);

  const kindLbl = c.kind==='lift'?'Lift day':'Rest day';
  const open = (f.ui===undefined) ? true : !!f.ui;
  const today = d===todayISO();
  let h = `<details ${open?'open':''} ontoggle="fui(this.open)"><summary id="fsum">${fuelSummary(c,kindLbl,today)}</summary>

    <div class="fbar"><div class="fbl"><span>Protein</span><span id="fp_txt">${c.P} / ${FUEL.prot} g · ${c.n30} of 4 feedings ≥ ${FUEL.protMeal}</span></div><div class="prog"><i id="fp_bar" style="width:${pct(c.P,FUEL.prot)}%"></i></div></div>
    <div class="fbar"><div class="fbl"><span>Energy</span><span id="fk_txt">${fmtK(c.K)} / ${fmtK(c.tgtK)} kcal · carbs ${c.C} g</span></div><div class="prog"><i class="k" id="fk_bar" style="width:${pct(c.K,c.tgtK)}%"></i></div></div>
    <div class="fea ${today&&c.band!=='grn'?'':c.band}" id="fea">${eaText(c,today)}</div>
    <div class="ftim" id="ftim">${timingText(c)}</div>
    <div class="row"><button class="btn ${c.cr?'acc':''}" onclick="fcr()">${c.cr?'✓ Creatine '+FUEL.creatine+' g taken':'Creatine '+FUEL.creatine+' g — tap when taken'}</button></div>`;
  FUEL.slots.forEach(sl=>{ h += slotRow(d,sl,c); });
  h += slotRow(d,{id:'x',l:'Anything else',when:'off-plan',p:'',c:'',cue:FUEL.extraCue},c);
  h += `<div class="small" style="margin-top:12px">${esc(FUEL.why)}</div>
  </div></details>`;
  return h;
}
function fuelSummary(c,kindLbl,today){
  const ea = c.ea===null ? '' : (today && c.band!=='grn' ? ' · EA '+c.ea.toFixed(0)+' so far' : ' · EA '+c.ea.toFixed(0)+' '+EM[c.band]);
  return `Fuel · ${kindLbl.toLowerCase()} · ${c.P} / ${FUEL.prot} g protein · ${fmtK(c.K)} / ${fmtK(c.tgtK)} kcal${ea}`;
}
function slotRow(d,sl,c){
  const s=fslot(d,sl.id); const open=(fget(d).open===sl.id);
  const p=num(s.p), k=num(s.k);
  const liftOnly = (sl.id==='pre'||sl.id==='post') && c.kind!=='lift';
  const tgt = sl.p ? `${esc(sl.p)} protein${sl.c?' · '+esc(sl.c)+' carbs':(sl.id==='mid'||sl.id==='din'?' · carbs + veg':'')}` : '';
  return `<div class="fslot ${p>=FUEL.protMeal?'hit':''} ${liftOnly?'dimm':''}" id="fs_${sl.id}">
    <div class="fsh"><div><b>${esc(sl.l)}</b><span class="fwhen">${esc(liftOnly?'lift days only':sl.when)}</span></div><div class="fpk" id="fpk_${sl.id}">${p?p+' g':''}${p&&k?' · ':''}${k?fmtK(k)+' kcal':''}</div></div>
    ${tgt?`<div class="ftgt">${tgt}</div>`:''}
    <div class="fin">
      <input inputmode="numeric" placeholder="protein g" value="${esc(s.p)}" onchange="fset('${sl.id}','p',this.value)">
      <input inputmode="numeric" placeholder="kcal" value="${esc(s.k)}" onchange="fset('${sl.id}','k',this.value)">
      <input inputmode="numeric" placeholder="carbs g" value="${esc(s.c)}" onchange="fset('${sl.id}','c',this.value)">
    </div>
    <div class="fin2">
      <input type="time" value="${esc(s.t)}" onchange="fset('${sl.id}','t',this.value)">
      <button class="btn fx ${s.t?'on':''}" onclick="fnow('${sl.id}')">${s.t?'✓ Ate':'Ate now'}</button>
    </div>
    ${s.it&&s.it.length?`<div class="fit">${s.it.map(esc).join(' · ')}</div>`:''}
    <div class="row"><button class="btn ghost" onclick="fopen('${sl.id}')">${open?'Done adding':'＋ Add food'}</button>${(p||k||s.t)?`<button class="btn ghost" onclick="fclear('${sl.id}')">Clear</button>`:''}</div>
    ${open?picker(sl.id):''}
    ${sl.cue?`<div class="cue">Coach: ${esc(sl.cue)}</div>`:''}
  </div>`;
}
function picker(id){
  const all = (S.stp||[]).concat(FUEL.staples);
  return `<div class="fpick">${all.map((x,i)=>`<button class="fchip" onclick="fadd('${id}',${i})">${esc(x.n)}<span>${x.p}p · ${x.k}</span></button>`).join('')}
    <button class="fchip new" onclick="fnew('${id}')">＋ My staple…</button></div>`;
}
function fuelRefresh(){
  const c=fuelCalc(CUR); const pct=(a,b)=>Math.min(100,Math.round(a/b*100));
  const kindLbl = c.kind==='lift'?'Lift day':'Rest day'; const today = CUR===todayISO();
  const set=(id,v)=>{ const e=$(id); if(e) e.innerHTML=v; };
  set('fsum', fuelSummary(c,kindLbl,today));
  set('fp_txt', `${c.P} / ${FUEL.prot} g · ${c.n30} of 4 feedings ≥ ${FUEL.protMeal}`); if($('fp_bar')) $('fp_bar').style.width=pct(c.P,FUEL.prot)+'%';
  set('fk_txt', `${fmtK(c.K)} / ${fmtK(c.tgtK)} kcal · carbs ${c.C} g`); if($('fk_bar')) $('fk_bar').style.width=pct(c.K,c.tgtK)+'%';
  if($('fea')){ $('fea').className='fea '+(today&&c.band!=='grn'?'':c.band); $('fea').innerHTML=eaText(c,today); }
  set('ftim', timingText(c));
  FUEL.slots.concat([{id:'x'}]).forEach(sl=>{ const s=fslot(CUR,sl.id); const p=num(s.p),k=num(s.k);
    set('fpk_'+sl.id, `${p?p+' g':''}${p&&k?' · ':''}${k?fmtK(k)+' kcal':''}`);
    const e=$('fs_'+sl.id); if(e){ e.classList.toggle('hit', p>=FUEL.protMeal); } });
}
function fset(id,fld,v){ const s=fslot(CUR,id); s[fld]=v; save(); fuelRefresh(); }
function fnow(id){ const s=fslot(CUR,id); s.t=nowHM(); save(); render(); }
function fclear(id){ if(!confirm('Clear this feeding?')) return; const s=fslot(CUR,id); s.p='';s.k='';s.c='';s.t='';s.it=[]; save(); render(); }
function fopen(id){ const f=fget(CUR); f.open = (f.open===id)?null:id; save(); render(); }
function fadd(id,i){
  const all=(S.stp||[]).concat(FUEL.staples); const x=all[i]; if(!x) return;
  const s=fslot(CUR,id);
  s.p=String(Math.round(num(s.p)+num(x.p))); s.k=String(Math.round(num(s.k)+num(x.k))); s.c=String(Math.round(num(s.c)+num(x.c)));
  s.it=(s.it||[]).concat([x.n]); if(!s.t && CUR===todayISO()) s.t=nowHM();
  save(); render();
}
function fnew(id){
  const raw = prompt('Your staple — name, protein g, kcal, carbs g\n(e.g. Turkey wrap, 28, 350, 30)'); if(!raw) return;
  const parts = raw.split(',').map(s=>s.trim()); if(parts.length<3 || !parts[0]){ alert('Need at least: name, protein, kcal'); return; }
  const x={n:parts[0], p:num(parts[1]), k:num(parts[2]), c:num(parts[3]||0)};
  S.stp.unshift(x); save(); fadd(id,0);
}
function fcr(){ const f=fget(CUR); f.cr = f.cr?0:1; save(); render(); }
function fui(o){ const f=fget(CUR); const v=o?1:0; if(f.ui!==v){ f.ui=v; save(); } }
function fuelLine(d){
  const c=fuelCalc(d); const past = d < todayISO();
  const txt = c.logged ? `P ${c.P} · ${fmtK(c.K)} kcal · EA ${c.ea.toFixed(0)}${past&&c.st?' '+EM[c.st]:''}` : (past?'not logged':'—');
  return `<div class="wks"><div><span class="dot Fuel"></span><span class="t">Fuel</span>
    <div class="sub2" style="margin-left:15px">${c.kind==='lift'?'lift day · '+fmtK(FUEL.kcal.lift):'rest day · '+fmtK(FUEL.kcal.rest)} kcal · ${FUEL.prot} g</div></div>
    <div class="st ${past?c.st:''}">${txt}</div></div>`;
}
function fuelStats(){
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const days = WEEK.map(d=>({d,c:fuelCalc(d)}));
  const logged = days.filter(o=>o.c.logged);
  const lifted = days.filter(o=>o.c.so.first);
  const bw = WEEK.map(d=>num((S.r[d]||{}).bw)).filter(v=>v>0);
  const rec = WEEK.map(d=>num((S.r[d]||{}).rec)).filter(v=>v>0);
  return {
    n: logged.length, lifts: lifted.length,
    P: avg(logged.map(o=>o.c.P)), K: avg(logged.map(o=>o.c.K)), EA: avg(logged.map(o=>o.c.ea)),
    pDays: logged.filter(o=>o.c.P>=FUEL.protDay).length, n30: avg(logged.map(o=>o.c.n30)),
    pre: lifted.filter(o=>o.c.preOk===true).length, post: lifted.filter(o=>o.c.postOk===true).length,
    bed: logged.filter(o=>o.c.bedOk).length, cr: days.filter(o=>o.c.cr).length,
    bw0: bw.length?bw[0]:null, bw1: bw.length?bw[bw.length-1]:null, rec: avg(rec)
  };
}
function fuelReport(){
  const s = fuelStats();
  if(!s.n && !s.cr) return `<div class="card fuel"><div class="eyebrow">Fuel report · this week</div><div class="small">Nothing logged yet. Tap a day, open Fuel, log what you eat. Four feedings of 30 g protein is the whole assignment.</div></div>`;
  const eaB = s.EA===null?'':(s.EA<FUEL.ea.red?'red':(s.EA<FUEL.ea.green?'yel':'grn'));
  return `<div class="card fuel"><div class="eyebrow">Fuel report · this week</div><div class="frep">
    <span class="k">Protein</span><span>avg <b>${s.P===null?'—':Math.round(s.P)+' g'}</b> · <b>${s.pDays}/${s.n}</b> days ≥ ${FUEL.protDay} · <b>${s.n30===null?'—':s.n30.toFixed(1)}</b> feedings ≥ ${FUEL.protMeal}/day</span>
    <span class="k">Energy</span><span>avg <b>${s.K===null?'—':fmtK(s.K)+' kcal'}</b> · EA avg <b>${s.EA===null?'—':s.EA.toFixed(0)}</b> ${EM[eaB]||''}</span>
    <span class="k">Timing</span><span>pre-lift <b>${s.pre}/${s.lifts}</b> · post-lift <b>${s.post}/${s.lifts}</b> · pre-sleep <b>${s.bed}/${s.n}</b></span>
    <span class="k">Creatine</span><span><b>${s.cr}/7</b> · BW <b>${s.bw0===null?'—':s.bw0+' → '+s.bw1}</b> · Whoop rec avg <b>${s.rec===null?'—':Math.round(s.rec)+'%'}</b></span>
  </div>${WEEK.includes(todayISO())&&fuelCalc(todayISO()).logged?`<div class="small" style="margin-top:8px">Today is counted as logged so far — the averages settle by bedtime.</div>`:''}</div>`;
}

/* ---------- rest timer ---------- */
let TINT = null;
function startTimer(sec, nextSet){
  stopTimer();
  const end = Date.now() + sec*1000;
  $('timer').style.display = 'block';
  $('tlab').textContent = 'Rest · set ' + nextSet + ' next · target ' + fmtRest(sec);
  TINT = setInterval(()=>{
    const left = Math.max(0, end - Date.now());
    const s = Math.ceil(left/1000);
    $('tclock').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    $('tbar').style.width = (left/(sec*1000)*100)+'%';
    if(left<=0){ $('tclock').textContent = 'GO'; clearInterval(TINT);
      if(navigator.vibrate) navigator.vibrate([120,60,120]); }
  }, 250);
}
function stopTimer(){ if(TINT) clearInterval(TINT); $('timer').style.display='none'; }

/* ---------- export ---------- */
function tmark(ok){ return ok===true?'✓':(ok===false?'✗':'—'); }
function buildExport(){
  let out = CFG.name.toUpperCase() + ' — C&C LOG EXPORT — ' + new Date().toLocaleString() + '\n' + (CFG.weekLabel||'') + '\n';
  Object.keys(S.r).sort().forEach(d=>{
    const r = S.r[d]; const has = Object.values(r).some(v=>v);
    if(!has) return;
    out += '\n' + d + ' readiness: E' + (r.e||'-') + ' So' + (r.so||'-') + ' Sl' + (r.sl||'-') + ' M' + (r.m||'-');
    if(r.bw) out += ' | BW ' + r.bw;
    if(r.slh) out += ' | sleep ' + r.slh + 'h';
    if(CFG.whoop && (r.rec||r.hrv)) out += ' | Whoop rec ' + (r.rec||'-') + '% HRV ' + (r.hrv||'-') + ' RHR ' + (r.rhr||'-') + ' strain ' + (r.strain||'-');
  });
  if(FUEL.on){
    let fl = '';
    Object.keys(S.f).sort().forEach(d=>{
      const c = fuelCalc(d); if(!c.logged && !c.cr) return;
      fl += '\n' + d + ' fuel [' + c.kind + ']: P ' + c.P + 'g (' + c.n30 + '×' + FUEL.protMeal + '+) | ' + fmtK(c.K) + ' kcal | C ' + c.C + 'g | EA ' + (c.ea===null?'-':c.ea.toFixed(0)) + ' ' + (EM[c.band]||'');
      if(c.kind==='lift') fl += ' | pre ' + tmark(c.preOk) + (c.preMin!==null?' ('+c.preMin+' min before)':'') + ' | post ' + tmark(c.postOk) + (c.postMin!==null?' ('+c.postMin+' min after)':'');
      fl += ' | bed ' + (c.bedOk?'✓':'—') + ' | creatine ' + (c.cr?'✓':'—');
      const f = S.f[d];
      const parts = FUEL.slots.concat([{id:'x',l:'extra'}]).map(sl=>{ const s=f[sl.id]; if(!s||!(num(s.p)||num(s.k))) return null;
        return sl.id + (s.t?' '+hm12(s.t):'') + ' P' + num(s.p) + '/' + fmtK(num(s.k)) + (s.it&&s.it.length?' ['+s.it.join(', ')+']':''); }).filter(Boolean);
      if(parts.length) fl += '\n   ' + parts.join(' · ');
    });
    if(fl){
      const s = fuelStats();
      out += '\n' + fl;
      out += '\n\nFUEL WEEK: protein avg ' + (s.P===null?'-':Math.round(s.P)+'g') + ' · ≥' + FUEL.protDay + 'g on ' + s.pDays + '/' + s.n + ' logged days · ' + (s.n30===null?'-':s.n30.toFixed(1)) + ' feedings≥' + FUEL.protMeal + '/day · kcal avg ' + (s.K===null?'-':fmtK(s.K)) + ' · EA avg ' + (s.EA===null?'-':s.EA.toFixed(0)) + ' · pre-lift ' + s.pre + '/' + s.lifts + ' · post-lift ' + s.post + '/' + s.lifts + ' · pre-sleep ' + s.bed + '/' + s.n + ' · creatine ' + s.cr + '/7 · BW ' + (s.bw0===null?'-':s.bw0+'→'+s.bw1) + ' · rec avg ' + (s.rec===null?'-':Math.round(s.rec)+'%');
    }
  }
  CFG.sessions.forEach(s=>{
    const k = s.date + '|' + s.id;
    if(s.kind==='lift'){
      const x = S.x[k]; if(!x) return;
      let lines = '';
      const extras = S.added[k]||[];
      const names = s.ex.map(e=>e.name).concat(extras);
      names.forEach((nm,i)=>{
        const st = x[i]; if(!st || (!st.sets.length && !st.c && !st.tag)) return;
        const done = st.sets.filter(t=>t&&(t.t||t.w||t.r));
        const setsTxt = done.map(t=>(t.w||'?')+'×'+(t.r||'?')+'@'+(!t.rir?'?':t.rir)+'RIR'+(t.t?'':'(unchecked)')).join(', ');
        const rests = done.map(t=>t.rest).filter(v=>v);
        const avgRest = rests.length ? Math.round(rests.reduce((a,b)=>a+b,0)/rests.length) : null;
        const tEx = (s.ex[i]||{});
        lines += '  ' + nm + (st.sub?' →SUB: '+st.sub:'') + ': ' + (setsTxt||'(no sets)');
        if(avgRest) lines += ' | avg rest ' + avgRest + 's (target ' + (tEx.rest||90) + 's)';
        if(S.gl[nm]) lines += ' | 🟢';
        if(st.tags&&st.tags.length) lines += ' | TAGS: ' + st.tags.join(',');
        if(st.c) lines += ' | "' + st.c + '"';
        lines += '\n';
      });
      if(lines){ out += '\n\n' + s.date + ' · ' + s.title + '\n' + lines; if(x.note) out += '  Session note: "' + x.note + '"\n'; }
    } else {
      const a = S.act[k]; if(!a || (!a.done && !a.dur && !a.c)) return;
      out += '\n\n' + s.date + ' · ' + s.title + ': ' + (a.done?'DONE':'logged') +
        (a.dur?' · '+a.dur+' min':'') + (a.dist?' · '+a.dist:'') + (a.feel?' · felt '+a.feel+'/5':'') + (a.c?' · "'+a.c+'"':'');
    }
  });
  out += '\n\n---JSON---\n' + JSON.stringify(S);
  return out;
}
function exportData(){
  const t = buildExport();
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>{}); ok = true; }
  alert(ok ? 'Log copied. Paste it to Claude.' : 'Copy failed — use Share instead.');
}
function shareData(){
  const t = buildExport();
  if(navigator.share){ navigator.share({title:CFG.name+' training log', text:t}); }
  else exportData();
}
function resetWeek(){
  if(!confirm('Reset for the new week? This clears the week\'s lifts and activities. Check-ins, fuel logs, staples and green lights are kept. Export first.')) return;
  S.x={}; S.act={}; S.added={}; save(); VIEW='week'; render();
  alert('Clean slate for the lifts. Check-ins and fuel history carried forward. See you Monday.');
}

render();
</script>
</body>
