<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cass // Rise · Week 5 · C&C Health OS</title>
<style>
:root{
  --bg:#171216; --panel:#201823; --panel2:#191219; --ink:#F0E9EE; --dim:#9A8E99;
  --acc:#E0828A; --acc2:#C9A0C4; --good:#6FBF73; --warn:#E2B93B; --bad:#D96A5F; --line:#332838;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:16px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 120px}
.hdr{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 2px}
.brand{font-family:'Avenir Next Condensed','Arial Narrow','HelveticaNeue-CondensedBold',sans-serif;
  font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:26px;color:var(--ink)}
.brand b{color:var(--acc)}
.sys{font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:var(--dim);
  font-size:13px;font-weight:600;background:var(--panel)}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:6px}
.mission{border-left:3px solid var(--acc)}
.mission .p{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:20px;line-height:1.25;margin:2px 0 8px;text-transform:uppercase;letter-spacing:.02em}
.mission .r{font-size:13px;color:var(--dim);line-height:1.45}
.mission .m{font-size:14px;color:var(--acc2);font-style:italic;margin-top:9px;line-height:1.4}
.stitle{display:flex;justify-content:space-between;align-items:center;margin:18px 0 4px}
.stitle h2{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-size:19px;margin:0;
  text-transform:uppercase;letter-spacing:.05em}
.tag{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.exc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exname{font-weight:700;font-size:16.5px;line-height:1.25}
.sub{color:var(--warn);font-size:12.5px;font-weight:600}
.target{font-size:13px;color:var(--acc);font-weight:600;margin-top:3px}
.last{font-size:12px;color:var(--dim);margin-top:3px}
.cue{font-size:12.5px;color:var(--dim);margin-top:6px;padding:7px 9px;background:var(--panel2);
  border-radius:8px;line-height:1.4}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 74px 44px;gap:7px;align-items:center;margin-top:8px}
.setrow .n{color:var(--dim);font-size:12px;text-align:center}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
  padding:10px 8px;font-size:16px;width:100%}
textarea{min-height:44px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.ck{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);
  font-size:18px;font-weight:700}
.ck.done{background:var(--good);border-color:var(--good);color:#10130f}
.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;
  padding:9px 12px;font-size:13px;font-weight:600}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn.ghost{color:var(--dim)}
.gl{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--good);font-weight:700}
.tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tg{flex:1 1 28%;text-align:center;padding:9px 4px;border-radius:9px;border:1px solid var(--line);
  color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.03em}
.tg.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.tg.on.sore{background:#3d3a22;color:var(--warn);border-color:var(--warn)}
.tg.on.hurt{background:#41291f;color:#E59866;border-color:#E59866}
.tg.on.pain{background:#3f2320;color:var(--bad);border-color:var(--bad)}
.mfig{margin-top:9px;background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.mfig .act{font-size:12.5px;color:var(--acc2);margin-top:6px;line-height:1.4;text-align:left}
.mreg{fill:#2a3230;stroke:none}
.mreg.hot{fill:var(--acc)}
.mbody{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.55}
.subs{margin-top:9px;background:var(--panel2);border-radius:10px;padding:10px}
.subs .so{padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px}
.subs .so:last-child{border-bottom:none}
.rd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 2px}
.rb{padding:10px 0;text-align:center;border:1px solid var(--line);border-radius:9px;color:var(--dim);
  font-weight:700;background:var(--panel2)}
.rb.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.lbl{font-size:12px;color:var(--dim);margin-top:10px;letter-spacing:.06em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.banner{background:#3a2f1d;border:1px solid var(--warn);color:var(--warn);border-radius:12px;
  padding:11px;font-size:13px;line-height:1.4;margin:10px 0}
.adjust{background:var(--panel2);border-left:3px solid var(--warn);border-radius:10px;padding:11px;
  font-size:13px;color:var(--ink);margin:10px 0;line-height:1.45}
#timer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--acc);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;z-index:50}
#timer .tin{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
#tclock{font-family:'Avenir Next Condensed','Arial Narrow',monospace;font-size:30px;font-weight:800;color:var(--acc)}
#tbarw{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
#tbar{height:100%;background:var(--acc);width:100%}
#tlab{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.foot{margin-top:22px;text-align:center;color:var(--dim);font-size:11.5px;letter-spacing:.06em}
details summary{cursor:pointer;color:var(--acc);font-size:13px;font-weight:600;letter-spacing:.04em}
details .card{margin-top:8px}
.small{font-size:12.5px;color:var(--dim);line-height:1.45}
h3.sect{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;text-transform:uppercase;
  letter-spacing:.08em;font-size:15px;margin:16px 0 4px;color:var(--acc2)}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:9px 0}
.wk.today{border-color:var(--acc)}
.wkh{display:flex;justify-content:space-between;align-items:baseline}
.wkd{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:17px;
  text-transform:uppercase;letter-spacing:.06em}
.wk.today .wkd{color:var(--acc)}
.wkdate{font-size:12px;color:var(--dim)}
.wks{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px}
.wks .t{color:var(--ink)}
.wks .sub2{color:var(--dim);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.wks .st{font-weight:700;font-size:12.5px;color:var(--dim)}
.wks .st.done{color:var(--good)}
.wks .st.part{color:var(--warn)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--dim);vertical-align:1px}
.dot.Strength{background:var(--acc)} .dot.Mobility{background:var(--acc2)}
.dot.Walk{background:#7FB2C9} .dot.Zone2{background:#7FB2C9}
.prog{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--good)}
.home{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:10px;
  padding:8px 12px;font-size:13px;font-weight:700}
.done-big{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;border:1px solid var(--acc);background:transparent;color:var(--acc)}
.done-big.on{background:var(--good);border-color:var(--good);color:#10130f}
</style>
</head>

<script>
const CFG = {"name": "Cassandra", "brand": "CASS <b>// RISE</b>", "tag": "Stronger every decade", "key": "cchos_cass_v1", "whoop": true, "motiv": ["Every rep today is bone you keep at 70.", "Strong is a skill. You're learning it — ahead of schedule.", "24 sit-to-stands in 30 seconds. 'Not strong' was never true.", "Muscle is your retirement account. Today's a deposit.", "Form first. Weight follows. Always.", "You walk the beach. Now you'll own it.", "Perimenopause changes the rules. Lifting rewrites them — that's research, not a slogan.", "Your future self is watching this set. Make her proud.", "Little hinges swing big doors. Today, literally.", "Done beats perfect. Logged beats done.", "Forty-five minutes. Rest the clock, log the truth.", "Left and right take turns. The weaker one goes first.", "Four for four again. Sixteen lifts in four weeks — that's a habit now.", "When the machine jumps too far, add a rep. Reps are plates too.", "The clock rests you. Tap it every set.", "Four days in a row this week. Upper, lower, upper, lower — each one rests the other."], "sessions": [{"id": "lowA", "date": "2026-09-15", "title": "Lower A — 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "Every lower lift was 🟢 with 2–4 in the tank. Same rule as last week: smallest step, everywhere", "research": "Week 4 was your best yet — every set logged, every set green, and you lifted Monday on a 35% Whoop recovery and still hit the numbers. That's the adaptation showing up. This week is four days straight (Tue–Fri) instead of Mon/Tue/Thu/Fri; upper and lower alternate so each day rests the other, and the research on consecutive-day training says it works fine when the muscles don't repeat (Schoenfeld 2016 frequency meta-analysis). Your balance note was the headline: right 40s, left 40s — the right side caught up. Bar hang is now an official card because you added it yourself and it's exactly what your grip and shoulders need.", "warmup": "5 min: brisk walk in, bodyweight squats ×10, glute bridges ×10, hip hinge drill with hands on hips ×10 (butt back, flat back), single-leg stand 15s each.", "ex": [{"name": "Goblet Squat", "sets": 3, "reps": "10", "load": "45", "last": "40×10 @3/3/2 RIR (9/7) 🟢", "rest": 90, "cue": "Up to 45. Chest proud, elbows inside the knees, full depth, slow down. Three in the tank at 40 means 45 is ready. If the third set gets ugly, back to 40 for it.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Cable Pull-Through", "sets": 3, "reps": "12", "load": "27.5–30", "last": "25×12 @3/2/2 RIR (9/7) 🟢", "rest": 90, "cue": "Face away, rope between the legs, butt back toward the machine, flat back, stand and squeeze. 27.5 for the first two, 30 on the third if the glutes — not the back — are doing it. Your rests ran 130s here; 90 is enough.", "mus": ["glutes", "hamstrings"], "act": "The butt. Squeeze it hard at the top of every rep — if you feel it in your lower back instead, don't lift as high."}, {"name": "Leg Press", "sets": 3, "reps": "10", "load": "120", "last": "110×10 @4/4/3 RIR (9/7) 🟢", "rest": 90, "cue": "Feet mid-platform, hip-width, lower to 90°, push through the whole foot. One plate up to 120 — four in the tank at 110 is plenty of room. Full 90.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Step-Up — RIGHT LEG FIRST", "sets": 3, "reps": "8/leg", "load": "12.5/db", "last": "10/db ×8 @4/4/3 RIR (9/7) 🟢", "rest": 90, "cue": "12.5s in each hand. Knee-height box, drive through the heel, stand fully tall, lower slowly. Right first. If the 12.5s aren't on the rack, 10s for 10 reps is the same step.", "mus": ["quads", "glutes"], "act": "Front of the thighs + the butt. Touch the top of your thighs before the set — those drive you up. Push the floor away."}, {"name": "Calf Raise", "sets": 3, "reps": "12", "load": "70", "last": "60×12 @6+/6+/5 RIR (9/7) 🟢", "rest": 60, "cue": "Six-plus in the tank is a warm-up. Up to 70 — bigger jump than usual because this one has room. 1s pause at the top, 3s down. Third set stays.", "mus": ["calves"], "act": "Back of the lower leg. Pause at the top, slow 3s down."}, {"name": "Bar Hang", "sets": 3, "reps": "15-20s", "load": "BW", "last": "12s / 13s / 15s (9/7) — you added this one", "rest": 60, "cue": "Dead hang from the pull-up bar, shoulders relaxed down (not shrugged up), feet off the floor. Aim 15s each, 20s on the last if the grip holds. Type your seconds in the reps box. This is grip, shoulders, and spine decompression in one move.", "mus": ["lats", "core"], "act": "Forearms and the hands first; then the shoulders letting go. Breathe slow — the longer you relax, the longer you hang."}, {"name": "Single-Leg Balance — RIGHT FIRST", "sets": 2, "reps": "45s/side", "load": "BW", "last": "Right 40s, left 40s ×2 (9/7) 🟢 — right side caught up", "rest": 30, "cue": "Hands on hips, eyes on one fixed point. Right and left matched last week — that's the asymmetry closing. Push both to 45s. Type your seconds in the reps box (right in set 1, left in set 2).", "mus": ["core", "calves"], "act": "Quiet strength: calf and deep core making hundreds of tiny corrections. Soft knee, tall spine, breathe."}]}, {"id": "upA", "date": "2026-09-16", "title": "Upper A — 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "Row and pulldown are ready to move. Chest press holds — the reps ran out before the plates did", "research": "Chest press went 40×10 @2/1/0 on a 46% recovery day — that's the cue to hold the plate, not chase 55. A set at 0 RIR the day after a hard Lower A isn't a strength loss; it's fatigue, and it clears. Rows and pulldowns are the opposite story: 2–3 in the tank on every set, and you already own 60×8 on the row from 9/1. Pull strength is climbing faster than push strength right now, which is normal and good for your posture — back muscles respond quickly when they've been under-used for years.", "warmup": "5 min: arm circles ×10 each way, band pull-aparts ×15, wall push-ups ×10, then one easy set of chest press at 20.", "ex": [{"name": "Machine Chest Press", "sets": 3, "reps": "10-12", "load": "40", "last": "40×10/10/9 @2/1/0 RIR (9/8) 🟢", "rest": 90, "cue": "Same 40. Blades pinned, smooth press. Target is 10–12 with 2 left — last week the third set hit zero, so stop the set when the reps stop looking the same. 3×12 @2 is the ticket to 55.", "mus": ["chest", "triceps"], "act": "Chest. Hand flat on your chest — that muscle does the pressing. Shoulders down and back."}, {"name": "Seated Row", "sets": 3, "reps": "8", "load": "60", "last": "48×12 @3/2/2 RIR (9/8) 🟢", "rest": 90, "cue": "48×12 is done — move to 60 for 8 on all three. You did 60×8 @2 once already on 9/1, so this is a known number. Slow return, squeeze the blades to start every pull. If set 3 falls apart, 48×12 for it.", "mus": ["lats", "upperback", "biceps"], "act": "Mid-back, between the shoulder blades. Start every pull by squeezing them together, then the arms follow."}, {"name": "Lat Pulldown", "sets": 3, "reps": "10", "load": "45–50", "last": "40×10 @2 RIR ×3 (9/8) 🟢", "rest": 90, "cue": "Up one plate — 45 if the stack has it, 50 if it jumps. Grip a bit wider than shoulders, lean back slightly, pull the bar to your collarbone by driving the elbows down. If 50 is too much for 10, 40×12 is the same step.", "mus": ["lats", "upperback", "biceps"], "act": "Mid-back, between the shoulder blades. Start every pull by squeezing them together, then the arms follow."}, {"name": "Seated DB Shoulder Press", "sets": 3, "reps": "10", "load": "10/db", "last": "10/db ×8 @2 RIR ×3 (9/8) 🟢", "rest": 90, "cue": "10s stay, reps go to 10. Back on the pad, bells at ear height, press up and slightly in. Ten clean reps on all three → 12.5s next week.", "mus": ["shoulders"], "act": "Top of the shoulders. Light weight, no swinging — if you have to swing, it's too heavy."}, {"name": "Incline Push-up (24\" bar)", "sets": 3, "reps": "12", "load": "BW", "last": "3×12 @3/2/1 RIR (9/8) 🟢", "rest": 60, "cue": "Same bar, 3×12. Straight line, chest to bar, glutes tight. When all three sets have 2 left, one notch lower on the rack — not before.", "mus": ["chest", "triceps"], "act": "Chest. Hand flat on your chest — that muscle does the pressing. Shoulders down and back."}, {"name": "Dead Bug", "sets": 2, "reps": "12/side", "load": "BW", "last": "2×10 @3/2 RIR (9/8) 🟢", "rest": 45, "cue": "Twelve a side. Low back gently into the floor, slow reach, exhale on the reach. If the back arches, shorten the reach.", "mus": ["core"], "act": "Deep belly. Ribs down, low back gently pressed toward the floor. Breathe the whole time."}]}, {"id": "lowB", "date": "2026-09-17", "title": "Lower B — 45 min", "time": "Solo", "kind": "lift", "badge": "Strength", "why": "'No knee pain' with full rests — that was the fix. RDL takes its 2.5-lb step. Bridge gets the bigger plate", "research": "Last week's split squats with full 90-second rests: no knee pain. Same exercise, same reps, same bodyweight — the only variable was rest. That's your knee telling you fatigue is the trigger, not the movement. Keep the rests and it stays quiet. The RDL at 12.5 had 4 in the tank and no back note, so it earns 15 — still the slowest-progressing lift on the sheet on purpose; the hinge pattern is worth more than the number. Third day of four: if you walk in tired, drop one set from the leg press and the machines, keep everything else.", "warmup": "5 min: brisk walk in, glute bridges ×12, hip hinge drill with a dowel or broomstick ×10 (stick touches head, upper back, tailbone), bodyweight squats ×10.", "ex": [{"name": "DB RDL — light, form checklist", "sets": 3, "reps": "8", "load": "15/db", "last": "12.5/db ×8 @4 RIR ×3 (9/10) 🟢", "rest": 90, "cue": "Checklist every set: (1) butt back, not down; (2) soft knees; (3) /* ---------- storage (safe) ---------- */
let MEM = {}; let CANSTORE = true;
function load(){ try{ const s = localStorage.getItem(CFG.key); return s?JSON.parse(s):{}; }
  catch(e){ CANSTORE=false; return MEM; } }
function save(){ try{ localStorage.setItem(CFG.key, JSON.stringify(S)); }
  catch(e){ CANSTORE=false; MEM = S; } }
let S = load();
S.r = S.r||{}; S.x = S.x||{}; S.act = S.act||{}; S.gl = S.gl||{}; S.added = S.added||{};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayName(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}); }
function mday(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'}); }
function doy(){ const d=new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0))/864e5); }
function minRep(r){ const m = String(r).match(/\d+/); return m?parseInt(m[0]):1; }

const DATES = [...new Set(CFG.sessions.map(s=>s.date))].sort();
let CUR = DATES.includes(todayISO()) ? todayISO() : DATES[0];
let VIEW = 'week';

/* ---------- session status ---------- */
function sesStatus(s){
  const k = s.date + '|' + s.id;
  if(s.kind !== 'lift'){
    const a = S.act[k];
    return (a && a.done) ? {txt:'✓ done', cls:'done'} : {txt:'—', cls:''};
  }
  const x = S.x[k]; if(!x) return {txt:'—', cls:''};
  const total = s.ex.length;
  let n = 0;
  s.ex.forEach((e,i)=>{ const st=x[i]; if(st && st.sets && st.sets.some(t=>t&&t.t)) n++; });
  if(n===0) return {txt:'—', cls:''};
  return n>=total ? {txt:'✓ done', cls:'done'} : {txt:n+'/'+total+' lifts', cls:'part'};
}

/* ---------- render ---------- */
function render(){ VIEW==='week' ? renderWeek() : renderDay(); }
function goWeek(){ VIEW='week'; render(); window.scrollTo(0,0); }
function setDay(d){ CUR = d; VIEW='day'; render(); window.scrollTo(0,0); }

function renderWeek(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><div class="sys">C&amp;C Health OS</div></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari.</div>`;
  const all = CFG.sessions.length;
  const done = CFG.sessions.filter(s=>sesStatus(s).cls==='done').length;
  h += `<div class="card"><div class="eyebrow">Week 5 · Sep 15 – 18 · 4 lifts Tue–Fri, 45 min</div>
    <div style="font-size:14px">${done} of ${all} sessions complete</div>
    <div class="prog"><i style="width:${all?Math.round(done/all*100):0}%"></i></div></div>`;
  DATES.forEach(d=>{
    const today = d===todayISO();
    const ss = CFG.sessions.filter(s=>s.date===d);
    h += `<div class="wk ${today?'today':''}" onclick="setDay('${d}')">
      <div class="wkh"><div class="wkd">${dayName(d)}${today?' · today':''}</div><div class="wkdate">${mday(d)}</div></div>`;
    ss.forEach(s=>{
      const st = sesStatus(s);
      h += `<div class="wks"><div><span class="dot ${(s.badge||'').replace(' ','')}"></span><span class="t">${esc(s.title)}</span>
        <div class="sub2" style="margin-left:15px">${esc(s.time||'')}</div></div>
        <div class="st ${st.cls}">${st.txt}</div></div>`;
    });
    h += `</div>`;
  });
  h += `<div class="wk" onclick="void(0)"><div class="wkh"><div class="wkd" style="color:var(--dim)">Sun · rest</div><div class="wkdate">${mday(CFG.restDate||DATES[DATES.length-1])}</div></div>
    <div class="wks"><div><span class="dot"></span><span class="t" style="color:var(--dim)">Full rest — export Saturday, reset today</span></div></div></div>`;
  h += `<div class="card"><div class="eyebrow">Week close-out</div>
    <div class="small" style="margin-bottom:9px"><b>The ritual:</b> Saturday after the lift → Export week, paste to Claude. Sunday → Reset. Monday's files arrive reprogrammed.</div>
    <div class="row"><button class="btn acc" onclick="exportData()">Export week &amp; copy</button>
    <button class="btn" onclick="shareData()">Share…</button>
    <button class="btn ghost" onclick="resetWeek()">Reset week</button></div></div>`;
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

function renderDay(){
  const a = $('app'); let h = '';
  h += `<div class="hdr"><div class="brand">${CFG.brand}</div><button class="home" onclick="goWeek()">‹ Week</button></div>`;
  if(!CANSTORE) h += `<div class="banner">Preview mode — data will NOT save here. Save this file to your phone (Files app), then open it in Safari. It works offline and remembers everything.</div>`;
  h += `<div class="chips">` + DATES.map(d=>
    `<button class="chip ${d===CUR?'on':''}" onclick="setDay('${d}')">${dayName(d)} ${mday(d)}</button>`).join('') + `</div>`;
  h += readinessCard();
  h += lowBanner();
  const todays = CFG.sessions.filter(s=>s.date===CUR);
  todays.forEach(s=>{ h += missionCard(s); h += (s.kind==='lift') ? liftCard(s) : actCard(s); });
  h += `<div class="foot">Health is the goal. Log the truth. · ${CFG.tag}</div>`;
  a.innerHTML = h;
}

/* ---------- exercise state ---------- */
function xkey(sid){ return CUR + '|' + sid; }
function exState(sid, i){
  const k = xkey(sid); S.x[k] = S.x[k]||{};
  S.x[k][i] = S.x[k][i]||{sets:[],c:'',tags:[],sub:''};
  return S.x[k][i];
}

/* ---------- readiness ---------- */
function rget(){ S.r[CUR] = S.r[CUR]||{}; return S.r[CUR]; }
function rset(f,v){ rget()[f]=v; save(); render(); }
function rateRow(f,label){
  const v = rget()[f];
  return `<div class="lbl">${label}</div><div class="rd">` +
    [1,2,3,4,5].map(n=>`<button class="rb ${v===n?'on':''}" onclick="rset('${f}',${n})">${n}</button>`).join('') + `</div>`;
}
function readinessCard(){
  const r = rget();
  let inner = rateRow('e','Energy') + rateRow('so','Soreness (5 = very sore)') + rateRow('sl','Sleep quality') + rateRow('m','Mood');
  inner += `<div class="grid2" style="margin-top:10px">
    <div><div class="lbl">Bodyweight (lbs)</div><input inputmode="decimal" value="${esc(r.bw||'')}" onchange="rset('bw',this.value)"></div>
    <div><div class="lbl">Sleep (hrs)</div><input inputmode="decimal" value="${esc(r.slh||'')}" onchange="rset('slh',this.value)"></div></div>`;
  if(CFG.whoop){
    inner += `<h3 class="sect">Whoop</h3><div class="grid2">
      <div><div class="lbl">Recovery %</div><input inputmode="numeric" value="${esc(r.rec||'')}" onchange="rset('rec',this.value)"></div>
      <div><div class="lbl">HRV (ms)</div><input inputmode="numeric" value="${esc(r.hrv||'')}" onchange="rset('hrv',this.value)"></div>
      <div><div class="lbl">Resting HR</div><input inputmode="numeric" value="${esc(r.rhr||'')}" onchange="rset('rhr',this.value)"></div>
      <div><div class="lbl">Strain</div><input inputmode="decimal" value="${esc(r.strain||'')}" onchange="rset('strain',this.value)"></div></div>`;
  }
  const filled = ['e','so','sl','m'].filter(f=>r[f]).length;
  return `<details ${filled<4?'open':''}><summary>Daily check-in ${filled===4?'✓':'('+filled+'/4)'}</summary>
    <div class="card">${inner}</div></details>`;
}
function lowBanner(){
  const r = rget();
  const vals = ['e','sl','m'].map(f=>r[f]).filter(Boolean);
  const avg = vals.length===3 ? (vals.reduce((a,b)=>a+b,0) + (r.so?(6-r.so):0)) / (r.so?4:3) : null;
  const whoopLow = CFG.whoop && r.rec && Number(r.rec) < 34;
  if((avg!==null && avg <= 2.5) || whoopLow){
    return `<div class="adjust"><b>Readiness is low today.</b> Option, not an order: keep planned loads, drop the last set of each exercise, and bank recovery. Research: acute readiness-based volume cuts protect long-term progress (autoregulation, Helms 2018). Your call — you set the limits.</div>`;
  }
  return '';
}

/* ---------- mission ---------- */
function missionCard(s){
  const m = CFG.motiv[(doy() + s.date.length) % CFG.motiv.length];
  return `<div class="stitle"><h2>${esc(s.title)}</h2><span class="tag">${esc(s.time||'')}</span></div>
  <div class="card mission"><div class="eyebrow">Today's mission</div>
    <div class="p">${esc(s.why)}</div>
    <div class="r">${esc(s.research)}</div>
    <div class="m">“${esc(m)}”</div></div>`;
}

/* ---------- lift sessions ---------- */
function allEx(s){
  const extra = (S.added[xkey(s.id)]||[]).map(n=>({name:n, sets:3, reps:'8-12', load:'—', rest:90, subs:[], added:true}));
  return s.ex.concat(extra);
}
function liftCard(s){
  let h = '';
  if(s.warmup) h += `<details><summary>Warm-up ramp (2 min — do it)</summary><div class="card small">${esc(s.warmup)}</div></details>`;
  allEx(s).forEach((ex,i)=>{ h += exCard(s,ex,i); });
  h += `<div class="row"><button class="btn" onclick="addEx('${s.id}')">＋ Add exercise</button></div>`;
  h += `<div class="card"><div class="lbl">Session note — how did it go?</div>
    <textarea onchange="snote('${s.id}',this.value)">${esc((S.x[xkey(s.id)]||{}).note||'')}</textarea></div>`;
  return h;
}
function snote(sid,v){ const k=xkey(sid); S.x[k]=S.x[k]||{}; S.x[k].note=v; save(); }

function exCard(s,ex,i){
  const st = exState(s.id,i);
  const planned = ex.sets;
  const nsets = Math.max(planned, st.sets.length + (st.sets.length>=planned?1:0));
  let rows = '';
  for(let si=0; si<nsets; si++){
    const set = st.sets[si]||{};
    rows += `<div class="setrow"><div class="n">${si+1}</div>
      <input placeholder="lbs" inputmode="decimal" id="w_${s.id}_${i}_${si}" value="${esc(set.w||'')}" onchange="setField('${s.id}',${i},${si},'w',this.value)">
      <input placeholder="reps" inputmode="numeric" id="r_${s.id}_${i}_${si}" value="${esc(set.r||'')}" onchange="setField('${s.id}',${i},${si},'r',this.value)">
      <select id="rir_${s.id}_${i}_${si}" onchange="setField('${s.id}',${i},${si},'rir',this.value)">
        <option value="">RIR</option>${[0,1,2,3,4,5].map(n=>`<option ${set.rir===String(n)||set.rir===n?'selected':''}>${n}</option>`).join('')}
        <option ${set.rir==='6+'?'selected':''}>6+</option></select>
      <button class="ck ${set.t?'done':''}" onclick="ckSet('${s.id}',${i},${si},${ex.rest||90})">✓</button></div>`;
  }
  const glOn = S.gl[ex.name];
  const subsOpen = st.showSubs;
  return `<div class="exc">
    <div class="exhead"><div>
      <div class="exname">${esc(ex.name)}${st.sub?` <span class="sub">→ ${esc(st.sub)}</span>`:''}${ex.added?' <span class="sub">(added)</span>':''}</div>
      <div class="target">${ex.sets}×${esc(ex.reps)} @ ${esc(ex.load)} · rest ${fmtRest(ex.rest||90)}</div>
      ${ex.last?`<div class="last">Last: ${esc(ex.last)}</div>`:''}
    </div></div>
    ${ex.cue?`<div class="cue">Coach: ${esc(ex.cue)}</div>`:''}
    ${rows}
    ${glOn?`<div class="gl">🟢 Green light — add load or a rep next time</div>`:''}
    <div class="tags">
      ${CFG.tags.map(t=>`<button class="tg ${t.cls||''} ${(st.tags||[]).includes(t.l)?'on':''}" onclick="tagEx('${s.id}',${i},'${t.l}')">${t.l}</button>`).join('')}
    </div>
    <div class="row">
      ${ex.subs&&ex.subs.length?`<button class="btn" onclick="toggleSubs('${s.id}',${i})">${st.sub?'Change / undo swap':'Machine taken?'}</button>`:''}
      ${ex.mus?`<button class="btn" onclick="toggleMus('${s.id}',${i})">💪 The muscle</button>`:''}
      <button class="btn ghost" onclick="addSetNow('${s.id}',${i})">＋ Set</button>
    </div>
    ${st.showMus&&ex.mus?musFig(ex):''}
    ${subsOpen?`<div class="subs"><div class="lbl" style="margin-top:0">Same muscle, do instead:</div>
      ${st.sub?`<div class="so" style="color:var(--good)" onclick="useSub('${s.id}',${i},'')">↩ Back to original: ${esc(ex.name)}</div>`:''}
      ${ex.subs.map(o=>`<div class="so" onclick="useSub('${s.id}',${i},'${esc(o).replace(/'/g,"\\'")}')">→ ${esc(o)}</div>`).join('')}</div>`:''}
    <div class="lbl">Comment</div>
    <textarea onchange="cmt('${s.id}',${i},this.value)">${esc(st.c||'')}</textarea>
  </div>`;
}
function fmtRest(s){ return s>=120 ? (s/60)+' min' : s+'s'; }
function setField(sid,i,si,f,v){ const st=exState(sid,i); st.sets[si]=st.sets[si]||{}; st.sets[si][f]=v; save(); }
function ckSet(sid,i,si,rest){
  const st = exState(sid,i);
  const w = $('w_'+sid+'_'+i+'_'+si).value, r = $('r_'+sid+'_'+i+'_'+si).value, rir = $('rir_'+sid+'_'+i+'_'+si).value;
  const cur = st.sets[si]||{};
  if(cur.t){ st.sets[si] = {w, r, rir}; save(); render(); stopTimer(); return; }
  const now = Date.now();
  const prev = st.sets[si-1];
  st.sets[si] = {w, r, rir, t: now, rest: prev&&prev.t ? Math.round((now-prev.t)/1000) : null};
  greenCheck(sid,i); save(); render(); startTimer(rest, si+1);
}
function greenCheck(sid,i){
  const s = CFG.sessions.find(x=>x.id===sid); if(!s||!s.ex[i]) return;
  const ex = s.ex[i]; const st = exState(sid,i);
  const doneSets = st.sets.filter(x=>x&&x.t);
  if(doneSets.length >= ex.sets && doneSets.slice(0,ex.sets).every(x=>Number(x.r)>=minRep(ex.reps) && (x.rir==='6+'||Number(x.rir)>=2))){
    S.gl[ex.name] = 1;
  }
}
function tagEx(sid,i,t){ const st=exState(sid,i); st.tags=st.tags||[];
  const ix=st.tags.indexOf(t); if(ix>=0) st.tags.splice(ix,1); else st.tags.push(t); save(); render(); }
function toggleMus(sid,i){ const st=exState(sid,i); st.showMus=!st.showMus; save(); render(); }

  glutes:'<circle cx="43" cy="104" r="8"/><circle cx="59" cy="104" r="8"/>',
  hamstrings:'<ellipse cx="40" cy="134" rx="8" ry="18"/><ellipse cx="62" cy="134" rx="8" ry="18"/>',
  calves:'<ellipse cx="40" cy="170" rx="6" ry="13"/><ellipse cx="62" cy="170" rx="6" ry="13"/>'
 }
};
function bodyOutline(){
  return '<circle class="mbody" cx="51" cy="22" r="12"/>'+
   '<path class="mbody" d="M33 38 h36 a8 8 0 0 1 8 8 v46 a8 8 0 0 1 -8 8 h-36 a8 8 0 0 1 -8 -8 v-46 a8 8 0 0 1 8 -8 z"/>'+
   '<rect class="mbody" x="8" y="44" width="13" height="44" rx="6.5"/>'+
   '<rect class="mbody" x="81" y="44" width="13" height="44" rx="6.5"/>'+
   '<rect class="mbody" x="31" y="100" width="17" height="86" rx="8"/>'+
   '<rect class="mbody" x="54" y="100" width="17" height="86" rx="8"/>';
}
function musFig(ex){
  function fig(side,label){
    const regs = MREG[side];
    let shapes='';
    Object.keys(regs).forEach(k=>{
      const hot = ex.mus.includes(k);
      shapes += '<g class="mreg'+(hot?' hot':'')+'">'+regs[k]+'</g>';
    });
    return '<svg width="104" height="200" viewBox="0 0 102 192">'+shapes+bodyOutline()+
      '<text x="51" y="190" text-anchor="middle" fill="var(--dim)" font-size="9" letter-spacing="2">'+label+'</text></svg>';
  }
  const needF = ex.mus.some(k=>MREG.front[k]), needB = ex.mus.some(k=>MREG.back[k]);
  return '<div class="mfig">'+(needF?fig('front','FRONT'):'')+(needB?fig('back','BACK'):'')+
    (ex.act?'<div class="act">✋ '+esc(ex.act)+'</div>':'')+'</div>';
}
function cmt(sid,i,v){ exState(sid,i).c = v; save(); }
function toggleSubs(sid,i){ const st=exState(sid,i); st.showSubs=!st.showSubs; save(); render(); }
function useSub(sid,i,name){ const st=exState(sid,i); st.sub=name; st.showSubs=false; save(); render(); }
function addSetNow(sid,i){ const st=exState(sid,i); st.sets.push({}); save(); render(); }
function addEx(sid){
  const n = prompt('Exercise name:'); if(!n) return;
  const k = xkey(sid); S.added[k] = S.added[k]||[]; S.added[k].push(n); save(); render();
}

/* ---------- activity sessions (yoga / walks / zone 2) ---------- */
function aget(sid){ const k=xkey(sid); S.act[k]=S.act[k]||{}; return S.act[k]; }
function aset(sid,f,v){ aget(sid)[f]=v; save(); if(f==='done'||f==='feel') render(); }
function actCard(s){
  const a = aget(s.id);
  return `<div class="card">
    ${s.desc?`<div class="small" style="margin-bottom:10px">${esc(s.desc)}</div>`:''}
    <div class="grid2">
      <div><div class="lbl">Duration (min)</div><input inputmode="numeric" value="${esc(a.dur||'')}" onchange="aset('${s.id}','dur',this.value)"></div>
      <div><div class="lbl">${s.distLabel||'Distance (mi)'}</div><input inputmode="decimal" value="${esc(a.dist||'')}" onchange="aset('${s.id}','dist',this.value)"></div>
    </div>
    <div class="lbl">How did it feel? (1 rough – 5 great)</div>
    <div class="rd">${[1,2,3,4,5].map(n=>`<button class="rb ${a.feel===n?'on':''}" onclick="aset('${s.id}','feel',${n})">${n}</button>`).join('')}</div>
    <div class="lbl">Note</div><textarea onchange="aset('${s.id}','c',this.value)">${esc(a.c||'')}</textarea>
    <div style="margin-top:12px"><button class="done-big ${a.done?'on':''}" onclick="aset('${s.id}','done',${a.done?0:1})">${a.done?'✓ Done':'Mark done'}</button></div>
  </div>`;
}

/* ---------- rest timer ---------- */
let TINT = null;
function startTimer(sec, nextSet){
  stopTimer();
  const end = Date.now() + sec*1000;
  $('timer').style.display = 'block';
  $('tlab').textContent = 'Rest · set ' + nextSet + ' next · target ' + fmtRest(sec);
  TINT = setInterval(()=>{
    const left = Math.max(0, end - Date.now());
    const s = Math.ceil(left/1000);
    $('tclock').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    $('tbar').style.width = (left/(sec*1000)*100)+'%';
    if(left<=0){ $('tclock').textContent = 'GO'; clearInterval(TINT);
      if(navigator.vibrate) navigator.vibrate([120,60,120]); }
  }, 250);
}
function stopTimer(){ if(TINT) clearInterval(TINT); $('timer').style.display='none'; }

/* ---------- export ---------- */
function buildExport(){
  let out = CFG.name.toUpperCase() + ' — C&C LOG EXPORT — ' + new Date().toLocaleString() + '\n';
  Object.keys(S.r).sort().forEach(d=>{
    const r = S.r[d]; const has = Object.values(r).some(v=>v);
    if(!has) return;
    out += '\n' + d + ' readiness: E' + (r.e||'-') + ' So' + (r.so||'-') + ' Sl' + (r.sl||'-') + ' M' + (r.m||'-');
    if(r.bw) out += ' | BW ' + r.bw;
    if(r.slh) out += ' | sleep ' + r.slh + 'h';
    if(CFG.whoop && (r.rec||r.hrv)) out += ' | Whoop rec ' + (r.rec||'-') + '% HRV ' + (r.hrv||'-') + ' RHR ' + (r.rhr||'-') + ' strain ' + (r.strain||'-');
  });
  CFG.sessions.forEach(s=>{
    const k = s.date + '|' + s.id;
    if(s.kind==='lift'){
      const x = S.x[k]; if(!x) return;
      let lines = '';
      const extras = S.added[k]||[];
      const names = s.ex.map(e=>e.name).concat(extras);
      names.forEach((nm,i)=>{
        const st = x[i]; if(!st || (!st.sets.length && !st.c && !st.tag)) return;
        const done = st.sets.filter(t=>t&&(t.t||t.w||t.r));
        const setsTxt = done.map(t=>(t.w||'?')+'×'+(t.r||'?')+'@'+(!t.rir?'?':t.rir)+'RIR'+(t.t?'':'(unchecked)')).join(', ');
        const rests = done.map(t=>t.rest).filter(v=>v);
        const avgRest = rests.length ? Math.round(rests.reduce((a,b)=>a+b,0)/rests.length) : null;
        const tEx = (s.ex[i]||{});
        lines += '  ' + nm + (st.sub?' →SUB: '+st.sub:'') + ': ' + (setsTxt||'(no sets)');
        if(avgRest) lines += ' | avg rest ' + avgRest + 's (target ' + (tEx.rest||90) + 's)';
        if(S.gl[nm]) lines += ' | 🟢';
        if(st.tags&&st.tags.length) lines += ' | TAGS: ' + st.tags.join(',');
        if(st.c) lines += ' | "' + st.c + '"';
        lines += '\n';
      });
      if(lines){ out += '\n\n' + s.date + ' · ' + s.title + '\n' + lines; if(x.note) out += '  Session note: "' + x.note + '"\n'; }
    } else {
      const a = S.act[k]; if(!a || (!a.done && !a.dur && !a.c)) return;
      out += '\n\n' + s.date + ' · ' + s.title + ': ' + (a.done?'DONE':'logged') +
        (a.dur?' · '+a.dur+' min':'') + (a.dist?' · '+a.dist:'') + (a.feel?' · felt '+a.feel+'/5':'') + (a.c?' · "'+a.c+'"':'');
    }
  });
  out += '\n\n---JSON---\n' + JSON.stringify(S);
  return out;
}
function exportData(){
  const t = buildExport();
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>{}); ok = true; }
  alert(ok ? 'Log copied. Paste it to Claude.' : 'Copy failed — use Share instead.');
}
function shareData(){
  const t = buildExport();
  if(navigator.share){ navigator.share({title:CFG.name+' training log', text:t}); }
  else exportData();
}
function resetWeek(){
  if(!confirm('Reset for the new week? Make sure you exported first — this clears the week\'s logs. Green lights are kept.')) return;
  S.x={}; S.act={}; S.r={}; S.added={}; save(); VIEW='week'; render();
  alert('Clean slate. Green lights carried forward. See you Monday.');
}

render();
